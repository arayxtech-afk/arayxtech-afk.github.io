  --bad:#F2685A; --bad-soft:rgba(242,104,90,.14); --violet:#A992F5; --violet-soft:rgba(169,146,245,.15);
  --hero:#0E2B49; --hero-ink:#F6F3EE; --toast:#F0EEEA; --toast-ink:#111316; --toast-act:#0B6FAE; --on-bad:#FFFFFF;
  --gider:#5B636D; --scrim:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1113; --surface:#171A1E; --surface2:#21252A; --text:#ECEAE6; --muted:#97A0AA; --line:#2B3037;
  --head:#F6F3EE; --btn:#3FB8FF; --btn-ink:#04131D; --scan:#3FB8FF; --scan-soft:rgba(63,184,255,.14);
  --ok:#43C68A; --ok-soft:rgba(67,198,138,.14); --warn:#EDA746; --warn-soft:rgba(237,167,70,.15);
  --bad:#F2685A; --bad-soft:rgba(242,104,90,.14); --violet:#A992F5; --violet-soft:rgba(169,146,245,.15);
  --hero:#0E2B49; --hero-ink:#F6F3EE; --toast:#F0EEEA; --toast-ink:#111316; --toast-act:#0B6FAE; --on-bad:#FFFFFF;
  --gider:#5B636D; --scrim:rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--scan);outline-offset:2px}

/* üst bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo-btn{border:0;background:none;padding:4px 0;cursor:pointer;color:var(--head);display:flex}
.logo{height:24px;width:auto;display:block}
.logo .beam{fill:var(--scan)}
.sync{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font:600 11px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:8px 11px;border-radius:999px;background:var(--surface2);border:0;cursor:pointer}
.sync i{width:7px;height:7px;border-radius:50%;background:currentColor}
.sync.ok{color:var(--ok)} .sync.local{color:var(--warn)} .sync.err{color:var(--bad)}
main{padding-block:4px calc(100px + env(safe-area-inset-bottom,0px))}

/* sayfa başlığı */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin:18px 0 16px}
.h1{font:700 38px/1 var(--display);color:var(--head);margin:0;letter-spacing:-.005em;text-wrap:balance}
.h2{font:700 26px/1.05 var(--display);color:var(--head);margin:0;text-wrap:balance}
.h3{font:700 20px/1.1 var(--display);color:var(--head);margin:0;letter-spacing:.01em}
.sub{color:var(--muted);margin:6px 0 0;font-size:15px}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:13.5px;color:var(--muted);margin:0}
.err{color:var(--bad);font-size:14.5px;margin:0;font-weight:500}

/* düğmeler */
.btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text);font:600 15.5px/1 var(--body);padding:12px 16px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;min-height:46px;text-decoration:none;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.soft{background:var(--surface2);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:8px 12px;font-size:14px;border-radius:10px}
.btn.sm .ic{width:17px;height:17px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--text)}
.lnk{border:0;background:none;padding:6px 0;font:600 14.5px/1.2 var(--body);color:var(--head);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.lnk.danger{color:var(--bad)}
.lnk.mute{color:var(--muted)}

/* kartlar, döşemeler */
.stack{display:grid;gap:12px}
.stack-l{display:grid;gap:22px}
/* ızgara kutuları uzun yazı yüzünden ekrandan taşmasın */
.stack,.stack-l,.list,.sec,.hb,.tpl,.up,.pc,.spool,.field,.kv{grid-template-columns:minmax(0,1fr)}
.stack>*,.stack-l>*,.list>*,.sec>*,.hb>*,.tpl>*,.up>*,.pc>*,.spool>*,.field>*,.tiles>*,.grid2>*,.grid3>*,.tools>*,.acts>*{min-width:0}
#view,.panel{min-width:0;overflow-x:clip}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card.tint{background:var(--surface2);border-color:transparent}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:7px;min-width:0;align-content:start;text-align:left;cursor:default}
button.tile{cursor:pointer;font:inherit;color:inherit}
.tile .k{font-size:13.5px;color:var(--muted);font-weight:500}
.tile .v{font:700 30px/1 var(--display);color:var(--head);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .s{font-size:12.5px;color:var(--muted);line-height:1.3}
.tile.hero{background:var(--hero);border-color:var(--hero)}
.tile.hero .k,.tile.hero .s{color:var(--hero-ink);opacity:.72}
.tile.hero .v{color:var(--hero-ink)}
.tile.alert{border-color:var(--bad)} .tile.alert .v{color:var(--bad)}
.v.neg{color:var(--bad)!important}

/* satırlar */
.list{display:grid;gap:8px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:inherit;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.row-main{flex:1;min-width:0}
.row-top{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:nowrap}
.row-top b{font-weight:600;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row-top .sp{flex:1}
.ax{font:500 11.5px/1 var(--mono);color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.row-sub{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.row-side{display:grid;justify-items:end;gap:6px;flex:none;text-align:right}
.money{font:600 14.5px/1 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.money.bad{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--body);padding:5px 9px;border-radius:999px;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-teklif{background:var(--violet-soft);color:var(--violet)}
.s-bekliyor{background:var(--warn-soft);color:var(--warn)}
.s-uretimde{background:var(--scan-soft);color:var(--scan)}
.s-tamamlandi{background:var(--ok-soft);color:var(--ok)}
.s-teslim{background:var(--surface2);color:var(--text)}
.s-iptal{background:var(--surface2);color:var(--muted);text-decoration:line-through}
.s-acil{background:var(--bad-soft);color:var(--bad)}
.s-acil::before{display:none}
.due{font:600 11.5px/1 var(--mono);white-space:nowrap;color:var(--muted)}
.due.bad{color:var(--bad)} .due.warn{color:var(--warn)} .due.ok{color:var(--ok)}

/* filtre çipleri */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 13px;font:600 14px/1 var(--body);color:var(--text);cursor:pointer}
.chip.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.chip .n{font-family:var(--mono);font-size:11.5px;opacity:.72;margin-left:5px}
.rchips{display:flex;flex-wrap:wrap;gap:7px}
.rchip{position:relative;cursor:pointer}
.rchip input{position:absolute;opacity:0;pointer-events:none}
.rchip span{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 12px;font:600 14px/1 var(--body)}
.rchip input:checked+span{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.rchip input:focus-visible+span{outline:2px solid var(--scan);outline-offset:2px}

/* sekmeler */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;padding:11px 6px;font:600 14.5px/1 var(--body);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg .d{width:8px;height:8px;border-radius:50%}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:12px 2px;border:0;background:none;font:600 16px/1 var(--body);color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap;cursor:pointer;display:flex;align-items:center}
.tabs button.on{color:var(--head);border-color:var(--head)}
.badge{font:600 11px/1 var(--mono);background:var(--surface2);padding:4px 7px;border-radius:7px;margin-left:7px;color:var(--text)}

/* alt menü */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.nav button{border:0;background:none;color:var(--muted);display:grid;justify-items:center;gap:5px;padding:8px 2px 7px;border-radius:12px;font:600 11.5px/1 var(--body);cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
.nav button .ic{width:22px;height:22px}
.nav button.on{color:var(--head);background:var(--surface2)}
.nav .dot{position:absolute;top:3px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:var(--on-bad);font:700 10px/17px var(--mono);padding:0 4px;text-align:center}

/* bölüm başlıkları */
.sec{display:grid;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h .n{font:600 12px/1 var(--mono);color:var(--muted)}
.sec-h.bad .h3{color:var(--bad)}

/* boş durum */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:30px 20px;text-align:center;display:grid;justify-items:center;gap:8px}
.empty .ic-wrap{width:54px;height:54px;border-radius:15px;background:var(--surface2);display:grid;place-items:center;color:var(--muted);margin-bottom:4px}
.empty .ic{width:26px;height:26px}
.empty b{font:700 21px/1.1 var(--display);color:var(--head)}
.empty p{margin:0;color:var(--muted);max-width:36ch}

/* karşılama */
.welcome{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:22px 20px;display:grid;gap:14px}
.welcome h2{font:700 30px/1.02 var(--display);margin:0;text-wrap:balance}
.welcome p{margin:0;opacity:.8}
.welcome ol{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.welcome li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.welcome li::before{content:counter(s);font:600 12px/24px var(--mono);width:24px;height:24px;border-radius:50%;border:1.5px solid #3FB8FF;color:#3FB8FF;text-align:center;flex:none}
.welcome .btns{display:flex;flex-wrap:wrap;gap:8px}
.welcome .btn{border-color:transparent}
.welcome .btn.pri{background:#3FB8FF;color:#04131D;border-color:#3FB8FF}
.welcome .btn.ghost{background:transparent;color:var(--hero-ink);border-color:rgba(246,243,238,.35)}

.notebar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--text);border-radius:14px;padding:10px 14px;font-size:14.5px}
.notebar.info{background:var(--scan-soft)}

/* üretim kartı */
.pc{display:grid;gap:10px;cursor:pointer}
.pl{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.pl li{display:flex;justify-content:space-between;gap:10px;font-size:15px;min-width:0}
.pl li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl li em{font:500 12px/1.6 var(--mono);font-style:normal;color:var(--muted);white-space:nowrap}
.pl li.ok span{text-decoration:line-through;color:var(--muted)}
.pc-act{display:flex;justify-content:flex-end;gap:8px}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--scan);border-radius:3px}
.bar.ok span{background:var(--ok)} .bar.bad span{background:var(--bad)} .bar.warn span{background:var(--warn)}
.queue{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;font-size:14.5px}
.queue b{font:600 15px var(--mono)}

/* yükleme takibi */
.up{display:grid;gap:10px}
.up-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.up-top b{font-weight:600;font-size:16px}
.up-chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.up-chips.one{grid-template-columns:1fr}
.upc{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;cursor:pointer;font:600 13.5px/1.2 var(--body);text-align:left;min-width:0;overflow:hidden}
.upc span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upc em{font-style:normal;font:600 11.5px/1 var(--mono);white-space:nowrap}
.upc.u-degerlendir em{color:var(--warn)}
.upc.u-yuklenecek{border-color:var(--scan)} .upc.u-yuklenecek em{color:var(--scan)}
.upc.u-yuklendi em{color:var(--ok)}
.upc.u-uygunDegil{opacity:.6} .upc.u-uygunDegil em{color:var(--muted)}
.lic{font:600 11px/1 var(--mono);padding:4px 7px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.lic.no{background:var(--bad-soft);color:var(--bad)}

/* alt pencere */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet.l2{z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s ease}
.panel{position:relative;width:100%;max-width:640px;max-height:90vh;max-height:calc(100dvh - env(safe-area-inset-top,0px) - 16px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--surface);border-radius:22px 22px 0 0;padding:6px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(28px);opacity:0;transition:transform .24s ease,opacity .2s ease}
.sheet.open .scrim{opacity:1}
.sheet.open .panel{transform:none;opacity:1}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 6px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:-6px;background:var(--surface);padding:8px 0 10px;z-index:3}
.sh-tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.sh-title{font:700 28px/1.05 var(--display);color:var(--head);margin:0;text-wrap:balance;overflow-wrap:anywhere}
.sh-foot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--surface);padding:12px 0 calc(18px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-18px - env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;border-top:1px solid var(--line);z-index:3}
.sh-foot.one{grid-template-columns:1fr}
@media (min-width:700px){ .sheet{align-items:center;padding:24px} .panel{border-radius:22px;max-height:88vh} .sh-foot{bottom:-18px;margin-bottom:-18px;padding-bottom:18px} }
@media (prefers-reduced-motion:reduce){ .panel,.scrim{transition:none} }

/* form */
.field{display:grid;gap:7px;min-width:0}
.field>span,.lbl{font-size:14px;color:var(--muted);font-weight:500}
.lbl{display:block;margin-bottom:8px}
.inp{display:block;width:100%;min-width:0;font:400 16px/1.3 var(--body);color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;min-height:48px;appearance:none;-webkit-appearance:none}
textarea.inp{min-height:92px;resize:vertical;line-height:1.45}
.inp:focus{border-color:var(--scan);outline:none;box-shadow:0 0 0 3px var(--scan-soft)}
.inp.ro{display:flex;align-items:center;background:var(--surface2);border-color:transparent;font-family:var(--mono)}
input[type=date].inp{text-align:left}
input[type=date].inp::-webkit-date-and-time-value{text-align:left}
input[type=date].inp::-webkit-calendar-picker-indicator{opacity:.6}
.inp::placeholder{color:var(--muted);opacity:.75}
.sel{position:relative;min-width:0}
.sel::after{content:"";position:absolute;right:16px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel select{padding-right:38px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.check{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;min-height:48px;align-self:end}
.check input{width:22px;height:22px;accent-color:var(--btn);margin:0}
.part{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:9px;background:var(--surface2)}
.part .inp{background:var(--surface)}
.part-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.part-h b{font-weight:600}
details.more{border:1px solid var(--line);border-radius:14px;padding:0 14px}
details.more summary{cursor:pointer;padding:14px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font:600 18px/1 var(--mono);color:var(--muted)}
details.more[open] summary::after{content:"−"}
details.more>.stack{padding-bottom:14px}
.oneri{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--scan-soft);border-radius:12px;padding:11px 13px}
.oneri>div{display:grid;gap:3px}
.oneri b{font-size:16px}
.oneri .btn{margin-left:auto}

/* detay */
.contact{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.contact .mono{font-size:15px;margin-right:4px}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 2px 9px;font:600 12.5px/1.1 var(--body);color:var(--muted);display:grid;justify-items:center;gap:7px;cursor:pointer;min-width:0}
.steps button i{width:11px;height:11px;border-radius:50%;border:2px solid currentColor}
.steps button.done{color:var(--ok)}
.steps button.done i{background:currentColor}
.steps button.cur{border-color:var(--scan);color:var(--text);background:var(--scan-soft)}
.steps button.cur i{background:var(--scan);border-color:var(--scan)}

  const arr=S[kind];const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj);

  if(db){const path=COL[kind]+'/'+obj.id;const body=clone(obj);dbWrite(path,()=>db.doc(path).set(body));}else saveLocal();
}
function del(kind,id){
  if(S.readOnly){toast('Bu görünümde değişiklik yapılamıyor.');return;}
  S[kind]=S[kind].filter(x=>x.id!==id);render();
  if(db){const path=COL[kind]+'/'+id;dbWrite(path,()=>db.doc(path).delete());}else saveLocal();
}
function putSettings(silent){
  if(S.readOnly)return;
  if(!silent)render();
  if(db){const body=clone(S.settings);dbWrite('ayarlar/genel',()=>db.doc('ayarlar/genel').set(body));}else saveLocal();
}
async function putMany(items){ // [[kind,obj],...]
  if(S.readOnly){toast('Bu görünümde değişiklik yapılamıyor.');return;}
  const now=new Date().toISOString();
  for(const [k,o] of items){o.guncelleme=now;const a=S[k];const i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else a.push(o);}
  render();
  if(!db){saveLocal();return;}
  S.saving++;renderSync();
  try{for(const [k,o] of items){const path=COL[k]+'/'+o.id;const body=clone(o);await enqueue(path,()=>withRetry(()=>db.doc(path).set(body)));}S.err=false;}
  catch(e){writeFail(e);}finally{S.saving--;renderSync();}
}
async function delMany(items){ // [[kind,id]]
  for(const [k,id] of items)S[k]=S[k].filter(x=>x.id!==id);
  render();
  if(!db){saveLocal();return;}
  S.saving++;renderSync();
  try{for(const [k,id] of items){const path=COL[k]+'/'+id;await enqueue(path,()=>withRetry(()=>db.doc(path).delete()));}}
  catch(e){writeFail(e);}finally{S.saving--;renderSync();}
}

function useLocal(){
  S.mode='local';
  let had=false;
  try{const raw=localStorage.getItem(LS_KEY);if(raw){had=true;const d=JSON.parse(raw);S.orders=d.orders||[];S.entries=d.entries||[];S.spools=d.spools||[];S.settings=mergeSet(d.settings);}}catch(e){}
  S.loaded=true;render();
  if(!had)setTimeout(()=>detectOld().catch(()=>{}),400);
}
async function init(){
  renderNav();render();
  const c=window.claude;
  if(!c||typeof c.use!=='function'){useLocal();return;}
  try{db=await c.use('db');}catch(e){db=null;}
  if(!db){useLocal();return;}
  S.mode='cloud';
  c.use('assets').then(a=>{assets=a;if(UI.sheet&&UI.sheet.type==='detail')refreshDetail();}).catch(()=>{});
  c.use('downloads').then(d=>{downloads=d;}).catch(()=>{});
  c.use('user').then(u=>{if(u&&u.can)u.can('data.write').then(w=>{if(w===false){S.readOnly=true;render();}}).catch(()=>{});}).catch(()=>{});
  let waiting=4;
  const first=()=>{waiting--;if(waiting<=0&&!S.loaded){S.loaded=true;}render();};
  const subErr=e=>{S.err=true;renderSync();if(e&&e.code==='revoked'){toast('Bu sayfaya erişim değişti; sayfayı yenile.');}};
  for(const [kind,col] of Object.entries(COL)){
    let f=true;
    db.collection(col).onSnapshot(snap=>{S[kind]=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));if(f){f=false;first();}else render();},subErr);
  }
  let fs=true;
  db.doc('ayarlar/genel').onSnapshot(snap=>{S.settings=mergeSet(snap.exists?snap.data():null);if(fs){fs=false;first();}else render();},subErr);
  setTimeout(()=>{if(!S.loaded){S.loaded=true;render();}},9000);
}

/* ---------- hesaplar ---------- */
const getO=id=>{const o=S.orders.find(x=>x.id===id);return o?clone(o):null;};
const adet=p=>Math.max(1,Math.round(num(p.adet))||1);
const oGram=o=>sum(o.parcalar||[],p=>num(p.gram)*adet(p));
const oSaat=o=>sum(o.parcalar||[],p=>num(p.sure)*adet(p));
const oOdenen=o=>sum(o.odemeler||[],p=>num(p.tutar));
const oKalan=o=>o.durum==='iptal'?0:Math.max(0,num(o.fiyat)-oOdenen(o));
function komOran(k){const c=S.settings.kom;if(k==='Trendyol')return {p:num(c.trendyol)/100,s:0};if(k==='Hepsiburada')return {p:num(c.hepsiburada)/100,s:num(c.hbSabit)};return {p:0,s:0};}
function oMaliyet(o){
  const st=S.settings,g=oGram(o),sa=oSaat(o),fiyat=num(o.fiyat);
  const fil=g*(1+num(st.fire)/100)*num(st.filamentKg)/1000, mak=sa*num(st.makineSaat), isc=num(o.iscilik)*num(st.iscilikSaat);
  const amb=(o.parcalar||[]).length?num(st.ambalaj):0, kargo=num(o.kargo);
  const k=komOran(o.kanal), kom=fiyat?fiyat*k.p+k.s:0, kdv=fiyat*num(st.kdv)/(100+num(st.kdv));
  const top=fil+mak+isc+amb+kargo;
  return {g,sa,fil,mak,isc,amb,kargo,kom,kdv,top,net:fiyat-kdv-kom-top};
}
function oneriFiyat(top,kanal){const st=S.settings,k=komOran(kanal),kdv=num(st.kdv)/100,payda=1/(1+kdv)-k.p;if(payda<=0)return 0;return Math.ceil(((top+num(st.hedefKar)+k.s)/payda)/5)*5;}
function dueInfo(o){
  if(!o.termin||!ACIK.includes(o.durum)||o.durum==='teklif')return null;
  if(o.durum==='tamamlandi')return {t:'Hazır',c:'ok'};
  const d=diffDays(o.termin,todayStr());
  if(d<0)return {t:`${-d} gün gecikti`,c:'bad'};
  if(d===0)return {t:'Bugün',c:'warn'};
  if(d===1)return {t:'Yarın',c:'warn'};
  return {t:`${d} gün kaldı`,c:''};
}
const isLate=o=>['bekliyor','uretimde'].includes(o.durum)&&o.termin&&o.termin<todayStr();
const partsText=o=>(o.parcalar||[]).map(p=>(adet(p)>1?adet(p)+'× ':'')+p.ad).join(', ');
const aracText=o=>{const a=[...new Set((o.parcalar||[]).map(p=>p.arac).filter(Boolean))];return a.join(', ');};
function upState(p,plat){return p.lisans==='indirilen'?'uygunDegil':((p.yukleme&&p.yukleme[plat])||'degerlendir');}
function uploadItems(){
  const out=[];
  S.orders.filter(o=>o.durum==='tamamlandi'||o.durum==='teslim').forEach(o=>(o.parcalar||[]).forEach(p=>out.push({o,p})));
  return out.sort((a,b)=>String(b.o.tamamlanmaTarihi||b.o.tarih).localeCompare(String(a.o.tamamlanmaTarihi||a.o.tarih)));
}
const upTodo=it=>PLAT.some(pl=>['degerlendir','yuklenecek'].includes(upState(it.p,pl.k)));
function nextAx(){
  const st=S.settings,y=new Date().getFullYear();
  if(num(st.axYil)!==y){st.axYil=y;st.axSayac=0;}
  const pre=`AX-${y}-`;
  const mx=Math.max(0,...S.orders.filter(o=>String(o.ax||'').startsWith(pre)).map(o=>parseInt(String(o.ax).slice(pre.length),10)||0));
  st.axSayac=Math.max(num(st.axSayac),mx)+1;
  putSettings(true);
  return pre+pad(st.axSayac,4);
}
function ayOzet(k){
  const tes=S.orders.filter(o=>o.durum==='teslim'&&monthKey(o.teslimTarihi||o.tarih)===k);
  const ek=S.entries.filter(e=>e.tip==='gelir'&&monthKey(e.tarih)===k);
  const gid=S.entries.filter(e=>e.tip==='gider'&&monthKey(e.tarih)===k);
  const sipGelir=sum(tes,o=>num(o.fiyat)),ekGelir=sum(ek,e=>num(e.tutar)),gider=sum(gid,e=>num(e.tutar));
  const gram=sum(S.orders.filter(o=>(o.durum==='tamamlandi'||o.durum==='teslim')&&monthKey(o.tamamlanmaTarihi||o.teslimTarihi||o.tarih)===k),oGram);
  let tahsil=0;S.orders.forEach(o=>(o.odemeler||[]).forEach(p=>{if(monthKey(p.tarih)===k)tahsil+=num(p.tutar);}));
  return {tes,ek,gid,sipGelir,ekGelir,gelir:sipGelir+ekGelir,gider,kar:sipGelir+ekGelir-gider,gram,tahsil};
}
function dusStok(o){
  if(o.stokDusuldu)return 0;
  const ch=new Map();
  for(const p of o.parcalar||[]){
    let need=num(p.gram)*adet(p);if(!need||!p.malzeme)continue;
    const c=S.spools.filter(s=>s.malzeme===p.malzeme&&num(s.kalan)>0).map(s=>ch.get(s.id)||clone(s)).filter(s=>num(s.kalan)>0)
      .sort((a,b)=>(b.aktif?1:0)-(a.aktif?1:0)||num(a.kalan)-num(b.kalan));
    for(const s of c){if(need<=0)break;const take=Math.min(need,num(s.kalan));s.kalan=Math.round((num(s.kalan)-take)*10)/10;need-=take;ch.set(s.id,s);}
  }
  o.stokDusuldu=true;
  ch.forEach(s=>put('spools',s,true));
  return ch.size;
}
function waLink(phone,text){let d=String(phone||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='90'+d.slice(1);else if(d.length===10&&d[0]==='5')d='90'+d;if(d.length<11)return null;return `https://wa.me/${d}`+(text?`?text=${encodeURIComponent(text)}`:'');}
const tplText=k=>{const s=S.settings.sablon||{};if(s[k]!=null)return s[k];const t=SABLON.find(x=>x.k===k);return t?t.t:'';};
function fillTpl(t,o){
  const k=o?oKalan(o):0;
  const map={ad:o?(o.musteri||''):'',musteri:o?o.musteri:'',parca:o?partsText(o):'',fiyat:o?tl(o.fiyat):'',kalan:tl(k),kalan_satir:k>0?`Kalan ödeme ${tl(k)}. `:'',ax:o?(o.ax||''):'',takip:o&&o.takip?o.takip:'—',gun:String(S.settings.terminGun)};
  return t.replace(/\{(\w+)\}/g,(m,v)=>map[v]!=null?map[v]:m);
}

function chart6(k){
  const ms=[...Array(6)].map((_,i)=>shiftMonth(k,i-5)),d=ms.map(m=>{const a=ayOzet(m);return {m,g:a.gelir,c:a.gider,k:a.kar};});

  const mx=Math.max(1,...d.map(x=>Math.max(x.g,x.c)));
  const W=340,H=176,pl=6,pr=6,pt=22,pb=34,ch=H-pt-pb,gw=(W-pl-pr)/6,bw=Math.min(18,(gw-14)/2);
  let s='';
  s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${pt}" y2="${pt}"/><text x="${pl}" y="${pt-7}">${esc(tl(mx))}</text>`;
  d.forEach((x,i)=>{const cx=pl+gw*i+gw/2,hg=x.g/mx*ch,hc=x.c/mx*ch,cur=i===5;
    s+=`<g class="${cur?'':'dim'}"><rect class="g" x="${cx-bw-1.5}" y="${pt+ch-hg}" width="${bw}" height="${Math.max(0,hg)}" rx="3"/><rect class="c" x="${cx+1.5}" y="${pt+ch-hc}" width="${bw}" height="${Math.max(0,hc)}" rx="3"/></g>`;
    const [,mm]=x.m.split('-').map(Number);
    s+=`<text x="${cx}" y="${H-pb+15}" text-anchor="middle" style="${cur?'fill:var(--text);font-weight:600':''}">${AYK[mm-1]}</text><text x="${cx}" y="${H-pb+28}" text-anchor="middle" style="fill:${x.k<0?'var(--bad)':'var(--muted)'}">${x.g||x.c?esc(kisa(x.k)):''}</text>`;});
  s+=`<line class="base" x1="${pl}" x2="${W-pr}" y1="${pt+ch}" y2="${pt+ch}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Son 6 ay gelir ve gider">${s}</svg>`;
}
const kisa=n=>{const a=Math.abs(n),sg=n<0?'−':'';if(a>=1e6)return sg+nf1.format(a/1e6)+' mn';if(a>=1e3)return sg+nf1.format(a/1e3)+' b';return sg+nf0.format(a);};
function accOzet(k,a){

     <p style="margin:0">${a.gelir||a.gider?`Kâr ${tl(a.kar)}; gelirin %${a.gelir?nf0.format(Math.max(0,a.kar)/a.gelir*100):0}'i cepte kaldı.`:'Bu aya ait gelir veya gider kaydı henüz yok.'}</p>
     <p class="hint">Sipariş geliri ${tl(a.sipGelir)} · eklenen gelir ${tl(a.ekGelir)} · tahsil edilen ${tl(a.tahsil)} · ${nf1.format(a.gram/1000)} kg filament.</p></div>
   <div class="card stack"><div class="sec-h"><h3 class="h3">Son 6 ay</h3><div class="legend"><span><i style="background:var(--scan)"></i>Gelir</span><span><i style="background:var(--gider)"></i>Gider</span></div></div>${chart6(k)}<p class="hint">Çubukların altındaki sayı o ayın kârı (b = bin TL).</p></div>
   <div class="card stack"><div class="sec-h"><h3 class="h3">Giderler nereye gitti?</h3><span class="n">${a.gid.length} kayıt · ${tl(a.gider)}</span></div>${catI.length?hbars(catI):'<p class="hint">Bu ay gider eklenmedi.</p>'}</div>
   <div class="card stack"><div class="sec-h"><h3 class="h3">Gelir hangi kanaldan?</h3><span class="n">${tl(a.gelir)}</span></div>${knI.length?hbars(knI):'<p class="hint">Bu ay gelir yok.</p>'}</div>
   <div class="card stack"><div><h3 class="h3">Önceki ayla karşılaştırma</h3><p class="hint" style="margin-top:4px">${monthName(shiftMonth(k,-1))} → ${monthName(k)}</p></div>
    ${hasPrev?`<div class="tbl"><table class="cmp"><thead><tr><th></th><th>Önceki</th><th>Bu ay</th><th>Fark</th></tr></thead><tbody>
     <tr><td>Gelir</td><td>${tl(p.gelir)}</td><td>${tl(a.gelir)}</td>${dl(a.gelir,p.gelir)}</tr>

    ${k===monthKey(todayStr())?'<p class="hint">Devam eden ayın rakamları ay ilerledikçe değişir.</p>':''}</div>
   <p class="hint">Sipariş geliri teslim ayına, eklenen gelir kendi tarihine, filament tamamlanma ayına, giderler gider tarihine göre sayılır. Kâr yalnızca kaydettiğin giderleri içerir; filament tüketimi kendiliğinden gider oluşturmaz (filamenti satın aldığında gider olarak gir).</p>

   <div id="fhOut">${fhOut()}</div></div>`;

function fhCalc(){
  const st=S.settings,v=UI.fh,kdv=num(st.kdv)/100;
  const fil=num(v.gram)*(1+num(st.fire)/100)*num(st.filamentKg)/1000,mak=num(v.saat)*num(st.makineSaat),isc=num(v.isc)*num(st.iscilikSaat),amb=num(st.ambalaj),top=fil+mak+isc+amb;
  const c=st.kom,K=[{ad:'Atölye (DM / WhatsApp)',p:0,s:0,k:''},{ad:`Web sitesi · ödeme %${nf1.format(num(c.site))}`,p:num(c.site)/100,s:0,k:''},{ad:`Trendyol · %${nf1.format(num(c.trendyol))}`,p:num(c.trendyol)/100,s:0,k:'Trendyol'},{ad:`Hepsiburada · %${nf1.format(num(c.hepsiburada))} + ${tl(c.hbSabit)}`,p:num(c.hepsiburada)/100,s:num(c.hbSabit),k:'Hepsiburada'}];
  const rows=K.map(x=>{const payda=1/(1+kdv)-x.p;if(payda<=0)return Object.assign({},x,{hata:true});const P=Math.ceil(((top+num(v.kar)+x.s+num(v.kargo))/payda)/5)*5;const kdvT=P*kdv/(1+kdv),kom=P*x.p+x.s;return Object.assign({},x,{P,kdvT,kom,net:P-kdvT-kom-num(v.kargo)-top});});
  return {fil,mak,isc,amb,top,rows};
}

/* ---------- çizim ---------- */
function render(){
  const v=$('#view');if(!v)return;
  const keep={};$$('[data-keep]',v).forEach(el=>{if(el.id)keep[el.id]=el.value;});
  const ae=document.activeElement;let f=null;
  if(ae&&v.contains(ae)&&ae.id&&/INPUT|TEXTAREA/.test(ae.tagName)){f={id:ae.id};try{f.s=ae.selectionStart;f.e=ae.selectionEnd;}catch(e){}}
  v.innerHTML=S.loaded?VIEWS[UI.tab]():'<div class="loading">Kayıtlar yükleniyor…</div>';
  Object.keys(keep).forEach(id=>{const el=document.getElementById(id);if(el)el.value=keep[id];});
  if(f){const el=document.getElementById(f.id);if(el){el.focus({preventScroll:true});try{if(f.s!=null)el.setSelectionRange(f.s,f.e);}catch(e){}}}
  renderNav();renderSync();
  if(UI.sheet&&UI.sheet.type==='detail')refreshDetail();
}
function renderNav(){
  const late=S.orders.filter(isLate).length;
  const N=[['bugun','home','Bugün',late],['siparisler','box','Siparişler',0],['uretim','layers','Üretim',0],['muhasebe','wallet','Muhasebe',0],['araclar','tools','Araçlar',0]];
  $('#nav').innerHTML=N.map(([k,ic,l,n])=>`<button class="${UI.tab===k?'on':''}" data-act="tab" data-tab="${k}" aria-current="${UI.tab===k?'page':'false'}">${icon(ic)}<span>${l}</span>${n?`<span class="dot">${n}</span>`:''}</button>`).join('');
}
function renderSync(){
  const el=$('#sync');if(!el)return;
  let c='',t='Bağlanıyor';
  if(S.mode==='local'){c='local';t='Bu cihazda';}
  else if(S.mode==='cloud'){if(S.err){c='err';t='Kaydedilemedi';}else if(S.saving){c='';t='Kaydediliyor';}else{c='ok';t='Bulutta';}}
  el.className='sync '+c;el.querySelector('span').textContent=t;
}

const sheetT={1:null,2:null};
function openSheet(html,meta,l){
  l=l||1;const root=$('#sheet'+l);clearTimeout(sheetT[l]);
  root.innerHTML=`<div class="scrim" data-act="closeSheet" data-l="${l}"></div><div class="panel" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  root.hidden=false;if(l===1)UI.sheet=meta||{type:'x'};else UI.sheet2=meta||{type:'x'};
  document.body.classList.add('locked');
  requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.add('open')));
  return $('.panel',root);
}
function closeSheet(l){
  l=Number(l)||1;if(l===1)closeSheet(2);
  const root=$('#sheet'+l);if(!root||root.hidden)return;
  root.classList.remove('open');if(l===1)UI.sheet=null;else UI.sheet2=null;
  sheetT[l]=setTimeout(()=>{root.hidden=true;root.innerHTML='';if($('#sheet1').hidden&&$('#sheet2').hidden)document.body.classList.remove('locked');},220);
}

/* ---------- içe aktarma ---------- */
function pick(o,keys){if(!o||typeof o!=='object')return undefined;const m={};Object.keys(o).forEach(k=>{m[norm(k)]=o[k];});for(const k of keys){if(m[k]!=null&&m[k]!=='')return m[k];}return undefined;}
function toYmd(v){if(!v)return '';if(typeof v==='number'){const d=new Date(v<1e12?v*1000:v);return isNaN(d)?'':ymd(d);}const s=String(v);if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const m=s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})/);if(m)return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;const d=new Date(s);return isNaN(d)?'':ymd(d);}
function mapDurum(v){const n=norm(v);if(!n)return 'bekliyor';if(/iptal|cancel/.test(n))return 'iptal';if(/teslim|deliver/.test(n))return 'teslim';if(/tamam|complet|done|finish|ready|bitti/.test(n))return 'tamamlandi';if(/uret|prod|progress|print|basil/.test(n))return 'uretimde';if(/teklif|quote|offer/.test(n))return 'teklif';return 'bekliyor';}
function mapYuk(v){const n=norm(typeof v==='object'&&v?(pick(v,['status','durum','state'])||''):v);if(!n)return null;if(/uygundegil|notsuit|unsuit|notapplicable|^na$|skip|hayir|false/.test(n))return 'uygunDegil';if(/yuklenecek|todo|pending|tobeupl|ready/.test(n))return 'yuklenecek';if(/yuklendi|uploaded|done|published|true|yayin/.test(n))return 'yuklendi';return 'degerlendir';}
function collectArrays(obj,key,depth,out){if(depth>5||obj==null)return out;if(Array.isArray(obj)){if(obj.length&&typeof obj[0]==='object')out.push({key:norm(key),arr:obj});return out;}if(typeof obj==='object'){if(typeof obj.data==='string'){try{collectArrays(JSON.parse(obj.data),key,depth+1,out);}catch(e){}}Object.keys(obj).forEach(k=>{let v=obj[k];if(typeof v==='string'&&/^[\[{]/.test(v.trim())){try{v=JSON.parse(v);}catch(e){}}collectArrays(v,k,depth+1,out);});}return out;}
function parseImport(data){
  if(data&&data.app==='arayx-is-takibi')return {orders:data.siparisler||[],entries:data.kayitlar||[],spools:data.makaralar||[],settings:data.ayarlar||null,kaynak:'Bu uygulamanın yedeği'};
  const arrs=collectArrays(data,'',0,[]);const res={orders:[],entries:[],spools:[],settings:null,kaynak:'Eski uygulamanın yedeği'};
  const looksOrder=x=>pick(x,['customername','customer','musteri','musteriadi','musteriad','client','clientname','adsoyad'])!=null||pick(x,['parts','parcalar','items'])!=null;
  for(const {key,arr} of arrs){
    let kind=null;
    if(/order|siparis|job|is$|isler/.test(key))kind='o';else if(/income|gelir|revenue/.test(key))kind='g';else if(/expense|gider|cost|masraf/.test(key))kind='c';
    else if(arr.every(looksOrder))kind='o';
    if(kind==='o'){arr.forEach(x=>{if(!looksOrder(x))return;const o=importOrder(x);if(o)res.orders.push(o);});}
    if(kind==='g'||kind==='c'){arr.forEach(x=>{const e=importEntry(x,kind==='c'?'gider':'gelir');if(e)res.entries.push(e);});}
  }
  return res;
}
function importOrder(x){
  const rawParts=pick(x,['parts','parcalar','items','parca','urunler'])||[];
  const partsArr=Array.isArray(rawParts)?rawParts:String(rawParts).split(/[,\n]/);
  const total=num(pick(x,['filamentgrams','totalfilament','filamentgram','filament','filamentusage','kullanilanfilament','toplamfilament','grams','gram']));
  const parcalar=partsArr.map(p=>{
    const np=newPart();
    if(typeof p==='string'){np.ad=p.trim();}
    else if(p&&typeof p==='object'){np.ad=String(pick(p,['name','ad','partname','parcaadi','title','isim'])||'').trim();np.arac=String(pick(p,['vehicle','arac','car','model'])||'');np.adet=Math.max(1,Math.round(num(pick(p,['quantity','adet','qty','count'])))||1);np.gram=num(pick(p,['grams','gram','filament','weight']));
      if(np.ad){Object.keys(p).forEach(k=>{const n=norm(k);let v=p[k];if(/cults/.test(n)){const s=mapYuk(v);if(s)np.yukleme.cults=s;}if(/trendyol/.test(n)){const s=mapYuk(v);if(s)np.yukleme.trendyol=s;}if(v&&typeof v==='object'&&!Array.isArray(v)&&/upload|yukleme|platform/.test(n)){Object.keys(v).forEach(k2=>{const n2=norm(k2),s=mapYuk(v[k2]);if(s&&/cults/.test(n2))np.yukleme.cults=s;if(s&&/trendyol/.test(n2))np.yukleme.trendyol=s;});}});}}
    return np;}).filter(p=>p.ad);
  if(!parcalar.length)parcalar.push(Object.assign(newPart(),{ad:'Parça'}));
  if(total&&!parcalar.some(p=>p.gram)){parcalar[0].gram=total/adet(parcalar[0]);}
  const durum=mapDurum(pick(x,['status','durum','state','siparisdurumu']));

/* ---------- fotoğraf ---------- */
async function compress(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const r=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*r),h=Math.round(img.naturalHeight*r);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',0.82));}
  catch(e){return file;}finally{URL.revokeObjectURL(url);}
}

      const r=parseImport(data);
      if(!r.orders.length&&!r.entries.length&&!r.spools.length){openSheet(`<div class="sh-head"><h2 class="sh-title">Kayıt bulunamadı</h2></div><p style="margin:0 0 14px">Bu dosyada tanıdığım bir sipariş veya gelir/gider listesi yok. Dosyayı Claude'a gönderirsen aktarımı ona göre ayarlar.</p><div class="sh-foot one"><button class="btn pri" data-act="closeSheet" data-l="2">Tamam</button></div>`,{type:'imp'},2);return;}
      importPreview(r,'Yedek aktarılsın mı?',f.name);
    };
    rd.onerror=()=>toast('Dosya okunamadı.');rd.readAsText(f);
  },
};
function importPreview(r,title,fname){
      const ex=new Set(S.orders.map(o=>o.id));const dup=r.orders.filter(o=>ex.has(o.id)).length;
      UI.importData=r;
      const st={};r.orders.forEach(o=>{st[o.durum]=(st[o.durum]||0)+1;});
      openSheet(`<div class="sh-head"><h2 class="sh-title">${esc(title)}</h2></div><p class="sub" style="margin:0 0 12px">${esc(r.kaynak)}${fname?' · '+esc(fname):''}</p>
       <div class="card"><div class="kv"><div><span>Sipariş</span><b>${r.orders.length}</b></div>${Object.keys(st).map(k=>`<div><span style="padding-left:12px">${DURUM[k]}</span><b>${st[k]}</b></div>`).join('')}<div><span>Gelir kaydı</span><b>${r.entries.filter(e=>e.tip==='gelir').length}</b></div><div><span>Gider kaydı</span><b>${r.entries.filter(e=>e.tip==='gider').length}</b></div>${r.spools.length?`<div><span>Makara</span><b>${r.spools.length}</b></div>`:''}</div></div>
       ${dup?`<p class="hint" style="margin-top:10px">${dup} sipariş zaten var; onlar yedekteki haliyle güncellenir.</p>`:''}
       ${r.kaynak.startsWith('Eski')?'<p class="hint" style="margin-top:10px">Teslim edilmiş eski siparişler "ödendi" sayılır. Aktarımdan sonra birkaç siparişi açıp kontrol et.</p>':''}
       <div class="sh-foot" style="margin-top:14px"><button class="btn" data-act="closeSheet" data-l="2">Vazgeç</button><button class="btn pri" data-act="importApply">Aktar</button></div>`,{type:'imp'},2);
}
async function detectOld(){
  // Aynı adreste çalışan eski uygulamanın kayıtlarını (localStorage / IndexedDB) bul
  const src={};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||k===LS_KEY)continue;try{src[k]=JSON.parse(localStorage.getItem(k));}catch(e){}}}catch(e){}
  try{if(window.indexedDB&&indexedDB.databases){const list=await indexedDB.databases();for(const d of list){if(!d.name)continue;
    const data=await new Promise(res=>{let rq;try{rq=indexedDB.open(d.name);}catch(e){res(null);return;}rq.onerror=()=>res(null);rq.onblocked=()=>res(null);
      rq.onsuccess=()=>{const idb=rq.result;const names=Array.from(idb.objectStoreNames);if(!names.length){idb.close();res(null);return;}const out={};let left=names.length;
        try{const tx=idb.transaction(names,'readonly');names.forEach(n=>{const g=tx.objectStore(n).getAll();g.onsuccess=()=>{out[n]=g.result;if(--left===0){idb.close();res(out);}};g.onerror=()=>{if(--left===0){idb.close();res(out);}};});}catch(e){idb.close();res(null);}};});
    if(data)src[d.name]=data;}}}catch(e){}
  if(!Object.keys(src).length)return;
  let r;try{r=parseImport(src);}catch(e){return;}
  if(!r.orders.length&&!r.entries.length)return;
  r.kaynak='Bu telefondaki eski uygulama';
  importPreview(r,'Eski uygulamanın kayıtları bulundu');
}
const SUBMIT={
  order:f=>{
    const d=readOrderForm(),err=$('#formErr');
    const bad=m=>{err.textContent=m;err.hidden=false;err.scrollIntoView({block:'center',behavior:'smooth'});};
    if(!d.musteri){bad('Müşteri adını yaz.');return;}
    d.parcalar=d.parcalar.filter(p=>p.ad);
    if(!d.parcalar.length){d.parcalar=[newPart()];bad('En az bir parçanın adını yaz.');return;}
    const isNew=!d.id,t=todayStr();
    if(isNew){d.id=uid();d.ax=nextAx();d.olusturma=new Date().toISOString();d.odemeler=[];d.fotolar=[];if(num(d.kapora)>0)d.odemeler.push({id:uid(),tarih:d.tarih||t,tutar:num(d.kapora),yontem:'Kapora'});}
    delete d.kapora;
    if(['uretimde','tamamlandi','teslim'].includes(d.durum)&&!d.uretimTarihi)d.uretimTarihi=t;
    if(d.durum==='tamamlandi'||d.durum==='teslim'){if(!d.tamamlanmaTarihi)d.tamamlanmaTarihi=t;d.parcalar.forEach(p=>p.bitti=true);dusStok(d);}
    if(d.durum==='teslim'&&!d.teslimTarihi)d.teslimTarihi=t;
    const o=clone(d);UI.draft=null;put('orders',o);
    if(isNew){closeSheet(1);toast(`${o.ax} oluşturuldu`,{label:'Aç',fn:()=>openDetail(o.id)});}
    else{openSheet(detailHTML(o),{type:'detail',id:o.id},1);toast('Değişiklikler kaydedildi');}
  },
  gram:f=>{const c=UI.gramCtx;if(!c)return;c.o.parcalar.forEach((p,i)=>{p.gram=num(f.elements['g'+i].value);p.malzeme=f.elements['m'+i].value;});closeSheet(2);finishDurum(c.o,c.d);},
  pay:f=>{const o=getO(f.dataset.id);if(!o)return;const v=num(f.elements.tutar.value);if(v<=0){toast('Tutar gir.');return;}o.odemeler=[...(o.odemeler||[]),{id:uid(),tarih:f.elements.tarih.value||todayStr(),tutar:v,yontem:f.elements.yontem.value}];closeSheet(2);put('orders',o);toast(`${tl(v)} ödeme kaydedildi`);},
  entry:f=>{
    const E=n=>f.elements[n],tip=f.dataset.tip,id=f.dataset.id,err=$('#entErr');
    const v=num(E('tutar').value);if(v<=0){err.textContent='Tutarı yaz.';err.hidden=false;return;}
    const old=id?S.entries.find(x=>x.id===id):null;
    const e=Object.assign(old?clone(old):{id:uid(),tip,olusturma:new Date().toISOString()},{aciklama:E('aciklama').value.trim(),tutar:v,tarih:E('tarih').value||todayStr()});
    if(tip==='gider')e.kategori=E('kategori').value;else e.kanal=E('kanal').value;
    put('entries',e);
    if(tip==='gider'&&!id&&e.kategori==='Filament'&&E('stok')&&E('stok').checked&&num(E('sgram').value)>0){const g=num(E('sgram').value);put('spools',{id:uid(),malzeme:E('smalz').value,renk:E('srenk').value.trim(),marka:'',toplam:g,kalan:g,fiyat:v,tarih:e.tarih,aktif:false});}
    UI.month=monthKey(e.tarih);closeSheet(1);toast(tip==='gider'?'Gider kaydedildi':'Gelir kaydedildi');
  },
  spool:f=>{const E=n=>f.elements[n],id=f.dataset.id;const old=id?S.spools.find(x=>x.id===id):null;const s=Object.assign(old?clone(old):{id:uid()},{malzeme:E('malzeme').value,renk:E('renk').value.trim(),marka:E('marka').value.trim(),toplam:num(E('toplam').value),kalan:num(E('kalan').value),fiyat:num(E('fiyat').value),tarih:E('tarih').value,aktif:E('aktif').checked});
    const items=[['spools',s]];if(s.aktif)S.spools.filter(x=>x.malzeme===s.malzeme&&x.aktif&&x.id!==s.id).forEach(x=>{const c=clone(x);c.aktif=false;items.push(['spools',c]);});
    putMany(items);closeSheet(1);toast('Makara kaydedildi');},
  settings:f=>{const s=clone(S.settings);$$('input[name]',f).forEach(i=>{const v=num(i.value);if(i.name.startsWith('kom.'))s.kom[i.name.slice(4)]=v;else s[i.name]=v;});s.axYil=new Date().getFullYear();S.settings=mergeSet(s);putSettings();toast('Ayarlar kaydedildi');},
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const fn=ACT[el.dataset.act];if(!fn)return;
  if(el.tagName==='A')return;
  e.preventDefault();fn(el,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#sheet2').hidden)closeSheet(2);else if(!$('#sheet1').hidden)closeSheet(1);}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click();}
});
document.addEventListener('input',e=>{const h=INPUT[e.target.dataset&&e.target.dataset.in];if(h)h(e.target,e);});
document.addEventListener('change',e=>{const h=CHANGE[e.target.dataset&&e.target.dataset.ch];if(h)h(e.target,e);});
document.addEventListener('submit',e=>{const f=e.target;const h=SUBMIT[f.dataset&&f.dataset.form];if(h){e.preventDefault();h(f);}});

init();
})();
</script>
