y));\n  const uaKey = await crypto.subtle.importKey(\"raw\", uaPub, { name: \"ECDH\", namedCurve: \"P-256\" }, false, []);\n  const ortak = new Uint8Array(await crypto.subtle.deriveBits({ name: \"ECDH\", public: uaKey }, gecici.privateKey, 256));\n  const ikm = await hkdf(auth, ortak, birlestir(enc.encode(\"WebPush: info\\0\"), uaPub, asPub), 32);\n  const salt = crypto.getRandomValues(new Uint8Array(16));\n  const cek = await hkdf(salt, ikm, enc.encode(\"Content-Encoding: aes128gcm\\0\"), 16);\n  const nonce = await hkdf(salt, ikm, enc.encode(\"Content-Encoding: nonce\\0\"), 12);\n  const aes = await crypto.subtle.importKey(\"raw\", cek, \"AES-GCM\", false, [\"encrypt\"]);\n  const sifreli = new Uint8Array(\n    await crypto.subtle.encrypt({ name: \"AES-GCM\", iv: nonce }, aes, birlestir(enc.encode(metin), new Uint8Array([2])))\n  );\n  const rs = new Uint8Array([0, 0, 16, 0]);\n  return birlestir(salt, rs, new Uint8Array([asPub.length]), asPub, sifreli);\n}\nasync function bildirimGonder(env, veri) {\n  const aboneler = (await env.KV.get(\"aboneler\", \"json\")) || [];\n  if (!aboneler.length) return [];\n  const vapid = await vapidAl(env);\n  const metin = JSON.stringify(veri);\n  const sonuc = [];\n  const kalan = [];\n  for (const a of aboneler) {\n    let durum = 0;\n    const servis = new URL(a.endpoint).host;\n    try {\n      const c = await fetch(a.endpoint, {\n        method: \"POST\",\n        headers: {\n          Authorization: await vapidBaslik(vapid, a.endpoint),\n          \"Content-Encoding\": \"aes128gcm\",\n          \"Content-Type\": \"application/octet-stream\",\n          TTL: \"86400\",\n          Urgency: \"high\",\n        },\n        body: await sifrele(a, metin),\n      });\n      durum = c.status;\n      sonuc.push(c.status >= 400 ? { durum, servis, mesaj: (await c.text()).slice(0, 200) } : { durum, servis });\n    } catch (e) {\n      sonuc.push({ durum: 0, servis, mesaj: String(e).slice(0, 200) });\n    }\n    if (durum !== 404 && durum !== 410) kalan.push(a); // telefonun aboneliği bitmişse listeden çıkar\n  }\n  if (kalan.length !== aboneler.length) await env.KV.put(\"aboneler\", JSON.stringify(kalan));\n  return sonuc;\n}\n\nasync function n11Soap(env, istekAdi, ic, adres = N11_SIPARIS) {\n  const govde =\n    '<soapenv:Envelope xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\" xmlns:sch=\"http://www.n11.com/ws/schemas\">' +\n    `<soapenv:Header/><soapenv:Body><sch:${istekAdi}>` +\n    `<auth><appKey>${xmlKacis(env.N11_APP_KEY)}<\/appKey><appSecret>${xmlKacis(env.N11_APP_SECRET)}<\/appSecret><\/auth>` +\n    ic +\n    `<\/sch:${istekAdi}><\/soapenv:Body><\/soapenv:Envelope>`;\n  const c = await fetch(adres, { method: \"POST\", headers: { \"Content-Type\": \"text/xml; charset=utf-8\", SOAPAction: \"\" }, body: govde });\n  const xml = await c.text();\n  const sonuc = alanlariAl(bloklar(xml, \"result\")[0] || \"\", [\"status\", \"errorCode\", \"errorMessage\"]);\n  if (!c.ok || sonuc.status !== \"success\") throw new Error(\"n11: \" + (sonuc.errorMessage || sonuc.errorCode || c.status));\n  return xml;\n}\nfunction trGun(ms) {\n  const t = new Date(ms + 3 * 36e5);\n  return String(t.getUTCDate()).padStart(2, \"0\") + \"/\" + String(t.getUTCMonth() + 1).padStart(2, \"0\") + \"/\" + t.getUTCFullYear();\n}\nconst tlYaz = (x) => new Intl.NumberFormat(\"tr-TR\", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(+x || 0) + \" TL\";\nconst kisalt = (s, n) => {\n  s = String(s || \"\").replace(/\\s+/g, \" \").trim();\n  return s.length > n ? s.slice(0, n - 1) + \"…\" : s;\n};\n\nasync function siparisKontrol(env) {\n  if (!env.KV) return { hata: \"KV bağlı değil\" };\n  const kayit = (await env.KV.get(\"gorulen\", \"json\")) || null;\n  const ilk = !kayit; // ilk çalışmada eski siparişler için bildirim gitmez, sadece işaretlenir\n  const ids = (kayit && kayit.ids) || {};\n  const su = Date.now();\n  const yeni = [];\n  const notlar = [];\n  // Trendyol\n  try {\n    const u = `${API}/order/sellers/${env.TRENDYOL_SATICI_ID}/v2/orders?startDate=${su - 2 * 864e5}&endDate=${su}&size=200&orderByField=PackageLastModifiedDate&orderByDirection=DESC`;\n    const c = await fetch(u, {\n      headers: {\n        Authorization: \"Basic \" + btoa(env.TRENDYOL_API_KEY + \":\" + env.TRENDYOL_API_SECRET),\n        \"User-Agent\": env.TRENDYOL_SATICI_ID + \" - SelfIntegration\",\n        Accept: \"application/json\",\n      },\n    });\n    if (!c.ok) throw new Error(\"Trendyol \" + c.status);\n    const v = await c.json();\n    for (const p of v.content || []) {\n      if (p.status === \"Awaiting\") continue; // ödemesi onaylanınca bildirilir\n      const a = \"TY:\" + p.orderNumber;\n      if (ids[a]) continue;\n      ids[a] = su;\n      if (ilk || /Cancel|UnSupplied/.test(p.status || \"\")) continue;\n      const satir = p.lines || [];\n      const tutar =\n        p.totalPrice ?? p.grossAmount ?? satir.reduce((x, l) => x + (+l.lineGrossAmount || (+l.price || 0) * (+l.quantity || 1)), 0);\n      yeni.push({ kanal: \"Trendyol\", ad: satir.map((l) => l.productName).filter(Boolean), tutar });\n    }\n  } catch (e) {\n    notlar.push(String(e.message || e));\n  }\n  // n11: hafif liste; ürün adı yalnız yeni sipariş için ayrıntıdan alınır\n  if (env.N11_APP_KEY && env.N11_APP_SECRET) {\n    try {\n      const xml = await n11Soap(\n        env,\n        \"OrderListRequest\",\n        `<searchData><period><startDate>${trGun(su - 2 * 864e5)}<\/startDate><endDate>${trGun(su)}<\/endDate><\/period><\/searchData><pagingData><currentPage>0<\/currentPage><pageSize>100<\/pageSize><\/pagingData>`\n      );\n      for (const o of bloklar(xml, \"order\")) {\n        const s = alanlariAl(o, [\"id\", \"orderNumber\", \"totalAmount\", \"status\"]);\n        const a = \"N11:\" + (s.orderNumber || s.id);\n        if (!s.id || ids[a]) continue;\n        ids[a] = su;\n        if (ilk) continue;\n        let ad = [];\n        try {\n          const d = await n11Soap(env, \"OrderDetailRequest\", `<orderRequest><id>${xmlKacis(s.id)}<\/id><\/orderRequest>`);\n          ad = bloklar(d, \"item\").map((k) => alanlariAl(k, [\"productName\"]).productName).filter(Boolean);\n        } catch (e) {\n          /* ad olmadan da bildir */\n        }\n        yeni.push({ kanal: \"n11\", ad, tutar: s.totalAmount });\n      }\n    } catch (e) {\n      notlar.push(String(e.message || e));\n    }\n  }\n  // Hepsiburada: paketlenmeyi bekleyen (ödemesi tamamlanmış) siparişler. İlk HB turunda yalnız işaretlenir.\n  let hb = !!(kayit && kayit.hb);\n  if (env.HB_MERCHANT_ID && env.HB_SECRET_KEY) {\n    try {\n      const l = hbListe(await hbIstek(env, `/orders/merchantid/${env.HB_MERCHANT_ID}?offset=0&limit=50`));\n      const sip = {};\n      for (const x of l) {\n        const k = hbKalem(x);\n        if (!k.siparisNo) continue;\n        (sip[k.siparisNo] = sip[k.siparisNo] || []).push(k);\n      }\n      for (const [no, kl] of Object.entries(sip)) {\n        const a = \"HB:\" + no;\n        if (ids[a]) continue;\n        ids[a] = su;\n        if (ilk || !hb) continue;\n        yeni.push({ kanal: \"Hepsiburada\", ad: kl.map((k) => k.ad).filter(Boolean), tutar: kl.reduce((t, k) => t + k.brut, 0) });\n      }\n      hb = true;\n    } catch (e) {\n      notlar.push(String(e.message || e).slice(0, 200));\n    }\n  }\n  for (const a of Object.keys(ids)) if (su - ids[a] > 10 * 864e5) delete ids[a]; // 10 günden eskileri unut\n  await env.KV.put(\"gorulen\", JSON.stringify({ ids, son: su, not: notlar, hb }));\n  let gonderim = [];\n  if (yeni.length === 1) {\n    const y = yeni[0];\n    gonderim = await bildirimGonder(env, {\n      baslik: \"Yeni sipariş · \" + y.kanal,\n      govde: (y.ad.length ? kisalt(y.ad[0], 70) + (y.ad.length > 1 ? \" +\" + (y.ad.length - 1) + \" ürün\" : \"\") + \"\\n\" : \"\") + tlYaz(y.tutar),\n      etiket: \"siparis-\" + su,\n      url: \"kar.html\",\n    });\n  } else if (yeni.length > 1) {\n    const say = {};\n    yeni.forEach((y) => (say[y.kanal] = (say[y.kanal] || 0) + 1));\n    gonderim = await bildirimGonder(env, {\n      baslik: yeni.length + \" yeni sipariş\",\n      govde:\n        Object.entries(say).map(([k, n]) => k + \": \" + n).join(\" · \") +\n        \"\\nToplam \" + tlYaz(yeni.reduce((a, y) => a + (+y.tutar || 0), 0)),\n      etiket: \"siparis-\" + su,\n      url: \"kar.html\",\n    });\n  }\n  return { ilk, yeni: yeni.length, notlar, gonderim };\n}\n\nasync function bildirimYolu(istek, env, url, yanit) {\n  if (!env.KV) return yanit({ hata: \"Cloudflare'da KV bağlantısı yok.\" }, 501);\n  if (url.pathname === \"/bildirim/anahtar\") return yanit({ anahtar: (await vapidAl(env)).pub }, 200);\n  if (url.pathname === \"/bildirim/durum\") {\n    const g = (await env.KV.get(\"gorulen\", \"json\")) || {};\n    const gi = (await env.KV.get(\"gorulenIade\", \"json\")) || {};\n    const ab = (await env.KV.get(\"aboneler\", \"json\")) || [];\n    return yanit({ abone: ab.length, sonKontrol: g.son || null, not: g.not || [], iadeSon: gi.son || null, iadeNot: gi.not || [] }, 200);\n  }\n  if (url.pathname === \"/bildirim/abone\" && istek.method === \"POST\") {\n    let a;\n    try {\n      a = await istek.json();\n    } catch (e) {\n      return yanit({ hata: \"Abonelik okunamadı.\" }, 400);\n    }\n    if (!a || typeof a.endpoint !== \"string\" || !/^https:\\/\\//.test(a.endpoint) || !a.keys || !a.keys.p256dh || !a.keys.auth) {\n      return yanit({ hata: \"Abonelik eksik.\" }, 400);\n    }\n    const temiz = { endpoint: a.endpoint, keys: { p256dh: String(a.keys.p256dh), auth: String(a.keys.auth) }, eklendi: Date.now() };\n    const ab = ((await env.KV.get(\"aboneler\", \"json\")) || []).filter((x) => x.endpoint !== temiz.endpoint);\n    ab.push(temiz);\n    const son = ab.slice(-10);\n    await env.KV.put(\"aboneler\", JSON.stringify(son));\n    return yanit({ tamam: true, abone: son.length }, 200);\n  }\n  if (url.pathname === \"/bildirim/sil\" && istek.method === \"POST\") {\n    let a = {};\n    try {\n      a = await istek.json();\n    } catch (e) {}\n    const ab = ((await env.KV.get(\"aboneler\", \"json\")) || []).filter((x) => x.endpoint !== a.endpoint);\n    await env.KV.put(\"aboneler\", JSON.stringify(ab));\n    return yanit({ tamam: true, abone: ab.length }, 200);\n  }\n  if (url.pathname === \"/bildirim/deneme\") {\n    const s = await bildirimGonder(env, {\n      baslik: \"ARAYX Kâr Paneli\",\n      govde: \"Deneme bildirimi. Yeni siparişlerde böyle haber vereceğim.\",\n      etiket: \"deneme\",\n      url: \"kar.html\",\n    });\n    return yanit({ gonderim: s }, 200);\n  }\n  if (url.pathname === \"/bildirim/kontrol\") return yanit(await siparisKontrol(env), 200);\n  if (url.pathname === \"/bildirim/iade-kontrol\") return yanit(await iadeKontrol(env), 200);\n  return yanit({ hata: \"Bilinmeyen adres.\" }, 404);\n}\n\n// ---------------------------------------------------------------------------\n// Hepsiburada (canlı): HB_MERCHANT_ID + HB_SECRET_KEY (Basic) ve HB_USER_AGENT (arayx_dev).\n// Yalnız okunur. Müşteri adı, adres, telefon, TC/vergi no köprüden geçmez: kalemde yalnız aşağıdaki alanlar döner.\n// ---------------------------------------------------------------------------\nconst HB_OMS = \"https://oms-external.hepsiburada.com\";\nasync function hbIstek(env, yol) {\n  const c = await fetch(HB_OMS + yol, {\n    headers: {\n      Authorization: \"Basic \" + btoa(env.HB_MERCHANT_ID + \":\" + env.HB_SECRET_KEY),\n      \"User-Agent\": env.HB_USER_AGENT || \"arayx_dev\",\n      Accept: \"application/json\",\n    },\n  });\n  const metin = await c.text();\n  if (c.status === 404) return []; // HB boş listede 404 dönebiliyor\n  if (!c.ok) {\n    const h = new Error(\"Hepsiburada \" + c.status + (metin ? \": \" + metin.slice(0, 160) : \"\"));\n    h.durum = c.status;\n    throw h;\n  }\n  try {\n    return metin ? JSON.parse(metin) : null;\n  } catch (e) {\n    throw new Error(\"Hepsiburada'dan okunamayan cevap geldi.\");\n  }\n}\nconst hbListe = (v) => (Array.isArray(v) ? v : (v && (v.items || v.data || v.content || v.lineItems)) || []);\n// Alan adı büyük/küçük harf farkıyla gelebilir (PackageNumber / packageNumber)\nfunction al(o, ...adlar) {\n  if (!o || typeof o !== \"object\") return undefined;\n  for (const a of adlar) {\n    if (o[a] !== undefined && o[a] !== null) return o[a];\n    const k = Object.keys(o).find((x) => x.toLowerCase() === a.toLowerCase());\n    if (k && o[k] !== undefined && o[k] !== null) return o[k];\n  }\n  return undefined;\n}\nconst para = (x) => (x && typeof x === \"object\" ? +al(x, \"amount\") || 0 : +x || 0);\n// Sipariş kalemi: yalnız ürün, adet, tutar, durum, tarih. Müşteriye ait hiçbir alan alınmaz.\nfunction hbKalem(x, ust = {}) {\n  const merchantTop = para(al(x, \"merchantTotalPrice\"));\n  const top = para(al(x, \"totalPrice\"));\n  const hbIndirim = para(al(x, \"totalHBDiscount\", \"totalHbDiscount\"));\n  const brut = merchantTop || top + hbIndirim;\n  // Oran yoksa komisyon tutarından bulunur\n  const kom = para(al(x, \"commission\"));\n  const oran = al(x, \"commissionRate\") ?? (kom > 0 && brut > 0 ? Math.round((kom / brut) * 10000) / 100 : null);\n  return {\n    siparisNo: String(al(x, \"orderNumber\") ?? ust.orderNumber ?? \"\"),\n    paket: String(al(x, \"packageNumber\") ?? ust.packageNumber ?? \"\"),\n    kalem: String(al(x, \"lineItemId\", \"id\", \"orderLineId\") ?? \"\"),\n    tarih: al(x, \"orderDate\") ?? ust.orderDate ?? null,\n    ham: String(al(x, \"status\") ?? ust.status ?? \"\"),\n    sku: String(al(x, \"merchantSku\") ?? \"\"),\n    hbSku: String(al(x, \"hbSku\", \"sku\") ?? \"\"),\n    barkod: String(al(x, \"productBarcode\") ?? \"\"),\n    ad: String(al(x, \"productName\", \"name\") ?? \"\"),\n    adet: +al(x, \"quantity\") || 1,\n    brut: Math.round(brut * 100) / 100,\n    kdvOran: al(x, \"vatRate\") != null ? +al(x, \"vatRate\") : null,\n    komOran: oran != null ? (+oran < 1 ? +oran * 100 : +oran) : null,\n  };\n}\nasync function hbSayfali(env, yol, limit, sinir) {\n  const hepsi = [];\n  for (let s = 0, offset = 0; s < sinir; s++, offset += limit) {\n    const v = await hbIstek(env, `${yol}${yol.includes(\"?\") ? \"&\" : \"?\"}offset=${offset}&limit=${limit}`);\n    const l = hbListe(v);\n    hepsi.push(...l);\n    const toplam = v && !Array.isArray(v) ? +al(v, \"totalCount\") : NaN;\n    if (l.length < limit || (toplam && offset + limit >= toplam)) break;\n  }\n  return hepsi;\n}\n// Son N günün Hepsiburada siparişleri: paketlenecekler + paketler (tam bilgi), kargo/teslim/iptal (durum)\nasync function hbSiparisler(env, gun) {\n  const m = env.HB_MERCHANT_ID;\n  const sinir = Date.now() - gun * 864e5;\n  const satirlar = [];\n  for (const x of await hbSayfali(env, `/orders/merchantid/${m}`, 50, 10)) {\n    const k = hbKalem(x);\n    satirlar.push({ ...k, ham: k.ham || \"Open\" }); // bu listede yalnız paketlenecek siparişler var\n  }\n  for (const p of await hbSayfali(env, `/packages/merchantid/${m}?timespan=${Math.max(24, gun * 24)}`, 10, 20)) {\n    const ust = { packageNumber: al(p, \"packageNumber\"), orderDate: al(p, \"orderDate\"), status: \"Packaged\" };\n    for (const x of al(p, \"items\") || []) satirlar.push({ ...hbKalem(x, ust), ham: \"Packaged\" });\n  }\n  const durumlar = [];\n  const ekle = async (yol, ham, tarihAlani, sayfa = 10) => {\n    for (const x of await hbSayfali(env, yol, 50, sayfa)) {\n      const t = al(x, tarihAlani);\n      if (t && Date.parse(t) < sinir) continue;\n      durumlar.push({\n        siparisNo: String(al(x, \"orderNumber\") ?? \"\"),\n        paket: String(al(x, \"packageNumber\") ?? \"\"),\n        kalem: String(al(x, \"lineItemId\") ?? \"\"),\n        ham,\n        tarih: t ?? null,\n      });\n    }\n  };\n  await ekle(`/packages/merchantid/${m}/shipped`, \"InTransit\", \"shippedDate\");\n  await ekle(`/packages/merchantid/${m}/delivered`, \"Delivered\", \"deliveredDate\");\n  await ekle(`/packages/merchantid/${m}/undelivered`, \"Undelivered\", \"undeliveredDate\", 4);\n  await ekle(`/orders/merchantid/${m}/cancelled`, \"Cancelled\", \"cancelDate\", 4);\n  return { satirlar, durumlar };\n}\n// Tek siparişin kalemleri (yalnız uygulamada bilinmeyen eski siparişler için). Cevabın biçimi belgede yok:\n// içinde adet ve ürün bilgisi olan her nesne kalem sayılır.\nasync function hbSiparisDetay(env, no) {\n  const v = await hbIstek(env, `/orders/merchantid/${env.HB_MERCHANT_ID}/ordernumber/${encodeURIComponent(no)}`);\n  const kalemler = [];\n  const gez = (o, ust, d) => {\n    if (!o || typeof o !== \"object\" || d > 6) return;\n    if (Array.isArray(o)) return o.forEach((x) => gez(x, ust, d + 1));\n    const yeniUst = {\n      orderNumber: al(o, \"orderNumber\") ?? ust.orderNumber,\n      orderDate: al(o, \"orderDate\") ?? ust.orderDate,\n      packageNumber: al(o, \"packageNumber\") ?? ust.packageNumber,\n      status: ust.status,\n    };\n    if (al(o, \"quantity\") != null && (al(o, \"productName\", \"name\", \"merchantSku\") != null)) {\n      kalemler.push(hbKalem(o, yeniUst));\n      return;\n    }\n    if (al(o, \"status\") != null && typeof al(o, \"status\") === \"string\") yeniUst.status = al(o, \"status\");\n    for (const k of Object.keys(o)) if (o[k] && typeof o[k] === \"object\") gez(o[k], yeniUst, d + 1);\n  };\n  gez(v, { orderNumber: no }, 0);\n  return { siparisNo: String(no), kalemler };\n}\n\n// ---------------------------------------------------------------------------\n// İadeler: üç pazaryerindeki müşteri iade talepleri. Yalnız okunur; onay ve red pazaryeri panelinden verilir.\n// Müşteri adı, e-posta, telefon ve adres köprüden geçmez: her talepten yalnız aşağıda adı geçen alanlar alınır.\n// Ortak durumlar: yeni (talep açıldı, ürün yolda), aksiyon (ürün ulaştı ya da satıcı onayı bekleniyor),\n// inceleme (ihtilaf, analiz, bekletme), onay, red, iptal.\n// ---------------------------------------------------------------------------\nconst N11_IADE = \"https://api.n11.com/ws/ReturnService/\";\nconst IADE_TY = {\n  Created: \"yeni\", WaitingInAction: \"aksiyon\", WaitingFraudCheck: \"inceleme\", Unresolved: \"inceleme\",\n  InAnalysis: \"inceleme\", Accepted: \"onay\", Rejected: \"red\", Cancelled: \"iptal\",\n};\nconst IADE_HB = {\n  NewRequest: \"yeni\", AwaitingPreApproval: \"aksiyon\", AwaitingAction: \"aksiyon\", InDispute: \"inceleme\",\n  Accepted: \"onay\", Refunded: \"onay\", Rejected: \"red\", Cancelled: \"iptal\",\n};\nconst IADE_N11 = {\n  REQUESTED: \"yeni\", APPROVAL_WAITING: \"aksiyon\", PENDING: \"inceleme\", PENDED: \"inceleme\",\n  APPROVED: \"onay\", MANUAL_REFUND: \"onay\", DENIED: \"red\", CANCELLED: \"iptal\",\n};\n// Bir talepte parçalar farklı durumdaysa en acil olan gösterilir\nconst IADE_SIRA = { iptal: 0, red: 1, onay: 2, yeni: 3, inceleme: 4, aksiyon: 5 };\nconst N11_IADE_ALANLARI = [\n  \"claimReturnId\", \"status\", \"returnReasonType\", \"returnReasonDescription\", \"orderNumber\", \"productId\",\n  \"productName\", \"quantity\", \"unitPrice\", \"finalPrice\", \"shipmentCompany\", \"trackingNumber\", \"requestDate\",\n  \"approvedDate\", \"deniedDate\", \"cancelledDate\", \"skuId\",\n];\n\nasync function tyIstek(env, yol) {\n  const bas = {\n    Authorization: \"Basic \" + btoa(env.TRENDYOL_API_KEY + \":\" + env.TRENDYOL_API_SECRET),\n    \"User-Agent\": env.TRENDYOL_SATICI_ID + \" - SelfIntegration\",\n    Accept: \"application/json\",\n  };\n  let c = await fetch(API + yol, { headers: bas });\n  // İade servisi bazı hesaplarda storeFrontCode başlığı istiyor; 400 gelirse TR ile bir kez daha denenir\n  if (c.status === 400) c = await fetch(API + yol, { headers: { ...bas, storeFrontCode: \"TR\" } });\n  const metin = await c.text();\n  if (!c.ok) {\n    const h = new Error(\"Trendyol \" + c.status + (metin ? \": \" + metin.slice(0, 160) : \"\"));\n    h.durum = c.status;\n    throw h;\n  }\n  try {\n    return metin ? JSON.parse(metin) : {};\n  } catch (e) {\n    throw new Error(\"Trendyol'dan okunamayan cevap geldi.\");\n  }\n}\nfunction tyIadeSatir(c) {\n  return (c.items || []).map((it) => {\n    const ol = it.orderLine || {};\n    const ci = it.claimItems || [];\n    let ham = \"\";\n    for (const x of ci) {\n      const h = (x.claimItemStatus && x.claimItemStatus.name) || \"\";\n      if (!ham || (IADE_SIRA[IADE_TY[h]] ?? 0) > (IADE_SIRA[IADE_TY[ham]] ?? 0)) ham = h;\n    }\n    const ilk = ci[0] || {};\n    const neden = ilk.customerClaimItemReason || ilk.trendyolClaimItemReason || {};\n    const adet = ci.length || 1;\n    return {\n      anah: \"TY:\" + c.id + \":\" + (ol.id ?? \"\"),\n      kanal: \"Trendyol\",\n      talepNo: String(c.id || \"\"),\n      siparisNo: String(c.orderNumber || \"\"),\n      tarih: +c.claimDate || null,\n      degisim: +c.lastModifiedDate || null,\n      ham,\n      durum: IADE_TY[ham] || \"yeni\",\n      ad: String(ol.productName || \"\"),\n      barkod: String(ol.barcode || \"\"),\n      sku: String(ol.merchantSku || \"\"),\n      adet,\n      tutar: Math.round((+ol.price || 0) * adet * 100) / 100,\n      neden: String(neden.name || \"\"),\n      not: kisalt(ilk.customerNote || \"\", 300),\n      kargo: String(c.cargoProviderName || \"\"),\n      takip: c.cargoTrackingNumber ? String(c.cargoTrackingNumber) : \"\",\n      takipLink: /^https:\\/\\//.test(c.cargoTrackingLink || \"\") ? c.cargoTrackingLink : \"\",\n      otoOnay: ci.some((x) => x.autoAccepted),\n    };\n  });\n}\n// Trendyol tarih aralığı talebin son değişim tarihine göre çalışır; 14 günlük parçalarla okunur\nasync function tyIadeler(env, bas, bit) {\n  const cikti = new Map();\n  for (let s = bas; s < bit; s += 14 * 864e5) {\n    const e = Math.min(bit, s + 14 * 864e5);\n    for (let sayfa = 0, top = 1; sayfa < top && sayfa < 10; sayfa++) {\n      const v = await tyIstek(env, `/order/sellers/${env.TRENDYOL_SATICI_ID}/claims?startDate=${s}&endDate=${e}&size=200&page=${sayfa}`);\n      top = +v.totalPages || 1;\n      for (const c of v.content || []) for (const x of tyIadeSatir(c)) cikti.set(x.anah, x);\n    }\n  }\n  return [...cikti.values()];\n}\n\nfunction zamanTR(s) {\n  if (!s) return null;\n  const t = String(s);\n  const d = Date.parse(/[zZ]$|[+-]\\d\\d:?\\d\\d$/.test(t) ? t : t.replace(\" \", \"T\") + \"+03:00\");\n  return isNaN(d) ? null : d;\n}\nconst hbTarih = (ms) => new Date(ms + 3 * 36e5).toISOString().slice(0, 16).replace(\"T\", \" \");\nfunction hbIadeSatir(x) {\n  const ham = String(al(x, \"status\") ?? \"\");\n  const no = String(al(x, \"number\") ?? al(x, \"id\") ?? \"\");\n  const tur = String(al(x, \"claimType\") ?? \"\");\n  return {\n    anah: \"HB:\" + no,\n    kanal: \"Hepsiburada\",\n    talepNo: no,\n    siparisNo: String(al(x, \"orderNumber\") ?? \"\"),\n    tarih: zamanTR(al(x, \"claimDate\")),\n    degisim: null,\n    ham,\n    durum: IADE_HB[ham] || \"yeni\",\n    ad: \"\",\n    barkod: \"\",\n    sku: String(al(x, \"sku\") ?? \"\"),\n    adet: +al(x, \"quantity\") || 1,\n    tutar: +al(x, \"totalPriceAmount\") || +al(x, \"priceAmount\") || 0,\n    neden: /return|iade/i.test(tur) ? \"İade\" : /exchange|renew|değişim/i.test(tur) ? \"Değişim\" : tur,\n    not: kisalt(al(x, \"explanation\") || \"\", 300),\n    sonTarih: zamanTR(al(x, \"awaitingPreApprovalExpireDate\")),\n  };\n}\n// HB talebinde ürün adı yok: siparişten bulunur, KV'de saklanır ki her seferinde sorulmasın\nasync function hbIadeAdlar(env, satirlar, sinir) {\n  const onbellek = env.KV ? (await env.KV.get(\"hbIadeAd\", \"json\")) || {} : {};\n  let say = 0;\n  let degisti = false;\n  for (const s of satirlar) {\n    const a = s.siparisNo + \"|\" + s.sku;\n    if (onbellek[a]) {\n      s.ad = onbellek[a].ad;\n      s.barkod = onbellek[a].barkod || \"\";\n      continue;\n    }\n    if (!s.siparisNo || say >= sinir) continue;\n    say++;\n    try {\n      const d = await hbSiparisDetay(env, s.siparisNo);\n      const k =\n        d.kalemler.find((k) => s.sku && (k.hbSku === s.sku || k.sku === s.sku || k.barkod === s.sku)) ||\n        (d.kalemler.length === 1 ? d.kalemler[0] : null);\n      if (k && k.ad) {\n        s.ad = k.ad;\n        s.barkod = k.barkod || \"\";\n        onbellek[a] = { ad: k.ad, barkod: k.barkod || \"\", t: Date.now() };\n        degisti = true;\n      }\n    } catch (e) {\n      /* ad olmadan da gösterilir */\n    }\n  }\n  if (degisti && env.KV) {\n    const l = Object.entries(onbellek).sort((x, y) => y[1].t - x[1].t).slice(0, 400);\n    await env.KV.put(\"hbIadeAd\", JSON.stringify(Object.fromEntries(l)));\n  }\n}\nasync function hbIadeler(env, bas, bit, durumlar, adSinir) {\n  const m = env.HB_MERCHANT_ID;\n  const sonuc = new Map();\n  const tarih = `beginDate=${encodeURIComponent(hbTarih(bas))}&endDate=${encodeURIComponent(hbTarih(bit))}`;\n  for (const x of await hbSayfali(env, `/claims/merchantId/${m}?${tarih}`, 100, 10)) {\n    const s = hbIadeSatir(x);\n    if (s.talepNo) sonuc.set(s.anah, s);\n  }\n  // Eskiden açılmış ama şimdi satıcı aksiyonu bekleyen talepler de görünsün\n  for (const d of durumlar) {\n    for (const x of await hbSayfali(env, `/claims/merchantId/${m}/status/${d}`, 100, 3)) {\n      const s = hbIadeSatir(x);\n      if (s.talepNo) sonuc.set(s.anah, { ...s, ham: s.ham || d, durum: IADE_HB[s.ham || d] || \"yeni\" });\n    }\n  }\n  const l = [...sonuc.values()];\n  await hbIadeAdlar(env, l, adSinir);\n  return l;\n}\n\nfunction n11Zaman(s) {\n  const m = String(s || \"\").match(/(\\d{2})\\/(\\d{2})\\/(\\d{4})(?:\\s+(\\d{2}):(\\d{2}))?/);\n  return m ? Date.UTC(+m[3], +m[2] - 1, +m[1], (+m[4] || 0) - 3, +m[5] || 0) : null;\n}\nasync function n11IadeListe(env, durum, bas, bit, sinir) {\n  const cikti = [];\n  for (let sayfa = 0, top = 1; sayfa < top && sayfa < sinir; sayfa++) {\n    const xml = await n11Soap(\n      env,\n      \"ClaimReturnListRequest\",\n      `<searchData><status>${durum}<\/status><period><startDate>${trGun(bas)}<\/startDate><endDate>${trGun(bit)}<\/endDate><\/period><\/searchData>` +\n        `<pagingData><currentPage>${sayfa}<\/currentPage><\/pagingData>`,\n      N11_IADE\n    );\n    top = +alanlariAl(bloklar(xml, \"pagingData\").pop() || \"\", [\"pageCount\"]).pageCount || 1;\n    for (const b of bloklar(xml, \"claimReturn\")) cikti.push(alanlariAl(b, N11_IADE_ALANLARI));\n  }\n  return cikti;\n}\nasync function n11Iadeler(env, bas, bit) {\n  const su = Date.now();\n  // APPROVAL_WAITING cevapta durum olarak yazılmıyor; bu yüzden ayrı sorulup işaretlenir\n  const aksiyon = new Set((await n11IadeListe(env, \"APPROVAL_WAITING\", su - 60 * 864e5, su, 5)).map((x) => x.claimReturnId));\n  const l = await n11IadeListe(env, \"ALL\", bas, bit, 15);\n  return l\n    .filter((x) => x.claimReturnId)\n    .map((x) => {\n      const ham = aksiyon.has(x.claimReturnId) ? \"APPROVAL_WAITING\" : x.status || \"\";\n      const adet = +x.quantity || 1;\n      return {\n        anah: \"N11:\" + x.claimReturnId,\n        kanal: \"N11\",\n        talepNo: String(x.claimReturnId),\n        siparisNo: String(x.orderNumber || \"\"),\n        tarih: n11Zaman(x.requestDate),\n        degisim: n11Zaman(x.approvedDate || x.deniedDate || x.cancelledDate),\n        ham,\n        durum: IADE_N11[ham] || \"yeni\",\n        ad: String(x.productName || \"\"),\n        barkod: \"\",\n        sku: String(x.skuId || x.productId || \"\"),\n        adet,\n        tutar: +x.finalPrice || (+x.unitPrice || 0) * adet,\n        neden: String(x.returnReasonType || \"\"),\n        not: kisalt(x.returnReasonDescription || \"\", 300),\n        kargo: String(x.shipmentCompany || \"\"),\n        takip: String(x.trackingNumber || \"\"),\n      };\n    });\n}\n\nfunction iadeHata(kanal, e) {\n  const d = e && e.durum;\n  if (d === 401 || d === 403) {\n    return kanal === \"Hepsiburada\"\n      ? \"Hepsiburada iade servisine izin vermedi (\" + d + \"). Hepsiburada'dan Talep Entegrasyonu yetkisi istenmeli.\"\n      : kanal + \" iade servisine izin vermedi (\" + d + \").\";\n  }\n  return String((e && e.message) || e).slice(0, 220);\n}\n// Üç pazaryerinin iade talepleri tek listede. Bir pazaryeri hata verirse diğerleri yine gelir.\nasync function iadeleriTopla(env, gun, secenek = {}) {\n  const su = Date.now();\n  const bas = su - gun * 864e5;\n  const iadeler = [];\n  const kanallar = {};\n  try {\n    iadeler.push(...(await tyIadeler(env, bas, su)));\n    kanallar.Trendyol = \"tamam\";\n  } catch (e) {\n    kanallar.Trendyol = iadeHata(\"Trendyol\", e);\n  }\n  if (env.HB_MERCHANT_ID && env.HB_SECRET_KEY) {\n    try {\n      const durumlar = secenek.cron ? [\"AwaitingAction\", \"AwaitingPreApproval\"] : [\"AwaitingAction\", \"AwaitingPreApproval\", \"InDispute\"];\n      iadeler.push(...(await hbIadeler(env, bas, su, durumlar, secenek.adSinir ?? 8)));\n      kanallar.Hepsiburada = \"tamam\";\n    } catch (e) {\n      kanallar.Hepsiburada = iadeHata(\"Hepsiburada\", e);\n    }\n  } else kanallar.Hepsiburada = \"yok\";\n  if (env.N11_APP_KEY && env.N11_APP_SECRET) {\n    try {\n      iadeler.push(...(await n11Iadeler(env, bas, su)));\n      kanallar.N11 = \"tamam\";\n    } catch (e) {\n      kanallar.N11 = iadeHata(\"n11\", e);\n    }\n  } else kanallar.N11 = \"yok\";\n  return { iadeler, kanallar, zaman: su };\n}\n\n// Cron: yeni iade talebi açıldığında ve iade ürünü satıcıya ulaştığında (onay bekliyor) bildirim gönderir.\n// Bir pazaryeri ilk kez okunduğunda eski talepler için bildirim gitmez, yalnız işaretlenir.\n// KV: \"gorulenIade\" = { d: {anah: {s: durum, t: zaman}}, kanal: {Trendyol: true, ...}, son, not }\nasync function iadeKontrol(env) {\n  if (!env.KV) return { hata: \"KV bağlı değil\" };\n  const kayit = (await env.KV.get(\"gorulenIade\", \"json\")) || {};\n  const d = kayit.d || {};\n  const acik = kayit.kanal || {};\n  const su = Date.now();\n  const { iadeler, kanallar } = await iadeleriTopla(env, 3, { cron: true, adSinir: 3 });\n  const yeni = [];\n  const ulasan = [];\n  for (const x of iadeler) {\n    if (kanallar[x.kanal] !== \"tamam\") continue;\n    const once = d[x.anah];\n    d[x.anah] = { s: x.durum, t: su };\n    if (!acik[x.kanal]) continue;\n    if (!once) {\n      if (x.durum === \"yeni\" || x.durum === \"aksiyon\") yeni.push(x);\n    } else if (x.durum === \"aksiyon\" && once.s !== \"aksiyon\") ulasan.push(x);\n  }\n  for (const k of Object.keys(kanallar)) if (kanallar[k] === \"tamam\") acik[k] = true;\n  for (const a of Object.keys(d)) if (su - d[a].t > 60 * 864e5) delete d[a];\n  const notlar = Object.entries(kanallar).filter(([, v]) => v !== \"tamam\" && v !== \"yok\").map(([, v]) => v);\n  await env.KV.put(\"gorulenIade\", JSON.stringify({ d, kanal: acik, son: su, not: notlar }));\n\n  const kAd = (k) => (k === \"N11\" ? \"n11\" : k);\n  const urunSatir = (x) => (x.ad ? kisalt(x.ad, 70) : \"Sipariş #\" + x.siparisNo);\n  const gonderim = [];\n  if (yeni.length === 1) {\n    const x = yeni[0];\n    gonderim.push(\n      ...(await bildirimGonder(env, {\n        baslik: \"Yeni iade talebi · \" + kAd(x.kanal),\n        govde: urunSatir(x) + \"\\n\" + [x.neden, x.tutar ? tlYaz(x.tutar) : \"\"].filter(Boolean).join(\" · \"),\n        etiket: \"iade-\" + su,\n        url: \"kar.html#iadeler\",\n      }))\n    );\n  } else if (yeni.length > 1) {\n    const say = {};\n    yeni.forEach((x) => (say[kAd(x.kanal)] = (say[kAd(x.kanal)] || 0) + 1));\n    gonderim.push(\n      ...(await bildirimGonder(env, {\n        baslik: yeni.length + \" yeni iade talebi\",\n        govde: Object.entries(say).map(([k, n]) => k + \": \" + n).join(\" · \") + \"\\n\" + urunSatir(yeni[0]) + (yeni.length > 1 ? \" ve diğerleri\" : \"\"),\n        etiket: \"iade-\" + su,\n        url: \"kar.html#iadeler\",\n      }))\n    );\n  }\n  if (ulasan.length) {\n    const x = ulasan[0];\n    const tyVar = ulasan.some((u) => u.kanal === \"Trendyol\");\n    gonderim.push(\n      ...(await bildirimGonder(env, {\n        baslik: ulasan.length === 1 ? \"İade onayını bekliyor · \" + kAd(x.kanal) : ulasan.length + \" iade onayını bekliyor\",\n        govde:\n          (ulasan.length === 1 ? urunSatir(x) <style>
/* Kâr Paneli 2. tasarım (2026-11-19): lacivert üst bar, tek özet kartı, kartlar hafif gölgeli, rakamlar eşit genişlikte. Durum her yerde renk + yazı ile. */
:root{

  --bar-bg:#0B2340; --bar-ink:#FFFFFF; --bar-muted:#9FB0C6;
  --hero:#0B2340; --hero2:#12345C; --hero-ink:#FFFFFF; --hero-muted:#A9B9CD; --hero-line:rgba(255,255,255,.12); --hero-cell:rgba(255,255,255,.07);

  --golge:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.05);
  --display:"Barlow Condensed","Bahnschrift","Arial Narrow",sans-serif;
  --body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D0F12; --surface:#16191D; --surface2:#1D2126; --surface3:#262B31; --text:#ECEAE6; --muted:#9AA4AF; --line:#262B31;
  --head:#F6F3EE; --btn:#3FB8FF; --btn-ink:#04131D; --scan:#3FB8FF; --scan-soft:rgba(63,184,255,.13);
  --ok:#43C68A; --ok-soft:rgba(67,198,138,.13); --warn:#EDA746; --warn-soft:rgba(237,167,70,.14);
  --bad:#F2685A; --bad-soft:rgba(242,104,90,.13);
  --bar-bg:#101820; --bar-ink:#F6F3EE; --bar-muted:#8D9BAC;
  --hero:#132238; --hero2:#18304F; --hero-ink:#F6F3EE; --hero-muted:#A3B0C0; --hero-line:rgba(255,255,255,.10); --hero-cell:rgba(255,255,255,.06);
  --c-ty:#F6F3EE; --c-hb:#3FB8FF; --c-n11:#69727D;
  --gider:#4A525C; --bar:#3FB8FF; --scrim:rgba(0,0,0,.6); --toast:#ECEAE6; --toast-ink:#16202C; --golge:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D0F12; --surface:#16191D; --surface2:#1D2126; --surface3:#262B31; --text:#ECEAE6; --muted:#9AA4AF; --line:#262B31;

  --bar-bg:#101820; --bar-ink:#F6F3EE; --bar-muted:#8D9BAC;
  --hero:#132238; --hero2:#18304F; --hero-ink:#F6F3EE; --hero-muted:#A3B0C0; --hero-line:rgba(255,255,255,.10); --hero-cell:rgba(255,255,255,.06);
  --c-ty:#F6F3EE; --c-hb:#3FB8FF; --c-n11:#69727D;
  --gider:#4A525C; --bar:#3FB8FF; --scrim:rgba(0,0,0,.6); --toast:#ECEAE6; --toast-ink:#16202C; --golge:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.45 var(--body);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar-bg)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.1;text-wrap:balance;color:var(--head)}
h2{font-size:1.25rem;letter-spacing:.01em}
h3{font-size:1.05rem}
p{margin:0}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tut,.sag,td.r{font-variant-numeric:tabular-nums}
/* Üst bar */
.ust{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar-bg);color:var(--bar-ink);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
.ust .logo{width:30px;height:30px;flex:none}
.ust .baslik{display:grid;line-height:1.05;min-width:0}
.ust .baslik small{font:600 .66rem/1 var(--body);letter-spacing:.16em;color:var(--bar-muted)}
.ust h1{font-size:1.3rem;letter-spacing:.02em;color:var(--bar-ink)}
.ust .etiket{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font:500 .78rem/1 var(--body);color:var(--bar-muted);white-space:nowrap}
.ust .etiket i{width:7px;height:7px;border-radius:50%;background:var(--bar-muted);flex:none}
.ust .etiket[data-d="ok"] i{background:#43C68A;box-shadow:0 0 0 3px rgba(67,198,138,.22)}
.ust .etiket[data-d="bad"] i{background:#F2685A}
.gecis{display:flex;gap:3px;background:rgba(255,255,255,.08);border-radius:11px;padding:3px;flex:none}
.gecis a{color:var(--bar-muted);text-decoration:none;font:600 13.5px/1 var(--body);padding:8px 12px;border-radius:8px;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.gecis a[aria-current="page"]{background:rgba(255,255,255,.16);color:var(--bar-ink)}
.gizli{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:359px){.gecis a{padding:8px 9px;font-size:13px}.ust .etiket{font-size:0;gap:0}}
.disli{background:none;border:0;padding:6px;cursor:pointer;color:var(--bar-ink);display:flex;min-width:40px;min-height:40px;align-items:center;justify-content:center;border-radius:10px;opacity:.85}
.disli:hover{background:rgba(255,255,255,.08);opacity:1}
.disli svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{max-width:1080px;margin:0 auto;padding-block:14px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:grid;gap:12px}
main>*{min-width:0}
@media (min-width:860px){main{grid-template-columns:1fr 1fr;align-items:start}main>.tam{grid-column:1/-1}}
/* Kart */
.kart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0;box-shadow:var(--golge)}
.kart-bas{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:28px}
.kart-bas .not{text-align:right}
.satirbas{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.not{font-size:.84rem;color:var(--muted)}
.sayac{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font:700 .95rem/1 var(--body);font-variant-numeric:tabular-nums}
/* Seçim düğmeleri */
.seg{display:flex;gap:4px;background:var(--surface2);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:none;border-radius:9px;padding:8px 9px;font-weight:600;font-size:.86rem;color:var(--muted);cursor:pointer;min-height:38px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.seg button:disabled{opacity:.5;cursor:default}
.seg button em{font-style:normal;font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.seg.koyu{background:rgba(255,255,255,.08)}
.seg.koyu button{color:var(--hero-muted);min-height:32px;padding:6px 10px;font-size:.82rem}
.seg.koyu button[aria-pressed="true"]{background:rgba(255,255,255,.16);color:var(--hero-ink);box-shadow:none}
.bant{border-radius:12px;padding:10px 12px;font-size:.9rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.bant.warn{background:var(--warn-soft);color:var(--text)}
.bant.warn b{color:var(--warn)}
.bant.info{background:var(--scan-soft)}
.btn{border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;min-height:42px}
.btn.ikinci{background:var(--surface);color:var(--text);border-color:var(--line)}
.btn.kucuk{padding:5px 12px;min-height:34px;font-size:.86rem}
.btn.tehlike{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--scan);outline-offset:2px}
/* Özet kartı */
.hero{background:linear-gradient(160deg,var(--hero2),var(--hero) 60%);color:var(--hero-ink);border-radius:18px;padding:18px;display:grid;gap:14px;box-shadow:0 6px 20px rgba(11,35,64,.18);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(63,184,255,.18),transparent 70%);pointer-events:none}
.hero-ust{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}
.hero .ad{font:600 .78rem/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--hero-muted)}
.hero .deger{font:700 3rem/1 var(--display);letter-spacing:.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hero .deger small{font-size:1.4rem;color:var(--hero-muted);margin-left:4px}
.hero .cumle{font-size:.92rem;color:var(--hero-muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.degisim{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:.82rem;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.1)}
.degisim.up{color:#6FE0A8}.degisim.down{color:#FF9A8F}
.hero .izgara{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero .hucre{background:var(--hero-cell);border:1px solid var(--hero-line);border-radius:12px;padding:10px 12px;display:grid;gap:3px;min-width:0}
.hero .hucre span{font-size:.76rem;color:var(--hero-muted)}
.hero .hucre b{font:700 1.35rem/1.1 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hero .hucre b small{font:500 .8rem var(--body);color:var(--hero-muted)}
.hero .hucre b.eksi{color:#FF9A8F}
.hero .tarih{font-size:.82rem;color:var(--hero-muted)}
.hero .cumle b{color:var(--hero-ink)}.hero .cumle b.eksi{color:#FF9A8F}
.hero .ay-panel{display:grid;gap:10px;padding-top:14px;border-top:1px solid var(--hero-line);position:relative;z-index:1}
.hero .ay-bas{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero .ay-panel .hucre{align-content:start}

<script>
"use strict";
/* ---------- Hesap motoru: fiyat_hesap.py ile aynı maliyet formülü ---------- */
const VARSAYILAN = {
  filamentKg:600, fire:12, makineSaat:15, iscilikSaat:300, ambalaj:20,
  kdv:20, kdvMahsup:true, stopajOran:1, stopajGider:true, iadeParcaKayip:true,
  hedefMarj:20, kritikMarj:10,
  sabitKesinti:true, ayarSurum:2, kargo:[{ust:300,tl:87.5},{ust:0,tl:98.34}], iadeKargo:87.5,
  kanallar:{Trendyol:{komisyon:4,sabit:0,hizmet:13.19},Hepsiburada:{komisyon:15,sabit:10,hizmet:0},N11:{komisyon:15,sabit:0,hizmet:0}},
  onay:{uretim:false,kargo:false,komisyon:false}
};
function uretimKirilim(u,A){
  const fil=(+u.gram||0)*(1+(+A.fire||0)/100)*(+A.filamentKg||0)/1000;
  const mak=(+u.saat||0)*(+A.makineSaat||0);
  const isc=((+u.iscilikDk||0)/60)*(+A.iscilikSaat||0);
  const amb=u.ambalaj===""||u.ambalaj==null?(+A.ambalaj||0):+u.ambalaj;
  return {fil,mak,isc,amb,toplam:fil+mak+isc+amb,kdvli:fil+amb};
}
function maliyetVar(u){return !!u&&(+u.gram>0||+u.saat>0||u.elMaliyet>0)}
function birimMaliyet(u,A){
  if(u&&u.elMaliyet>0)return {fil:0,mak:0,isc:0,amb:0,toplam:+u.elMaliyet,kdvli:+u.elMaliyet};
  return u?uretimKirilim(u,A):{fil:0,mak:0,isc:0,amb:0,toplam:0,kdvli:0};
}
function kargoTarife(tutar,A){
  for(const b of A.kargo){if(+b.ust>0&&tutar<=+b.ust)return +b.tl}
  const son=A.kargo[A.kargo.length-1];return son?+son.tl:0;

/* Tüm giderler KDV dahil kabul edilir. Net = KDV dahil satış - giderler - net KDV - stopaj */
function netHesap({brut,kdv,komisyon,kargo,hizmet,uretim,uretimKdvli},A){
  const k=kdv/100;
  const satisKdv=brut*k/(1+k);
  const giderKdv=A.kdvMahsup?((komisyon+kargo+hizmet+uretimKdvli)*0.2/1.2):0;
  const netKdv=satisKdv-giderKdv;
  const stopaj=A.stopajGider?(brut/(1+k))*(+A.stopajOran||0)/100:0;
  const net=brut-komisyon-kargo-hizmet-uretim-netKdv-stopaj;
  const kdvHaric=brut/(1+k);
  const stopajTL=(brut/(1+k))*(+A.stopajOran||0)/100;
  const kdvTL=satisKdv;
  const kalan=brut-kdvTL-komisyon-kargo-hizmet-stopajTL;
  return {brut,komisyon,kargo,hizmet,uretim,netKdv,stopaj,net,marj:kdvHaric>0?net/kdvHaric*100:0,kdvHaric,stopajTL,kdvTL,kalan};
}
function fiyatTest(fiyat,u,kanal,A,komOran){
  const K=A.kanallar[kanal]||{komisyon:0,sabit:0,hizmet:0};
  const m=birimMaliyet(u,A);

}
function fiyatBul(hedefMarj,u,kanal,A,komOran){
  let alt=1,ust=200000;
  if(fiyatTest(ust,u,kanal,A,komOran).marj<hedefMarj)return null;
  for(let i=0;i<60;i++){const o=(alt+ust)/2;if(fiyatTest(o,u,kanal,A,komOran).marj>=hedefMarj)ust=o;else alt=o}
  /* Kargo baremi fiyatla atladığı için en düşük geçerli fiyat taranır */

    </div>`};
  return `<section class="kart"><div class="bek-ust"><span><h2>Kargoya verilecek</h2><span class="not">Eski siparişler üstte</span></span><span class="bek-say"><b>${paketSay(bek)}</b><small>paket</small></span></div>
    ${secici}
    <div class="bek-liste">${gruplar.map(o=>grupBas(o)+o.l.map(satir).join("")).join("")}</div>

/* Bu ayın günleri çubuk grafik olarak: her gün kaç sipariş (paket), kaç TL; iptal hariç, tüm mağazalar. Çubuğa dokununca o gün yazılır. */
function gunlerCiz(kalemler){
  const bugun=new Date();bugun.setHours(0,0,0,0);
  const gunler=[];
  for(let d=new Date(bugun.getFullYear(),bugun.getMonth(),1);d<=bugun;d.setDate(d.getDate()+1))gunler.push(new Date(d));
  const satir=gunler.map(g=>{const s=g.getTime(),e=new Date(g.getFullYear(),g.getMonth(),g.getDate()+1).getTime();
    const l=kalemler.filter(k=>k.tarih>=s&&k.tarih<e&&k.durum!=="iptal");
    return {g,paket:paketSay(l),tl:l.reduce((a,k)=>a+(+k.brut||0),0)}});
  const maks=Math.max(1,...satir.map(x=>x.tl));
  const ort=satir.reduce((a,x)=>a+x.tl,0)/satir.length;
  const en=satir.reduce((a,x)=>x.tl>a.tl?x:a,satir[0]);
  const si=G.gunSec!=null&&G.gunSec<satir.length?G.gunSec:satir.length-1;
  const x=satir[si];
  const gunUzun=g=>g.toLocaleDateString("tr-TR",{day:"numeric",month:"long",weekday:"long"});
  const ayAd=bugun.toLocaleDateString("tr-TR",{month:"long"});
  return `<section class="kart"><div class="kart-bas"><h2>Günlük satış</h2><span class="not">${esc(ayAd)}</span></div>
    <div class="secgun"><b>${tl0(x.tl)}</b><span>${si===satir.length-1?"Bugün":esc(gunUzun(x.g))} · ${x.paket} sipariş</span></div>
    <div class="cubuklar" role="group" aria-label="Günler">${ort>0?`<span class="ort" style="bottom:${ort/maks*100}%" title="Günlük ortalama"></span>`:""}${satir.map((y,i)=>`<button class="gb${y.paket?" dolu":""}${i===satir.length-1?" bugun":""}" data-gun="${i}" aria-pressed="${i===si}" aria-label="${y.g.getDate()} ${esc(ayAd)}: ${y.paket} sipariş, ${tl0(y.tl)}"><i style="height:${y.tl/maks*100}%"></i></button>`).join("")}</div>
    <div class="eksen"><span>1</span>${satir.length>2?`<span>${Math.ceil(satir.length/2)}</span>`:""}<span>${satir.length}</span></div>
    <div class="ozetsat"><div><span>Günlük ortalama</span><b>${tl0(ort)}</b></div><div><span>En iyi gün</span><b>${en.tl>0?`${en.g.getDate()} ${esc(ayAd)} · ${tl0(en.tl)}`:"–"}</b></div></div>
  </section>`;
}
/* Seçilen dönemde mağazaların payı: tek çizgi + satırlar */
function magazaCiz(s){
  const m={};
  s.forEach(r=>{const k=r.k.kanal;const o=m[k]=m[k]||{brut:0,kalan:0,pk:new Set()};o.brut+=r.brut;o.kalan+=r.kalan;o.pk.add(paketKey(r.k))});
  const l=Object.entries(m).sort((a,b)=>b[1].brut-a[1].brut);
  if(l.length<2)return "";
  const top=l.reduce((a,[,v])=>a+v.brut,0)||1;
  return `<section class="kart"><div class="kart-bas"><h2>Mağazalar</h2></div>
    <div class="dagilim">${l.map(([k,v])=>`<i style="width:${v.brut/top*100}%;background:${KANAL_RENK[k]||"var(--gider)"}"></i>`).join("")}</div>
    <div>${l.map(([k,v])=>`<div class="magaza"><span class="nokta" style="background:${KANAL_RENK[k]||"var(--gider)"}"></span><span class="ad">${esc(kanalAd(k))}<small>${v.pk.size} sipariş · %${fmt0.format(v.brut/top*100)}</small></span><span class="tut">${tl0(v.brut)}<small>kalan ${tl0(v.kalan)}</small></span></div>`).join("")}</div>
  </section>`;
}
/* ---------- Taşıma: iPhone'da her ana ekran simgesi kendi verisini ayrı tutar.
   Eski "Kâr Paneli" simgesindeki bağlantı ve siparişler, panoya kopyalanan tek bir metinle ARAYX simgesine taşınır. */
const TASI_ON="ARAYXKAR1:";
function tasimaMetni(){
  const v={kopru:Depo.kopruAl(),ayar:D.ayar,urunler:D.urunler,kalemler:Object.values(D.kalemler),kargolar:D.kargolar,odemeler:D.odemeler,hizmetFatura:D.hizmetFatura,sonCekim:D.sonCekim,veriSurum:D.veriSurum};
  return TASI_ON+btoa(unescape(encodeURIComponent(JSON.stringify(v))));
}
async function tasimaYukle(t){
  t=String(t||"").replace(/\s+/g,"");
  if(!t.startsWith(TASI_ON))throw new Error("Bu bir taşıma kodu değil. Eski Kâr Paneli'nde önce \"ARAYX'e taşı\"ya bas.");
  const v=JSON.parse(decodeURIComponent(escape(atob(t.slice(TASI_ON.length)))));
  if(v.kopru&&v.kopru.adres&&v.kopru.kod)Depo.kopruYaz({adres:v.kopru.adres,kod:v.kopru.kod});
  if(v.ayar)D.ayar=birlestirAyar(v.ayar);
  D.urunler={...(v.urunler||{}),...D.urunler};
  (v.kalemler||[]).forEach(k=>{if(!D.kalemler[k.id])D.kalemler[k.id]=k});
  D.kargolar={...(v.kargolar||{}),...D.kargolar};D.odemeler={...(v.odemeler||{}),...D.odemeler};D.hizmetFatura={...(v.hizmetFatura||{}),...D.hizmetFatura};
  if(v.sonCekim&&!D.sonCekim){D.sonCekim=v.sonCekim;D.veriSurum=v.veriSurum||0}
  await Depo.yaz("ayarlar",D.ayar);await Depo.yaz("urunler",{u:D.urunler});await kalemleriKaydet();
  OTO.durdu=false;OTO.hata="";OTO.son=0;
  return (v.kalemler||[]).length;
}

function tasimaBagla(e){

  b.onclick=async()=>{

/* ---------- Kontrol: Trendyol'un kestiği ile olması gereken ---------- */
function kontrolBul(sat){
  const c=[];
  sat.forEach(r=>{
    if(r.iade||!r.komGercek||r.k.komisyonOran==null)return;
    const bek=r.brut*r.k.komisyonOran/100;
    if(Math.abs(bek-r.komisyon)>1)c.push({r,tur:"Komisyon",bek,ger:r.komisyon,not:`Oran ${yuzde(r.k.komisyonOran)}`});
  });
  const pk=new Set();
  sat.forEach(r=>{
    const f=D.kargolar[r.k.siparisNo];if(!f||pk.has(r.k.siparisNo))return;pk.add(r.k.siparisNo);
    const ud=r.u&&+r.u.desi;
    if(ud&&f.desi&&f.desi>ud*r.adet)c.push({r,tur:"Desi",bek:ud*r.adet,ger:f.desi,not:"Faturadaki desi ürün desisinden büyük",adet:true});
    const tarif=kargoTarife(r.brut,D.ayar);
    if(D.ayar.onay.kargo&&f.gidis>tarif*1.2)c.push({r,tur:"Kargo",bek:tarif,ger:f.gidis,not:"Tarifenin %20'sinden fazla"});
  });
  return c;
}

/* ---------- Trendyol köprüsü ---------- */
const DURUM_TY={Delivered:"teslim",Cancelled:"iptal",UnSupplied:"iptal",Returned:"iade",UnDelivered:"iade"};
async function kopru(yol,par){
  const K=Depo.kopruAl();
  const u=new URL(K.adres.replace(/\/+$/,"")+yol);
  Object.entries(par||{}).forEach(([a,v])=>u.searchParams.set(a,v));
  const c=await fetch(u.toString(),{headers:{"X-Erisim-Kodu":K.kod}});
  if(c.status===401||c.status===403){const h=new Error(c.status===401?"Erişim kodu ya da Trendyol anahtarı yanlış.":"Trendyol isteği reddetti (403). Anahtarların yetkisini kontrol et.");h.yetki=true;throw h}
  if(c.status===429)throw new Error("Trendyol kısa süreli sınır koydu. Bir dakika sonra tekrar dene.");
  if(!c.ok){let m="";try{m=(await c.json()).hata||""}catch(e){}throw new Error(m||("Trendyol hata verdi: "+c.status))}
  return c.json();
}
async function sayfaliCek(yol,par,boyut,dur){
  const sonuc=[];let sayfa=0,top=1;
  while(sayfa<top&&sayfa<50){
    const c=await kopru(yol,{...par,page:sayfa,size:boyut});
    (c.content||[]).forEach(x=>sonuc.push(x));
    top=c.totalPages||1;sayfa++;if(dur)dur(sonuc.length);
  }
  return sonuc;
}
function tyKalem(p,l,i){
  let brut=0;
  const adet=+l.quantity||1;
  if(l.discountDetails&&l.discountDetails.length){l.discountDetails.forEach(d=>{brut+=(+d.lineItemPrice||0)+(+d.lineItemTyDiscount||0)})}
  else brut=((+l.lineUnitPrice||0)+(+l.lineTyDiscount||0))*adet;
  return {id:"TY-"+p.shipmentPackageId+"-"+(l.lineId||i),kanal:"Trendyol",paket:String(p.shipmentPackageId),siparisNo:String(p.orderNumber||""),tarih:+p.orderDate-TY_SAAT_FARK,tz:1,durum:DURUM_TY[p.status]||DURUM_TY[l.orderLineItemStatusName]||"yolda",ham:String(p.status||""),sku:l.barcode||l.stockCode||"",stok:l.stockCode||"",barkod:l.barcode||"",ad:temizAd(l.productName),adet,brut:Math.round(brut*100)/100,kdvOran:l.vatRate!=null?+l.vatRate:null,komisyonOran:l.commission!=null?+l.commission:null,desi:+p.cargoDeci||null,kaynak:"api"};
}
async function siparisAl(s,e,siparisPaket){
  let n=0;
  const pk=await sayfaliCek("/siparisler",{startDate:s,endDate:e,orderByField:"PackageLastModifiedDate",orderByDirection:"DESC"},200);
  pk.forEach(p=>{
    (siparisPaket[p.orderNumber]=siparisPaket[p.orderNumber]||new Set()).add(p.shipmentPackageId);
    (p.lines||[]).forEach((l,i)=>{
      const k=tyKalem(p,l,i);const es=D.kalemler[k.id];
      D.kalemler[k.id]=es?{...es,...k,komisyonTL:es.komisyonTL}:k;n++;
      const sku=k.sku;if(sku){const o=D.urunler[sku]||{sku,stok:k.stok,ad:k.ad,barkod:k.barkod};if(k.komisyonOran!=null)o.komisyon=k.komisyonOran;if(k.kdvOran!=null)o.kdv=k.kdvOran;D.urunler[sku]=o}
    });
  });
  return n;
}
async function trendyolCek(gun,dur){
  const su=Date.now();const bas=su-gun*864e5;const dilim=14*864e5;
  const pencere=[];for(let s=bas;s<su;s+=dilim)pencere.push([s,Math.min(s+dilim,su)]);

  const urunler=await sayfaliCek("/urunler",{},100);
  /* Ürün kimliği barkoddur. Stok koduyla kayıtlı eski satırın maliyeti, kod tek üründeyse barkoda taşınır. */
  const stokSay={};const guncel=new Set();const tasinan=new Set();
  urunler.forEach(c=>(c.variants||[]).forEach(v=>{if(v.stockCode)stokSay[v.stockCode]=(stokSay[v.stockCode]||0)+1}));
  urunler.forEach(c=>(c.variants||[]).forEach(v=>{
    const sku=v.barcode||v.stockCode;if(!sku)return;
    const o=D.urunler[sku]||{sku};
    const eski=v.stockCode&&v.stockCode!==sku&&stokSay[v.stockCode]===1?D.urunler[v.stockCode]:null;
    if(eski){["gram","saat","iscilikDk","ambalaj","elMaliyet","desi"].forEach(a=>{if(o[a]==null&&eski[a]!=null)o[a]=eski[a]});tasinan.add(v.stockCode)}
    /* Bambu Studio'dan hesaplanan gram ve süre yalnız boş ürüne yazılır; elle girileni ezmez */
    const tah=window.MALIYET_TABLOSU&&window.MALIYET_TABLOSU[c.contentId];
    if(tah&&(!maliyetVar(o)||o.otoMaliyet)){o.gram=tah.gram;o.saat=tah.saat;o.otoMaliyet=true}
    o.ad=c.title||o.ad;o.stok=v.stockCode||o.stok;o.barkod=v.barcode||o.barkod;o.kdv=v.vatRate!=null?+v.vatRate:o.kdv;
    const fy=v.price&&v.price.salePrice;if(fy!=null)o.fiyat=+fy;
    const rs=urunResim(c,v);if(rs)o.resim=rs;
    D.urunler[sku]=o;guncel.add(sku);
  }));
  let n=0;
  const siparisPaket={};
  for(const [s,e] of pencere){
    dur("Siparişler alınıyor ("+n+")");
    n+=await siparisAl(s,e,siparisPaket);
  }
  /* Mağazada ve siparişlerde karşılığı kalmayan, maliyet girilmemiş eski satırlar listeden çıkar */
  if(guncel.size){
    const kullanilan=new Set();Object.values(D.kalemler).forEach(k=>{kullanilan.add(k.sku);kullanilan.add(k.barkod)});
    Object.keys(D.urunler).forEach(a=>{if(!guncel.has(a)&&!kullanilan.has(a)&&(tasinan.has(a)||!maliyetVar(D.urunler[a])))delete D.urunler[a]});
  }
  /* Hakediş ya da kargo adımı hata verirse siparişler kaybolmasın */
  await Depo.yaz("urunler",{u:D.urunler});
  await kalemleriKaydet();
  dur("Hakedişler alınıyor");
  const kom=new Map();const odeme={};const gorulen=new Set();
  for(const [s,e] of pencere){
    const son=Math.min(e,s+15*864e5);
    const k=await sayfaliCek("/hakedis",{transactionTypes:"Sale,Return",startDate:s,endDate:son},1000);
    k.forEach(x=>{
      if(x.id!=null){if(gorulen.has(x.id))return;gorulen.add(x.id)}
      if(x.paymentDate&&x.sellerRevenue!=null){const g=new Date(+x.paymentDate);g.setHours(0,0,0,0);const a=g.getTime();odeme[a]=(odeme[a]||0)+(x.transactionType==="Return"?-1:1)*Math.abs(+x.sellerRevenue)}
      if(x.transactionType!=="Sale"||!x.shipmentPackageId)return;
      const a=x.shipmentPackageId+"|"+x.barcode;kom.set(a,(kom.get(a)||0)+Math.abs(+x.commissionAmount||0));
    });
  }
  Object.assign(D.odemeler,odeme);
  Object.values(D.kalemler).forEach(k=>{if(k.kanal==="Trendyol"){const a=k.paket+"|"+k.barkod;if(kom.has(a))k.komisyonTL=Math.round(kom.get(a)*100)/100}});
  dur("Kargo faturaları alınıyor");
  const hizmet={};const fatGorulen=new Set();
  for(const [s,e] of pencere){
    const fat=await sayfaliCek("/diger-finans",{transactionType:"DeductionInvoices",startDate:s,endDate:Math.min(e,s+15*864e5)},1000);
    for(const f of fat){
      if(f.id!=null){if(fatGorulen.has(f.id))continue;fatGorulen.add(f.id)}
      const tur=String(f.transactionType||"");
      if(/kargo\s*fatura/i.test(tur)&&f.id){
        const satir=await sayfaliCek("/kargo-fatura/"+encodeURIComponent(f.id),{},500);
        satir.forEach(c=>{
          const o=D.kargolar[c.orderNumber]=D.kargolar[c.orderNumber]||{gidis:0,iade:0,desi:0,paket:1,fat:{}};
          if(siparisPaket[c.orderNumber])o.paket=siparisPaket[c.orderNumber].size;
          const anah=f.id+"|"+c.parcelUniqueId+"|"+c.shipmentPackageType;if(o.fat[anah])return;o.fat[anah]=1;
          if(/iade/i.test(c.shipmentPackageType||""))o.iade+=+c.amount||0;else{o.gidis+=+c.amount||0;o.desi=Math.max(o.desi,+c.desi||0)}
        });
      }else if(/hizmet|platform/i.test(tur+" "+(f.description||""))){
        const a=ayAnahtar(+f.transactionDate||s);hizmet[a]=(hizmet[a]||0)+Math.abs(+f.debt||+f.credit||0);
      }

  }

  D.veriSurum=VERI_SURUM;
  D.sonCekim=Date.now();
  dur("Kaydediliyor");
  await Depo.yaz("urunler",{u:D.urunler});
  await kalemleriKaydet();
  return n;
}
/* ---------- n11 siparişleri (aynı köprüden, yalnız okur) ----------
   n11 anahtarı Cloudflare'a girilmemişse sessizce atlanır; n11 hatası Trendyol'u durdurmaz.
   Durum kodları n11 belgesinden: 7/10 teslim, 3/4/8 iptal, 9/13/16/17 iade, gerisi yolda. */
const DURUM_N11={"7":"teslim","10":"teslim","3":"iptal","4":"iptal","8":"iptal","9":"iade","13":"iade","16":"iade","17":"iade"};
/* n11 "detailedOrders belli süre aralıklarıyla güncellenebilir" diye sık sorguyu reddeder:
   tek tarih aralığıyla sorulur, en az 10 dakika arayla; reddederse 15 dakika beklenir. */
const N11={yok:false,tamCekildi:false,hata:"",son:0,bekle:0};

function n11Gun(ms){const t=new Date(ms+3*36e5);return String(t.getUTCDate()).padStart(2,"0")+"/"+String(t.getUTCMonth()+1).padStart(2,"0")+"/"+t.getUTCFullYear()}
function n11Zaman(s){const m=String(s||"").match(/(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}):(\d{2}))?/);return m?Date.UTC(+m[3],+m[2]-1,+m[1],(+m[4]||0)-3,+m[5]||0):Date.now()}
function n11Kalem(o,l,i){
  const adet=+l.quantity||1;const brut=Math.max(0,(+l.price||0)*adet-(+l.sellerDiscount||0));
  return {id:"N11-"+o.orderNumber+"-"+(l.id||i),kanal:"N11",paket:String(o.orderNumber||""),siparisNo:String(o.orderNumber||""),tarih:n11Zaman(o.createDate),durum:DURUM_N11[String(l.status)]||"yolda",ham:String(l.status||""),sku:l.productSellerCode||"",stok:l.productSellerCode||"",barkod:"",ad:temizAd(l.productName),adet,brut:Math.round(brut*100)/100,kdvOran:null,komisyonOran:null,kaynak:"api"};
}
async function n11Cek(gun){
  if(N11.yok)return 0;
  const su=Date.now();let n=0;let sayfa=0,top=1;
  while(sayfa<top&&sayfa<20){
    let c;
    try{c=await kopru("/n11-siparisler",{baslangic:n11Gun(su-gun*864e5),bitis:n11Gun(su),sayfa})}
    catch(x){
      if(/girilmemiş/.test(x.message)){N11.yok=true;return n}
      if(/belli süre|aralık/i.test(x.message)){const h=new Error("n11 sık sorguya izin vermiyor, birkaç dakika sonra kendiliğinden tekrar denenecek.");h.sinir=true;throw h}
      throw new Error(x.yetki?"n11 anahtarı ya da şifresi yanlış.":x.message);
    }
    (c.content||[]).forEach(o=>(o.lines||[]).forEach((l,i)=>{const k=n11Kalem(o,l,i);const es=D.kalemler[k.id];D.kalemler[k.id]=es?{...es,...k}:k;n++}));
    top=c.totalPages||1;sayfa++;
  }

async function n11Guvenli(gun){

/* ---------- Hepsiburada siparişleri (aynı köprüden, yalnız okur) ----------
   Köprü iki liste verir: satirlar (paketlenecek + paketlenmiş, ürün ve tutarla) ve durumlar (kargoda/teslim/teslim edilemedi/iptal).
   Uygulamada hiç görülmemiş eski siparişin ürün bilgisi tek tek /hb-siparis ile alınır (her yenilemede en çok 12).
   HB bilgisi Cloudflare'a girilmemişse sessizce atlanır; HB hatası Trendyol'u durdurmaz. */
const DURUM_HB={Delivered:"teslim",Undelivered:"iade",ClaimCreated:"iade"};
const BEKLEYEN_HB=new Set(["Open","Unpacked","Packaged"]);
const HB={yok:false,bagli:false,tamCekildi:false,hata:"",son:0,detayYok:new Set()};
const HB_ARALIK=4*6e4;
function hbSira(h){h=String(h||"");if(/cancel/i.test(h))return 4;if(/^(Delivered|Undelivered)$|claim/i.test(h))return 3;if(h==="InTransit")return 2;return h?1:0}
function hbDurum(h){return /cancel/i.test(h||"")?"iptal":DURUM_HB[h]||"yolda"}
function hbZaman(s){if(!s)return null;const t=String(s);const d=Date.parse(/[zZ]$|[+-]\d\d:?\d\d$/.test(t)?t:t+"+03:00");return isNaN(d)?null:d}
function hbKalemYap(x){
  const no=String(x.siparisNo||"");
  return {id:"HB-"+no+"-"+(x.kalem||x.sku||"0"),kanal:"Hepsiburada",paket:x.paket||no,siparisNo:no,tarih:hbZaman(x.tarih)||Date.now(),durum:hbDurum(x.ham),ham:x.ham||"",sku:x.sku||x.hbSku||"",stok:x.sku||"",barkod:x.barkod||"",ad:temizAd(x.ad),adet:+x.adet||1,brut:+x.brut||0,kdvOran:x.kdvOran!=null?+x.kdvOran:null,komisyonOran:x.komOran!=null?+x.komOran:null,kaynak:"api"};
}
function hbYaz(k){const es=D.kalemler[k.id];D.kalemler[k.id]=es?{...es,...k,ad:k.ad||es.ad,brut:k.brut||es.brut}:k}
async function hbCek(gun){
  if(HB.yok)return 0;
  let c;
  try{c=await kopru("/hb-siparisler",{gun})}
  catch(x){if(/girilmemiş/.test(x.message)){HB.yok=true;return 0}throw x}
  HB.bagli=true;let n=0;
  (c.satirlar||[]).forEach(x=>{if(x.siparisNo){hbYaz(hbKalemYap(x));n++}});
  const hbKal=()=>Object.values(D.kalemler).filter(k=>k.kanal==="Hepsiburada"&&k.kaynak==="api");
  const bilinmeyen=new Map();
  for(const d of c.durumlar||[]){
    if(!d.siparisNo)continue;
    const sip=hbKal().filter(k=>k.siparisNo===d.siparisNo);
    if(!sip.length){if(!HB.detayYok.has(d.siparisNo)&&!bilinmeyen.has(d.siparisNo))bilinmeyen.set(d.siparisNo,d);continue}
    let hedef=d.ham==="Cancelled"&&d.kalem?sip.filter(k=>k.id.endsWith("-"+d.kalem)):d.paket?sip.filter(k=>k.paket===d.paket):sip;
    if(!hedef.length)hedef=sip.filter(k=>k.durum!=="iptal");
    hedef.forEach(k=>{if(hbSira(d.ham)>=hbSira(k.ham)&&k.ham!==d.ham){k.ham=d.ham;k.durum=hbDurum(d.ham);if(d.paket&&d.ham!=="Cancelled")k.paket=d.paket;n++}});
  }

    if(say++>=12)break;

      const r=await kopru("/hb-siparis",{no});const kl=r.kalemler||[];
      if(!kl.length){HB.detayYok.add(no);continue}
      kl.forEach((x,i)=>{const ham=hbSira(x.ham)>hbSira(d.ham)?x.ham:d.ham;hbYaz(hbKalemYap({...x,siparisNo:no,kalem:x.kalem||String(i),paket:d.ham==="Cancelled"?(x.paket||no):(d.paket||x.paket),tarih:x.tarih||d.tarih,ham}));n++});
    }catch(e){HB.detayYok.add(no)}
  }
  return n;
}
async function hbGuvenli(gun){
  const su=Date.now();
  if(HB.yok||su-HB.son<HB_ARALIK)return 0;
  HB.son=su;
  try{const n=await hbCek(HB.tamCekildi?gun:30);HB.tamCekildi=true;HB.hata="";return n}
  catch(x){HB.hata="Hepsiburada: "+(x.message==="Failed to fetch"?"ulaşılamadı":x.message);return 0}

/* ---------- Otomatik yenileme: yalnız uygulama açık ve görünürken, köprü kuruluysa çalışır.
   Son 3 günün siparişleri 5 dakikada bir, komisyon ve kargo faturası günde bir kez alınır.
   Sadece ekler ve günceller; hata olursa eldeki veriye dokunmaz. */
const OTO={son:0,calisiyor:null,durdu:false,hata:"",kismi:"",basari:0,tamDeneme:0};

/* Kayıt biçimi değişince eski siparişler ilk açılışta baştan çekilir */
const VERI_SURUM=4; /* 4: ürün fotoğrafları için bir kez tam çekim */
function otoHazir(){const K=Depo.kopruAl();return !artifactte&&!!K.adres&&!!K.kod&&!OTO.durdu&&document.visibilityState==="visible"&&D.yuklendi}
function imza(){return Object.values(D.kalemler).map(k=>k.id+"|"+k.durum+"|"+k.ham+"|"+k.komisyonTL).sort().join(";")}
function otoYenile(esik){

  OTO.son=Date.now();
  const soz=(async()=>{
    const once=imza();const eskiSayi=Object.keys(D.kalemler).length;const iadeOnce=iadeImza();
    let tamOldu=false;
    try{
      const su=Date.now();
      if((D.veriSurum!==VERI_SURUM||su-(D.sonCekim||0)>=OTO_TAM)&&su-OTO.tamDeneme>=OTO_TAM_TEKRAR){
        OTO.tamDeneme=su;
        try{await trendyolCek(30,()=>{});tamOldu=true;OTO.kismi=""}
        catch(x){if(x.yetki)throw x;OTO.kismi="Komisyon ve kargo faturası alınamadı: "+x.message}
      }
      if(!tamOldu)await siparisAl(su-7*864e5,su,{});
      await n11Guvenli(7);
      await hbGuvenli(tamOldu?30:7);
      if(imza()!==once){await Depo.yaz("urunler",{u:D.urunler});await kalemleriKaydet()}
      await iadeGuvenli(false);
      OTO.hata="";OTO.basari=Date.now();
    }catch(x){
      OTO.hata=x.message||"Güncellenemedi";
      if(x.yetki)OTO.durdu=true;
    }
    const yeni=Object.keys(D.kalemler).length-eskiSayi;
    if(yeni>0)uyar(yeni+" yeni sipariş satırı geldi.");
    const iadeDegisti=iadeImza()!==iadeOnce;
    if((tamOldu||imza()!==once||iadeDegisti)&&!$("#perde")&&(G.sekme==="ozet"||G.sekme==="siparis"||G.sekme==="iadeler"))ciz();else{etiketYaz();if(iadeDegisti)sekmeCiz()}
    return true;
  })().finally(()=>{if(OTO.calisiyor===soz)OTO.calisiyor=null});
  OTO.calisiyor=soz;
  return soz;
}

const BIL={destek:("serviceWorker" in navigator)&&("PushManager" in window)&&("Notification" in window)};

}
async function bildirimAc(){

   Pazaryerinde hiçbir şey değiştirilmez; onay ve red satıcı panelinden verilir.
   Kontrol bilgisi (ürün geldi mi, durumu, not) yalnız bu cihazda tutulur: D.iadeK[anah].

async function iadeGuvenli(zorla){

    const tam=su-IADE.tamZaman>=IADE_TAM;

    if(tam)IADE.tamZaman=su;
    IADE.hata="";IADE.kanallar=c.kanallar||{};IADE.basari=su;

  }finally{IADE.calisiyor=false}
}

function norm(s){return String(s==null?"":s).toLocaleLowerCase("tr-TR").replace(/\s+/g," ").trim()}
function excelOku(dosya,cb){
  const r=new FileReader();
  r.onload=()=>{try{
    const wb=XLSX.read(new Uint8Array(r.result),{type:"array",cellDates:false});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const sat=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
    let bas=sat.findIndex(x=>x.filter(c=>c!=="").length>=3);if(bas<0)bas=0;
    const bas2=sat.slice(bas,bas+6).findIndex(x=>x.some(c=>/sipariş|siparis|barkod|paket/i.test(String(c))));
    if(bas2>0)bas+=bas2;
    const baslik=sat[bas].map(String);
    const eslesme={};
    EX_ALAN.forEach(([a,,tak])=>{for(const t of tak){const i=baslik.findIndex(b=>norm(b)===t);if(i>=0){eslesme[a]=i;break}}});
    cb({baslik,satirlar:sat.slice(bas+1).filter(x=>x.some(c=>c!=="")),eslesme});
  }catch(e){uyar("Dosya okunamadı. .xlsx ya da .csv seç.")}};
  r.readAsArrayBuffer(dosya);
}
function sayiOku(v){
  if(typeof v==="number")return v;const s=String(v==null?"":v).replace(/[^\d,.\-]/g,"");if(!s)return null;
  const t=s.lastIndexOf(","),n=s.lastIndexOf(".");
  return parseFloat(t>n?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,""));
}
function tarihOku(v){
  if(typeof v==="number"&&v>20000&&v<80000)return Math.round((v-25569)*864e5+new Date().getTimezoneOffset()*6e4);
  if(typeof v==="number")return v>1e11?v:NaN;
  const s=String(v||"").trim();const m=s.match(/(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})(?:[ T](\d{1,2}):(\d{2}))?/);
  if(m){const y=+m[3]<100?2000+ +m[3]:+m[3];return new Date(y,+m[2]-1,+m[1],+m[4]||0,+m[5]||0).getTime()}
  const d=Date.parse(s);return isNaN(d)?NaN:d;
}
function durumOku(v){
  const s=norm(v);
  if(/iptal|cancel|tedarik edile/.test(s))return "iptal";
  if(/iade|return|teslim edilemedi|undeliver/.test(s))return "iade";
  if(/teslim|deliver|tamamlan/.test(s))return "teslim";
  return "yolda";
}
function excelCevir(ex,kanal){
  const al=(s,a)=>ex.eslesme[a]!=null?s[ex.eslesme[a]]:"";
  const c=[];let atla=0;
  ex.satirlar.forEach((s,i)=>{
    const tarih=tarihOku(al(s,"tarih"));const brut=sayiOku(al(s,"brut"));
    if(isNaN(tarih)||brut==null||isNaN(brut)){atla++;return}
    const pk=String(al(s,"paket")||al(s,"siparisNo")||("x"+i));const sku=String(al(s,"sku")||al(s,"barkod")||"").trim();
    const kor=sayiOku(al(s,"komisyonOran"));const ktl=sayiOku(al(s,"komisyonTL"));const kgo=sayiOku(al(s,"kargoTL"));
    c.push({id:kanal.slice(0,2).toUpperCase()+"-"+pk+"-"+(sku||i),kanal,paket:pk,siparisNo:String(al(s,"siparisNo")||pk),tarih,durum:durumOku(al(s,"durum")),ham:String(al(s,"durum")||""),sku,barkod:String(al(s,"barkod")||""),ad:String(al(s,"ad")||""),adet:sayiOku(al(s,"adet"))||1,brut,komisyonOran:kor!=null&&!isNaN(kor)?kor:null,komisyonTL:ktl!=null&&!isNaN(ktl)?Math.abs(ktl):null,kargoTL:kgo!=null&&!isNaN(kgo)?Math.abs(kgo):null,desi:sayiOku(al(s,"desi")),kaynak:"excel"});
  });
  return {c,atla};
}

function excelEsleCiz(){
  const ex=exDurum;const k=$("#exEsle");
  const zor=["tarih","brut"];const secim=EX_ALAN.map(([a,et])=>`<div class="alan"><label for="eş${a}">${et}${zor.includes(a)?" *":""}</label><select id="eş${a}" data-es="${a}"><option value="">Yok</option>${ex.baslik.map((b,i)=>`<option value="${i}" ${ex.eslesme[a]===i?"selected":""}>${esc(b)}</option>`).join("")}</select></div>`).join("");
  k.innerHTML=`<p class="not" style="margin-block:8px"><b>${ex.satirlar.length} satır</b> bulundu. Sütunlar doğru eşleşmiş mi kontrol et.</p><div class="alanlar">${secim}</div><div class="sira" style="margin-top:10px"><button class="btn" id="exAl">Siparişleri ekle</button><span class="not" id="exOn"></span></div>`;
  k.querySelectorAll("[data-es]").forEach(s=>s.onchange=()=>{const v=s.value;if(v==="")delete ex.eslesme[s.dataset.es];else ex.eslesme[s.dataset.es]=+v;onizle()});
  const onizle=()=>{const {c,atla}=excelCevir(ex,$("#exKanal").value);const t=c.reduce((a,b)=>a+(b.durum==="iptal"?0:b.brut),0);$("#exOn").textContent=`${c.length} satır okunacak, toplam ${tl(t)}${atla?`, ${atla} satır atlanacak (tarih ya da tutar okunamadı)`:""}.`};
  onizle();
  $("#exAl").onclick=async()=>{
    const {c}=excelCevir(ex,$("#exKanal").value);
    if(!c.length){uyar("Okunacak satır yok. Tarih ve tutar sütununu seç.");return}
    c.forEach(k=>{D.kalemler[k.id]=k;const an=k.kanal==="Trendyol"&&k.barkod?k.barkod:k.sku;if(an){const o=D.urunler[an]||{sku:an,stok:k.sku,ad:k.ad,barkod:k.barkod};if(k.komisyonOran!=null&&k.kanal==="Trendyol")o.komisyon=k.komisyonOran;if(!o.fiyat&&k.adet)o.fiyat=Math.round(k.brut/k.adet*100)/100;D.urunler[an]=o}});
    await Depo.yaz("urunler",{u:D.urunler});await kalemleriKaydet();exDurum=null;uyar(c.length+" satır eklendi.");G.sekme="ozet";ciz();
  };
}
async function yedekAl(){
  const veri=JSON.stringify({uyg:"arayx-kar-paneli",tarih:Date.now(),ayar:D.ayar,urunler:D.urunler,kalemler:Object.values(D.kalemler),kargolar:D.kargolar,odemeler:D.odemeler,hizmetFatura:D.hizmetFatura,sonCekim:D.sonCekim});
  const ad="arayx-kar-yedek-"+new Date().toISOString().slice(0,10)+".json";
  if(artifactte){
    let dl=null;try{dl=await window.claude.use("downloads")}catch(e){}
    if(dl){try{await dl.save({filename:ad,data:veri});return}catch(e){return}}
    uyar("Bu görünümde dosya indirilemiyor.");return;
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([veri],{type:"application/json"}));a.download=ad;document.body.appendChild(a);a.click();a.remove();
}
function yedekYukle(ev){
  const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{
    const v=JSON.parse(r.result);if(v.uyg!=="arayx-kar-paneli")throw 0;
    D.ayar=birlestirAyar(v.ayar||{});D.urunler=v.urunler||{};D.kalemler={};(v.kalemler||[]).forEach(k=>{D.kalemler[k.id]=k});D.kargolar=v.kargolar||{};D.odemeler=v.odemeler||{};D.hizmetFatura=v.hizmetFatura||{};D.sonCekim=v.sonCekim||null;
    await Depo.yaz("ayarlar",D.ayar);await Depo.yaz("urunler",{u:D.urunler});await kalemleriKaydet();uyar("Yedek yüklendi.");ciz();
  }catch(e){uyar("Bu dosya Kâr Paneli yedeği değil.")}};
  r.readAsText(f);
}
/* ---------- Olay yönlendirme ---------- */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-sekme],[data-git],[data-donem],[data-kanal],[data-sipf],[data-bek],[data-bilsorma],[data-gun]");if(!t)return;
  if(t.dataset.gun!=null){G.gunSec=+t.dataset.gun;ciz();return}
  if(t.dataset.sekme){G.sekme=t.dataset.sekme;ciz();scrollTo(0,0)}
  else if(t.dataset.git){G.sekme=t.dataset.git;ciz();const h=t.dataset.odak&&document.getElementById(t.dataset.odak);if(h)h.scrollIntoView();else scrollTo(0,0)}
  else if(t.dataset.donem){G.donem=t.dataset.donem;ciz()}
  else if(t.dataset.kanal){G.kanal=t.dataset.kanal;ciz()}
  else if(t.dataset.bilsorma){try{localStorage.setItem("karCihaz:bildirimSorma","1")}catch(e){}ciz()}
  else if(t.dataset.bek!==undefined){G.bekKanal=G.bekKanal===t.dataset.bek?"":t.dataset.bek;ciz()}
  else if(t.dataset.sipf){G.sipFiltre=t.dataset.sipf;G.sekme="siparis";ciz()}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&$("#perde")){$("#katman").innerHTML="";ciz()}});
ciz();
yukle().then(()=>otoYenile(0));
setInterval(()=>otoYenile(OTO_ARALIK),6e4);
document.addEventListener("visibilitychange",()=>otoYenile(OTO_DONUS));
</script>
