ateKey, 256));\n  const ikm = await hkdf(auth, ortak, birlestir(enc.encode(\"WebPush: info\\0\"), uaPub, asPub), 32);\n  const salt = crypto.getRandomValues(new Uint8Array(16));\n  const cek = await hkdf(salt, ikm, enc.encode(\"Content-Encoding: aes128gcm\\0\"), 16);\n  const nonce = await hkdf(salt, ikm, enc.encode(\"Content-Encoding: nonce\\0\"), 12);\n  const aes = await crypto.subtle.importKey(\"raw\", cek, \"AES-GCM\", false, [\"encrypt\"]);\n  const sifreli = new Uint8Array(\n    await crypto.subtle.encrypt({ name: \"AES-GCM\", iv: nonce }, aes, birlestir(enc.encode(metin), new Uint8Array([2])))\n  );\n  const rs = new Uint8Array([0, 0, 16, 0]);\n  return birlestir(salt, rs, new Uint8Array([asPub.length]), asPub, sifreli);\n}\nasync function bildirimGonder(env, veri) {\n  const aboneler = (await env.KV.get(\"aboneler\", \"json\")) || [];\n  if (!aboneler.length) return [];\n  const vapid = await vapidAl(env);\n  const metin = JSON.stringify(veri);\n  const sonuc = [];\n  const kalan = [];\n  for (const a of aboneler) {\n    let durum = 0;\n    const servis = new URL(a.endpoint).host;\n    try {\n      const c = await fetch(a.endpoint, {\n        method: \"POST\",\n        headers: {\n          Authorization: await vapidBaslik(vapid, a.endpoint),\n          \"Content-Encoding\": \"aes128gcm\",\n          \"Content-Type\": \"application/octet-stream\",\n          TTL: \"86400\",\n          Urgency: \"high\",\n        },\n        body: await sifrele(a, metin),\n      });\n      durum = c.status;\n      sonuc.push(c.status >= 400 ? { durum, servis, mesaj: (await c.text()).slice(0, 200) } : { durum, servis });\n    } catch (e) {\n      sonuc.push({ durum: 0, servis, mesaj: String(e).slice(0, 200) });\n    }\n    if (durum !== 404 && durum !== 410) kalan.push(a); // telefonun aboneliği bitmişse listeden çıkar\n  }\n  if (kalan.length !== aboneler.length) await env.KV.put(\"aboneler\", JSON.stringify(kalan));\n  return sonuc;\n}\n\nasync function n11Soap(env, istekAdi, ic) {\n  const govde =\n    '<soapenv:Envelope xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\" xmlns:sch=\"http://www.n11.com/ws/schemas\">' +\n    `<soapenv:Header/><soapenv:Body><sch:${istekAdi}>` +\n    `<auth><appKey>${xmlKacis(env.N11_APP_KEY)}<\/appKey><appSecret>${xmlKacis(env.N11_APP_SECRET)}<\/appSecret><\/auth>` +\n    ic +\n    `<\/sch:${istekAdi}><\/soapenv:Body><\/soapenv:Envelope>`;\n  const c = await fetch(N11_SIPARIS, { method: \"POST\", headers: { \"Content-Type\": \"text/xml; charset=utf-8\", SOAPAction: \"\" }, body: govde });\n  const xml = await c.text();\n  const sonuc = alanlariAl(bloklar(xml, \"result\")[0] || \"\", [\"status\", \"errorCode\", \"errorMessage\"]);\n  if (!c.ok || sonuc.status !== \"success\") throw new Error(\"n11: \" + (sonuc.errorMessage || sonuc.errorCode || c.status));\n  return xml;\n}\nfunction trGun(ms) {\n  const t = new Date(ms + 3 * 36e5);\n  return String(t.getUTCDate()).padStart(2, \"0\") + \"/\" + String(t.getUTCMonth() + 1).padStart(2, \"0\") + \"/\" + t.getUTCFullYear();\n}\nconst tlYaz = (x) => new Intl.NumberFormat(\"tr-TR\", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(+x || 0) + \" TL\";\nconst kisalt = (s, n) => {\n  s = String(s || \"\").replace(/\\s+/g, \" \").trim();\n  return s.length > n ? s.slice(0, n - 1) + \"…\" : s;\n};\n\nasync function siparisKontrol(env) {\n  if (!env.KV) return { hata: \"KV bağlı değil\" };\n  const kayit = (await env.KV.get(\"gorulen\", \"json\")) || null;\n  const ilk = !kayit; // ilk çalışmada eski siparişler için bildirim gitmez, sadece işaretlenir\n  const ids = (kayit && kayit.ids) || {};\n  const su = Date.now();\n  const yeni = [];\n  const notlar = [];\n  // Trendyol\n  try {\n    const u = `${API}/order/sellers/${env.TRENDYOL_SATICI_ID}/v2/orders?startDate=${su - 2 * 864e5}&endDate=${su}&size=200&orderByField=PackageLastModifiedDate&orderByDirection=DESC`;\n    const c = await fetch(u, {\n      headers: {\n        Authorization: \"Basic \" + btoa(env.TRENDYOL_API_KEY + \":\" + env.TRENDYOL_API_SECRET),\n        \"User-Agent\": env.TRENDYOL_SATICI_ID + \" - SelfIntegration\",\n        Accept: \"application/json\",\n      },\n    });\n    if (!c.ok) throw new Error(\"Trendyol \" + c.status);\n    const v = await c.json();\n    for (const p of v.content || []) {\n      if (p.status === \"Awaiting\") continue; // ödemesi onaylanınca bildirilir\n      const a = \"TY:\" + p.orderNumber;\n      if (ids[a]) continue;\n      ids[a] = su;\n      if (ilk || /Cancel|UnSupplied/.test(p.status || \"\")) continue;\n      const satir = p.lines || [];\n      const tutar =\n        p.totalPrice ?? p.grossAmount ?? satir.reduce((x, l) => x + (+l.lineGrossAmount || (+l.price || 0) * (+l.quantity || 1)), 0);\n      yeni.push({ kanal: \"Trendyol\", ad: satir.map((l) => l.productName).filter(Boolean), tutar });\n    }\n  } catch (e) {\n    notlar.push(String(e.message || e));\n  }\n  // n11: hafif liste; ürün adı yalnız yeni sipariş için ayrıntıdan alınır\n  if (env.N11_APP_KEY && env.N11_APP_SECRET) {\n    try {\n      const xml = await n11Soap(\n        env,\n        \"OrderListRequest\",\n        `<searchData><period><startDate>${trGun(su - 2 * 864e5)}<\/startDate><endDate>${trGun(su)}<\/endDate><\/period><\/searchData><pagingData><currentPage>0<\/currentPage><pageSize>100<\/pageSize><\/pagingData>`\n      );\n      for (const o of bloklar(xml, \"order\")) {\n        const s = alanlariAl(o, [\"id\", \"orderNumber\", \"totalAmount\", \"status\"]);\n        const a = \"N11:\" + (s.orderNumber || s.id);\n        if (!s.id || ids[a]) continue;\n        ids[a] = su;\n        if (ilk) continue;\n        let ad = [];\n        try {\n          const d = await n11Soap(env, \"OrderDetailRequest\", `<orderRequest><id>${xmlKacis(s.id)}<\/id><\/orderRequest>`);\n          ad = bloklar(d, \"item\").map((k) => alanlariAl(k, [\"productName\"]).productName).filter(Boolean);\n        } catch (e) {\n          /* ad olmadan da bildir */\n        }\n        yeni.push({ kanal: \"n11\", ad, tutar: s.totalAmount });\n      }\n    } catch (e) {\n      notlar.push(String(e.message || e));\n    }\n  }\n  // Hepsiburada: paketlenmeyi bekleyen (ödemesi tamamlanmış) siparişler. İlk HB turunda yalnız işaretlenir.\n  let hb = !!(kayit && kayit.hb);\n  if (env.HB_MERCHANT_ID && env.HB_SECRET_KEY) {\n    try {\n      const l = hbListe(await hbIstek(env, `/orders/merchantid/${env.HB_MERCHANT_ID}?offset=0&limit=50`));\n      const sip = {};\n      for (const x of l) {\n        const k = hbKalem(x);\n        if (!k.siparisNo) continue;\n        (sip[k.siparisNo] = sip[k.siparisNo] || []).push(k);\n      }\n      for (const [no, kl] of Object.entries(sip)) {\n        const a = \"HB:\" + no;\n        if (ids[a]) continue;\n        ids[a] = su;\n        if (ilk || !hb) continue;\n        yeni.push({ kanal: \"Hepsiburada\", ad: kl.map((k) => k.ad).filter(Boolean), tutar: kl.reduce((t, k) => t + k.brut, 0) });\n      }\n      hb = true;\n    } catch (e) {\n      notlar.push(String(e.message || e).slice(0, 200));\n    }\n  }\n  for (const a of Object.keys(ids)) if (su - ids[a] > 10 * 864e5) delete ids[a]; // 10 günden eskileri unut\n  await env.KV.put(\"gorulen\", JSON.stringify({ ids, son: su, not: notlar, hb }));\n  let gonderim = [];\n  if (yeni.length === 1) {\n    const y = yeni[0];\n    gonderim = await bildirimGonder(env, {\n      baslik: \"Yeni sipariş · \" + y.kanal,\n      govde: (y.ad.length ? kisalt(y.ad[0], 70) + (y.ad.length > 1 ? \" +\" + (y.ad.length - 1) + \" ürün\" : \"\") + \"\\n\" : \"\") + tlYaz(y.tutar),\n      etiket: \"siparis-\" + su,\n      url: \"kar.html\",\n    });\n  } else if (yeni.length > 1) {\n    const say = {};\n    yeni.forEach((y) => (say[y.kanal] = (say[y.kanal] || 0) + 1));\n    gonderim = await bildirimGonder(env, {\n      baslik: yeni.length + \" yeni sipariş\",\n      govde:\n        Object.entries(say).map(([k, n]) => k + \": \" + n).join(\" · \") +\n        \"\\nToplam \" + tlYaz(yeni.reduce((a, y) => a + (+y.tutar || 0), 0)),\n      etiket: \"siparis-\" + su,\n      url: \"kar.html\",\n    });\n  }\n  return { ilk, yeni: yeni.length, notlar, gonderim };\n}\n\nasync function bildirimYolu(istek, env, url, yanit) {\n  if (!env.KV) return yanit({ hata: \"Cloudflare'da KV bağlantısı yok.\" }, 501);\n  if (url.pathname === \"/bildirim/anahtar\") return yanit({ anahtar: (await vapidAl(env)).pub }, 200);\n  if (url.pathname === \"/bildirim/durum\") {\n    const g = (await env.KV.get(\"gorulen\", \"json\")) || {};\n    const ab = (await env.KV.get(\"aboneler\", \"json\")) || [];\n    return yanit({ abone: ab.length, sonKontrol: g.son || null, not: g.not || [] }, 200);\n  }\n  if (url.pathname === \"/bildirim/abone\" && istek.method === \"POST\") {\n    let a;\n    try {\n      a = await istek.json();\n    } catch (e) {\n      return yanit({ hata: \"Abonelik okunamadı.\" }, 400);\n    }\n    if (!a || typeof a.endpoint !== \"string\" || !/^https:\\/\\//.test(a.endpoint) || !a.keys || !a.keys.p256dh || !a.keys.auth) {\n      return yanit({ hata: \"Abonelik eksik.\" }, 400);\n    }\n    const temiz = { endpoint: a.endpoint, keys: { p256dh: String(a.keys.p256dh), auth: String(a.keys.auth) }, eklendi: Date.now() };\n    const ab = ((await env.KV.get(\"aboneler\", \"json\")) || []).filter((x) => x.endpoint !== temiz.endpoint);\n    ab.push(temiz);\n    const son = ab.slice(-10);\n    await env.KV.put(\"aboneler\", JSON.stringify(son));\n    return yanit({ tamam: true, abone: son.length }, 200);\n  }\n  if (url.pathname === \"/bildirim/sil\" && istek.method === \"POST\") {\n    let a = {};\n    try {\n      a = await istek.json();\n    } catch (e) {}\n    const ab = ((await env.KV.get(\"aboneler\", \"json\")) || []).filter((x) => x.endpoint !== a.endpoint);\n    await env.KV.put(\"aboneler\", JSON.stringify(ab));\n    return yanit({ tamam: true, abone: ab.length }, 200);\n  }\n  if (url.pathname === \"/bildirim/deneme\") {\n    const s = await bildirimGonder(env, {\n      baslik: \"ARAYX Kâr Paneli\",\n      govde: \"Deneme bildirimi. Yeni siparişlerde böyle haber vereceğim.\",\n      etiket: \"deneme\",\n      url: \"kar.html\",\n    });\n    return yanit({ gonderim: s }, 200);\n  }\n  if (url.pathname === \"/bildirim/kontrol\") return yanit(await siparisKontrol(env), 200);\n  return yanit({ hata: \"Bilinmeyen adres.\" }, 404);\n}\n\n// ---------------------------------------------------------------------------\n// Hepsiburada (canlı): HB_MERCHANT_ID + HB_SECRET_KEY (Basic) ve HB_USER_AGENT (arayx_dev).\n// Yalnız okunur. Müşteri adı, adres, telefon, TC/vergi no köprüden geçmez: kalemde yalnız aşağıdaki alanlar döner.\n// ---------------------------------------------------------------------------\nconst HB_OMS = \"https://oms-external.hepsiburada.com\";\nasync function hbIstek(env, yol) {\n  const c = await fetch(HB_OMS + yol, {\n    headers: {\n      Authorization: \"Basic \" + btoa(env.HB_MERCHANT_ID + \":\" + env.HB_SECRET_KEY),\n      \"User-Agent\": env.HB_USER_AGENT || \"arayx_dev\",\n      Accept: \"application/json\",\n    },\n  });\n  const metin = await c.text();\n  if (c.status === 404) return []; // HB boş listede 404 dönebiliyor\n  if (!c.ok) {\n    const h = new Error(\"Hepsiburada \" + c.status + (metin ? \": \" + metin.slice(0, 160) : \"\"));\n    h.durum = c.status;\n    throw h;\n  }\n  try {\n    return metin ? JSON.parse(metin) : null;\n  } catch (e) {\n    throw new Error(\"Hepsiburada'dan okunamayan cevap geldi.\");\n  }\n}\nconst hbListe = (v) => (Array.isArray(v) ? v : (v && (v.items || v.data || v.content || v.lineItems)) || []);\n// Alan adı büyük/küçük harf farkıyla gelebilir (PackageNumber / packageNumber)\nfunction al(o, ...adlar) {\n  if (!o || typeof o !== \"object\") return undefined;\n  for (const a of adlar) {\n    if (o[a] !== undefined && o[a] !== null) return o[a];\n    const k = Object.keys(o).find((x) => x.toLowerCase() === a.toLowerCase());\n    if (k && o[k] !== undefined && o[k] !== null) return o[k];\n  }\n  return undefined;\n}\nconst para = (x) => (x && typeof x === \"object\" ? +al(x, \"amount\") || 0 : +x || 0);\n// Sipariş kalemi: yalnız ürün, adet, tutar, durum, tarih. Müşteriye ait hiçbir alan alınmaz.\nfunction hbKalem(x, ust = {}) {\n  const merchantTop = para(al(x, \"merchantTotalPrice\"));\n  const top = para(al(x, \"totalPrice\"));\n  const hbIndirim = para(al(x, \"totalHBDiscount\", \"totalHbDiscount\"));\n  const brut = merchantTop || top + hbIndirim;\n  // Oran yoksa komisyon tutarından bulunur\n  const kom = para(al(x, \"commission\"));\n  const oran = al(x, \"commissionRate\") ?? (kom > 0 && brut > 0 ? Math.round((kom / brut) * 10000) / 100 : null);\n  return {\n    siparisNo: String(al(x, \"orderNumber\") ?? ust.orderNumber ?? \"\"),\n    paket: String(al(x, \"packageNumber\") ?? ust.packageNumber ?? \"\"),\n    kalem: String(al(x, \"lineItemId\", \"id\", \"orderLineId\") ?? \"\"),\n    tarih: al(x, \"orderDate\") ?? ust.orderDate ?? null,\n    ham: String(al(x, \"status\") ?? ust.status ?? \"\"),\n    sku: String(al(x, \"merchantSku\") ?? \"\"),\n    hbSku: String(al(x, \"hbSku\", \"sku\") ?? \"\"),\n    barkod: String(al(x, \"productBarcode\") ?? \"\"),\n    ad: String(al(x, \"productName\", \"name\") ?? \"\"),\n    adet: +al(x, \"quantity\") || 1,\n    brut: Math.round(brut * 100) / 100,\n    kdvOran: al(x, \"vatRate\") != null ? +al(x, \"vatRate\") : null,\n    komOran: oran != null ? (+oran < 1 ? +oran * 100 : +oran) : null,\n  };\n}\nasync function hbSayfali(env, yol, limit, sinir) {\n  const hepsi = [];\n  for (let s = 0, offset = 0; s < sinir; s++, offset += limit) {\n    const v = await hbIstek(env, `${yol}${yol.includes(\"?\") ? \"&\" : \"?\"}offset=${offset}&limit=${limit}`);\n    const l = hbListe(v);\n    hepsi.push(...l);\n    const toplam = v && !Array.isArray(v) ? +al(v, \"totalCount\") : NaN;\n    if (l.length < limit || (toplam && offset + limit >= toplam)) break;\n  }\n  return hepsi;\n}\n// Son N günün Hepsiburada siparişleri: paketlenecekler + paketler (tam bilgi), kargo/teslim/iptal (durum)\nasync function hbSiparisler(env, gun) {\n  const m = env.HB_MERCHANT_ID;\n  const sinir = Date.now() - gun * 864e5;\n  const satirlar = [];\n  for (const x of await hbSayfali(env, `/orders/merchantid/${m}`, 50, 10)) {\n    const k = hbKalem(x);\n    satirlar.push({ ...k, ham: k.ham || \"Open\" }); // bu listede yalnız paketlenecek siparişler var\n  }\n  for (const p of await hbSayfali(env, `/packages/merchantid/${m}?timespan=${Math.max(24, gun * 24)}`, 10, 20)) {\n    const ust = { packageNumber: al(p, \"packageNumber\"), orderDate: al(p, \"orderDate\"), status: \"Packaged\" };\n    for (const x of al(p, \"items\") || []) satirlar.push({ ...hbKalem(x, ust), ham: \"Packaged\" });\n  }\n  const durumlar = [];\n  const ekle = async (yol, ham, tarihAlani, sayfa = 10) => {\n    for (const x of await hbSayfali(env, yol, 50, sayfa)) {\n      const t = al(x, tarihAlani);\n      if (t && Date.parse(t) < sinir) continue;\n      durumlar.push({\n        siparisNo: String(al(x, \"orderNumber\") ?? \"\"),\n        paket: String(al(x, \"packageNumber\") ?? \"\"),\n        kalem: String(al(x, \"lineItemId\") ?? \"\"),\n        ham,\n        tarih: t ?? null,\n      });\n    }\n  };\n  await ekle(`/packages/merchantid/${m}/shipped`, \"InTransit\", \"shippedDate\");\n  await ekle(`/packages/merchantid/${m}/delivered`, \"Delivered\", \"deliveredDate\");\n  await ekle(`/packages/merchantid/${m}/undelivered`, \"Undelivered\", \"undeliveredDate\", 4);\n  await ekle(`/orders/merchantid/${m}/cancelled`, \"Cancelled\", \"cancelDate\", 4);\n  return { satirlar, durumlar };\n}\n// Tek siparişin kalemleri (yalnız uygulamada bilinmeyen eski siparişler için). Cevabın biçimi belgede yok:\n// içinde adet ve ürün bilgisi olan her nesne kalem sayılır.\nasync function hbSiparisDetay(env, no) {\n  const v = await hbIstek(env, `/orders/merchantid/${env.HB_MERCHANT_ID}/ordernumber/${encodeURICompone *{box-sizing:border-box}

<script>
"use strict";
/* ---------- Hesap motoru: fiyat_hesap.py ile aynı maliyet formülü ---------- */
const VARSAYILAN = {
  filamentKg:600, fire:12, makineSaat:15, iscilikSaat:300, ambalaj:20,
  kdv:20, kdvMahsup:true, stopajOran:1, stopajGider:true, iadeParcaKayip:true,
  hedefMarj:20, kritikMarj:10,
  sabitKesinti:true, ayarSurum:2, kargo:[{ust:300,tl:87.5},{ust:0,tl:98.34}], iadeKargo:87.5,
  kanallar:{Trendyol:{komisyon:4,sabit:0,hizmet:13.19},Hepsiburada:{komisyon:15,sabit:10,hizmet:0},N11:{komisyon:15,sabit:0,hizmet:0}},
  onay:{uretim:false,kargo:false,komisyon:false}
};
function uretimKirilim(u,A){
  const fil=(+u.gram||0)*(1+(+A.fire||0)/100)*(+A.filamentKg||0)/1000;
  const mak=(+u.saat||0)*(+A.makineSaat||0);
  const isc=((+u.iscilikDk||0)/60)*(+A.iscilikSaat||0);
  const amb=u.ambalaj===""||u.ambalaj==null?(+A.ambalaj||0):+u.ambalaj;
  return {fil,mak,isc,amb,toplam:fil+mak+isc+amb,kdvli:fil+amb};
}
function maliyetVar(u){return !!u&&(+u.gram>0||+u.saat>0||u.elMaliyet>0)}
function birimMaliyet(u,A){
  if(u&&u.elMaliyet>0)return {fil:0,mak:0,isc:0,amb:0,toplam:+u.elMaliyet,kdvli:+u.elMaliyet};
  return u?uretimKirilim(u,A):{fil:0,mak:0,isc:0,amb:0,toplam:0,kdvli:0};
}
function kargoTarife(tutar,A){
  for(const b of A.kargo){if(+b.ust>0&&tutar<=+b.ust)return +b.tl}
  const son=A.kargo[A.kargo.length-1];return son?+son.tl:0;
}
/* Tüm giderler KDV dahil kabul edilir. Net = KDV dahil satış - giderler - net KDV - stopaj */
function netHesap({brut,kdv,komisyon,kargo,hizmet,uretim,uretimKdvli},A){
  const k=kdv/100;
  const satisKdv=brut*k/(1+k);
  const giderKdv=A.kdvMahsup?((komisyon+kargo+hizmet+uretimKdvli)*0.2/1.2):0;
  const netKdv=satisKdv-giderKdv;
  const stopaj=A.stopajGider?(brut/(1+k))*(+A.stopajOran||0)/100:0;
  const net=brut-komisyon-kargo-hizmet-uretim-netKdv-stopaj;
  const kdvHaric=brut/(1+k);
  const stopajTL=(brut/(1+k))*(+A.stopajOran||0)/100;
  const kdvTL=satisKdv;
  const kalan=brut-kdvTL-komisyon-kargo-hizmet-stopajTL;
  return {brut,komisyon,kargo,hizmet,uretim,netKdv,stopaj,net,marj:kdvHaric>0?net/kdvHaric*100:0,kdvHaric,stopajTL,kdvTL,kalan};
}
function fiyatTest(fiyat,u,kanal,A,komOran){
  const K=A.kanallar[kanal]||{komisyon:0,sabit:0,hizmet:0};
  const m=birimMaliyet(u,A);
  const oran=komOran!=null&&komOran!==""?+komOran:(!A.sabitKesinti&&u&&u.komisyon!=null&&u.komisyon!==""&&kanal==="Trendyol"?+u.komisyon:+K.komisyon);
  return netHesap({brut:fiyat,kdv:u&&+u.kdv?+u.kdv:+A.kdv,komisyon:fiyat*oran/100+(+K.sabit||0),kargo:kargoTarife(fiyat,A),hizmet:+K.hizmet||0,uretim:m.toplam,uretimKdvli:m.kdvli},A);
}
function fiyatBul(hedefMarj,u,kanal,A,komOran){
  let alt=1,ust=200000;
  if(fiyatTest(ust,u,kanal,A,komOran).marj<hedefMarj)return null;
  for(let i=0;i<60;i++){const o=(alt+ust)/2;if(fiyatTest(o,u,kanal,A,komOran).marj>=hedefMarj)ust=o;else alt=o}
  /* Kargo baremi fiyatla atladığı için en düşük geçerli fiyat taranır */
  let p=Math.ceil((ust+0.01)/5)*5-0.01;
  for(let d=5;d<ust;d+=5){const a=Math.ceil((d+0.01)/5)*5-0.01;if(fiyatTest(a,u,kanal,A,komOran).marj>=hedefMarj){p=a;break}}
  return p;
}
function paketKey(k){return k.kanal+"|"+k.paket}
/* Paket düzeyindeki kargo ve hizmet bedeli satırlara ciro payına göre bölünür. */
function satirlariHesapla(kalemler,urunler,A,kargolar){
  const paketler=new Map();
  for(const k of kalemler){if(k.durum==="iptal")continue;const key=paketKey(k);if(!paketler.has(key))paketler.set(key,[]);paketler.get(key).push(k)}
  const sonuc=[];
  for(const satirlar of paketler.values()){
    const p=satirlar[0];
    const K=A.kanallar[p.kanal]||{komisyon:0,sabit:0,hizmet:0};
    const toplamBrut=satirlar.reduce((t,k)=>t+(k.durum==="iade"?0:+k.brut||0),0);
    const sabit=A.sabitKesinti&&p.kanal==="Trendyol";
    const fat=!sabit&&kargolar&&kargolar[p.siparisNo];
    const kargoGercek=fat&&fat.gidis>0;
    const gidis=kargoGercek?fat.gidis/(fat.paket||1):(!sabit&&p.kargoTL!=null?+p.kargoTL:kargoTarife(toplamBrut||satirlar.reduce((t,k)=>t+(+k.brut||0),0),A));
    const iadeVar=satirlar.some(k=>k.durum==="iade");
    const donus=iadeVar?(sabit?gidis:(fat&&fat.iade>0?fat.iade/(fat.paket||1):+A.iadeKargo||0)):0;
    const kargoPaket=gidis+donus;
    const hizmetPaket=+K.hizmet||0;
    const pay0=satirlar.length;
    for(const k of satirlar){
      /* Stok kodu birden çok üründe aynı olabilir; önce tekil olan barkoda bakılır */
      const u=urunler[k.barkod]||urunler[k.sku]||null;
      const iade=k.durum==="iade";
      const brut=iade?0:(+k.brut||0);
      const pay=toplamBrut>0?brut/toplamBrut:(1/pay0);
      const oran=sabit?+K.komisyon:(k.komisyonOran!=null?+k.komisyonOran:(u&&u.komisyon!=null&&u.komisyon!==""?+u.komisyon:+K.komisyon));
      const komGercek=!sabit&&k.komisyonTL!=null;
      const kom=iade?0:(komGercek?+k.komisyonTL:brut*oran/100+(+K.sabit||0)*pay);
      const m=birimMaliyet(u,A);
      const adet=+k.adet||1;
      const kayip=iade&&!A.iadeParcaKayip;
      const uretim=kayip?0:m.toplam*adet;
      const n=netHesap({brut,kdv:k.kdvOran!=null?+k.kdvOran:(u&&+u.kdv?+u.kdv:+A.kdv),komisyon:kom,kargo:kargoPaket*pay,hizmet:hizmetPaket*pay,uretim,uretimKdvli:kayip?0:m.kdvli*adet},A);
      sonuc.push({...n,k,u,oran,adet,komGercek,kargoGercek:!!kargoGercek||(!sabit&&p.kargoTL!=null),maliyetEksik:!maliyetVar(u),iade});
    }
  }
  return sonuc.sort((a,b)=>b.k.tarih-a.k.tarih);
}
function topla(s){
  const t={brut:0,kdvHaric:0,netKdv:0,komisyon:0,kargo:0,hizmet:0,stopaj:0,uretim:0,net:0,stopajTL:0,kdvTL:0,kalan:0,adet:0,iade:0};
  const pk=new Set();
  for(const r of s){for(const a of ["brut","kdvHaric","netKdv","komisyon","kargo","hizmet","stopaj","uretim","net","stopajTL","kdvTL","kalan"])t[a]+=r[a];if(!r.iade)t.adet+=r.adet;else t.iade++;pk.add(paketKey(r.k))}
  t.paket=pk.size;t.marj=t.kdvHaric>0?t.net/t.kdvHaric*100:0;return t;
}
/* ---------- Veri deposu: Claude'da db, telefonda localStorage ---------- */
const Depo={
  db:null,
  bellek:{},
  async baslat(){
    if(window.claude&&window.claude.use){try{this.db=await window.claude.use("db")}catch(e){this.db=null}}
  },
  async hepsi(){
    const cikti={};
    if(this.db){
      const snap=await this.db.collection("veri").get();
      snap.docs.forEach(d=>{cikti[d.id]=d.data()});
      return cikti;
    }
    try{for(let i=0;i<localStorage.length;i++){const a=localStorage.key(i);if(a.startsWith("kar:"))cikti[a.slice(4)]=JSON.parse(localStorage.getItem(a))}}catch(e){}
    return cikti;
  },
  async yaz(ad,veri){
    if(this.db){await this.db.collection("veri").doc(ad).set(veri);return}
    try{localStorage.setItem("kar:"+ad,JSON.stringify(veri))}catch(e){uyar(e&&e.name==="QuotaExceededError"?"Telefonda yer kalmadı. Yedek alıp eski veriyi temizle.":"Bu görünümde kayıt yapılamıyor. Gizli sekmedeysen normal sekmede aç.")}
  },
  async sil(ad){
    if(this.db){await this.db.collection("veri").doc(ad).delete();return}
    try{localStorage.removeItem("kar:"+ad)}catch(e){}
  },
  kopruAl(){try{return JSON.parse(localStorage.getItem("karCihaz:kopru")||"{}")}catch(e){return {}}},
  kopruYaz(v){try{localStorage.setItem("karCihaz:kopru",JSON.stringify(v))}catch(e){}}
};
const artifactte=!!window.claude;
const D={ayar:JSON.parse(JSON.stringify(VARSAYILAN)),urunler:{},kalemler:{},kargolar:{},odemeler:{},hizmetFatura:{},sonCekim:null,veriSurum:0,yuklendi:false};
const G={sekme:"ozet",donem:"buay",kanal:"Hepsi",sipFiltre:"tum",urunAra:"",fiyatSku:"",fiyatKanal:"Trendyol",fiyat:"",fiyatKom:"",hedefMarj:"",kampanya:""};
let yazZaman={};
function yazErtele(ad,uret){clearTimeout(yazZaman[ad]);yazZaman[ad]=setTimeout(()=>{Depo.yaz(ad,uret()).catch(()=>uyar("Kaydedilemedi. İnternet bağlantını kontrol et."))},500)}
function ayarKaydet(){yazErtele("ayarlar",()=>D.ayar)}
function urunlerKaydet(){yazErtele("urunler",()=>({u:D.urunler}))}
async function kalemleriKaydet(){
  const aylar={};
  for(const k of Object.values(D.kalemler)){const a=ayAnahtar(k.tarih);(aylar[a]=aylar[a]||[]).push(k)}
  for(const [a,liste] of Object.entries(aylar)){
    for(let i=0;i*600<liste.length;i++)await Depo.yaz("kalem_"+a+"_"+i,{k:liste.slice(i*600,(i+1)*600)});
  }
  await Depo.yaz("finans",{kargolar:D.kargolar,odemeler:D.odemeler,hizmetFatura:D.hizmetFatura,sonCekim:D.sonCekim,veriSurum:D.veriSurum});
}
function ayAnahtar(ms){const t=new Date(ms);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")}
function birlestirAyar(a){
  const v=JSON.parse(JSON.stringify(VARSAYILAN));
  const sonuc={...v,...a,kanallar:{...v.kanallar,...(a.kanallar||{})},onay:{...v.onay,...(a.onay||{})},kargo:a.kargo&&a.kargo.length?a.kargo:v.kargo};
  if(a.ayarSurum!==v.ayarSurum){sonuc.ayarSurum=v.ayarSurum;sonuc.sabitKesinti=v.sabitKesinti;sonuc.kargo=v.kargo;sonuc.iadeKargo=v.iadeKargo;sonuc.kanallar.Trendyol=v.kanallar.Trendyol}
  return sonuc;
}
async function yukle(){
  await Depo.baslat();
  let h={};
  try{h=await Depo.hepsi()}catch(e){uyar("Kayıtlı veri okunamadı. Sayfayı yenile.")}
  if(h.ayarlar)D.ayar=birlestirAyar(h.ayarlar);
  if(h.urunler&&h.urunler.u)D.urunler=h.urunler.u;
  else if(window.BASLANGIC_URUNLER){window.BASLANGIC_URUNLER.forEach(u=>{D.urunler[u.sku]=u})}
  for(const [ad,v] of Object.entries(h)){if(ad.startsWith("kalem_")&&v.k)v.k.forEach(k=>{D.kalemler[k.id]=k})}
  if(h.finans){D.kargolar=h.finans.kargolar||{};D.odemeler=h.finans.odemeler||{};D.hizmetFatura=h.finans.hizmetFatura||{};D.sonCekim=h.finans.sonCekim||null;D.veriSurum=h.finans.veriSurum||0}
  D.yuklendi=true;ciz();
}
/* ---------- Örnek veri: gerçek sipariş yokken ekranı göstermek için ---------- */
const ORNEK_URUN={"ORNEK-A":{sku:"ORNEK-A",ad:"Örnek ürün A (el freni düğmesi)",fiyat:249.99,gram:12,saat:1.2,komisyon:15,kdv:20},"ORNEK-B":{sku:"ORNEK-B",ad:"Örnek ürün B (bardaklık)",fiyat:499.99,gram:95,saat:7,komisyon:15,kdv:20},"ORNEK-C":{sku:"ORNEK-C",ad:"Örnek ürün C (4'lü klips, düşük fiyat)",fiyat:119.99,gram:30,saat:3,komisyon:15,kdv:20}};
function ornekKalemler(){
  const c=[];let t=7;const r=()=>(t=(t*16807)%2147483647)/2147483647;const su=Date.now();const sku=Object.keys(ORNEK_URUN);
  for(let g=0;g<55;g++){
    const n=Math.floor(r()*3);
    for(let i=0;i<n;i++){
      const s=sku[Math.floor(r()*3)];const u=ORNEK_URUN[s];const z=r();
      c.push({id:"o"+g+"-"+i,kanal:z<.68?"Trendyol":z<.9?"Hepsiburada":"N11",paket:"O"+g+i,siparisNo:"O"+g+i,tarih:su-g*864e5-3600e3*5,durum:r()<.07?"iade":r()<.12?"yolda":"teslim",sku:s,ad:u.ad,adet:1,brut:u.fiyat,kdvOran:20,komisyonOran:15});
    }
  }
  return c;
}
function gorunen(){
  const gercek=Object.values(D.kalemler);
  return gercek.length?{kalemler:gercek,urunler:D.urunler,ornek:false}:{kalemler:ornekKalemler(),urunler:{...D.urunler,...ORNEK_URUN},ornek:true};
}

const $=(s,k=document)=>k.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt0=new Intl.NumberFormat("tr-TR",{maximumFractionDigits:0});

function donemAralik(d){
  const su=new Date();const b=new Date(su.getFullYear(),su.getMonth(),su.getDate());
  if(d==="buay"){const s=new Date(su.getFullYear(),su.getMonth(),1);const u=su.getTime();const onS=new Date(su.getFullYear(),su.getMonth()-1,1).getTime();return {s:s.getTime(),e:u,os:onS,oe:s.getTime(),ad:"Bu ay",onAd:"geçen ay"}}
  if(d==="gecenay"){const s=new Date(su.getFullYear(),su.getMonth()-1,1);const e=new Date(su.getFullYear(),su.getMonth(),1);return {s:s.getTime(),e:e.getTime(),os:new Date(su.getFullYear(),su.getMonth()-2,1).getTime(),oe:s.getTime(),ad:"Geçen ay",onAd:"önceki ay"}}
  const g=d==="7"?7:30;const s=b.getTime()-(g-1)*864e5;return {s,e:su.getTime(),os:s-g*864e5,oe:s,ad:"Son "+g+" gün",onAd:"önceki "+g+" gün"};
}
function marjRozet(m,A){return m<0?'<span class="rozet bad">▼ Zarar</span>':m<+A.kritikMarj?'<span class="rozet warn">! Az kalıyor</span>':'<span class="rozet ok">✓ Kârlı</span>'}

const SEKME=[

/* ---------- Özet ---------- */
/* ---------- Bekleyen siparişler: henüz kargoya verilmemiş olanlar ----------
   Trendyol: Created, Picking, Invoiced, UnPacked, Repack. Hepsiburada: Open, Unpacked (paketlenecek), Packaged (paketli, kargoya verilmedi). n11 kalem durumu (belgeye göre, gerçek veride doğrulanmadı):
   1 işlem bekliyor, 2 ödendi, 5 kabul edildi, 14 kargo gecikti, 15 zamanında kargoya verilmedi.
   Excel'den gelen satırda durum yazısına bakılır. Durumu bilinmeyen eski kayıt bekleyen sayılmaz. */
const BEKLEYEN_TY=new Set(["Created","Picking","Invoiced","UnPacked","Repack"]);
const BEKLEYEN_N11=new Set(["1","2","5","14","15"]);
const BEK_KANAL=[["Trendyol","Trendyol"],["Hepsiburada","Hepsiburada"],["N11","n11"]];
function bekliyorMu(k){
  if(!k.ham||k.durum==="iptal"||k.durum==="iade"||k.durum==="teslim")return false;
  if(k.kanal==="Trendyol")return BEKLEYEN_TY.has(k.ham);
  if(k.kanal==="N11")return BEKLEYEN_N11.has(k.ham);
  if(k.kanal==="Hepsiburada"&&k.kaynak==="api")return BEKLEYEN_HB.has(k.ham);
  return /bekl|yeni|onay|hazırla|paketle|işlem/i.test(k.ham)&&!/kargo(ya verildi|da)|yolda|gönderildi/i.test(k.ham);
}
/* Bugün ve içinde bulunulan takvim ayı (1'inden bugüne, 30 gün değil): iptal hariç sipariş sayısı (paket) ve satış tutarı, tüm mağazalar */
function bugunCiz(kalemler){
  const g=new Date();g.setHours(0,0,0,0);const bugun=g.getTime();
  const ayBas=new Date(g.getFullYear(),g.getMonth(),1).getTime();
  const ayAd=g.toLocaleString("tr-TR",{month:"long"});
  const say=bas=>{const l=kalemler.filter(k=>k.tarih>=bas&&k.durum!=="iptal");return {paket:new Set(l.map(k=>k.kanal+"|"+k.paket)).size,tl:l.reduce((a,k)=>a+(+k.brut||0),0)}};
  const b=say(bugun),m=say(ayBas);
  return `<div class="gunkutu">${[["Bugün",b],[ayAd,m]].map(([ad,v])=>`<div class="gk"><span class="ad">${ad}</span><b>${fmt0.format(v.paket)} <small>sipariş</small></b><span class="tut">${tl0(v.tl)}</span></div>`).join("")}</div>`;
}
/* Bu ayın günleri: her gün kaç sipariş (paket) geldi, kaç TL; iptal hariç, tüm mağazalar. En yeni gün üstte. */
function gunlerCiz(kalemler){
  const bugun=new Date();bugun.setHours(0,0,0,0);
  const gunler=[];
  for(let d=new Date(bugun.getFullYear(),bugun.getMonth(),1);d<=bugun;d.setDate(d.getDate()+1))gunler.push(new Date(d));
  const satir=gunler.map(g=>{const s=g.getTime(),e=new Date(g.getFullYear(),g.getMonth(),g.getDate()+1).getTime();
    const l=kalemler.filter(k=>k.tarih>=s&&k.tarih<e&&k.durum!=="iptal");
    return {g,paket:new Set(l.map(k=>k.kanal+"|"+k.paket)).size,tl:l.reduce((a,k)=>a+(+k.brut||0),0)}}).reverse();
  const maks=Math.max(1,...satir.map(x=>x.tl));
  const satisli=satir.filter(x=>x.paket);
  const ort=satisli.length?satisli.reduce((a,x)=>a+x.tl,0)/satir.length:0;
  const en=satisli.length?satisli.reduce((a,x)=>x.tl>a.tl?x:a):null;
  const gunAd=g=>g.toLocaleDateString("tr-TR",{day:"numeric",month:"short"})+" "+g.toLocaleDateString("tr-TR",{weekday:"short"});
  return `<section class="kart"><div class="satirbas"><h2>Günler</h2><span class="not">Günlük ortalama ${tl0(ort)}${en?` · en iyi gün ${en.g.getDate()} ${en.g.toLocaleDateString("tr-TR",{month:"long"})}`:""}</span></div>
    <div class="gunler">${satir.map((x,i)=>`<div class="gs${i===0?" bugun":""}${x.paket?"":" bos"}"><span class="tarih">${i===0?"Bugün":gunAd(x.g)}</span><div class="cubuk"><div class="dolu" style="width:${x.tl/maks*100}%"></div></div><span class="adet">${x.paket} sip.</span><span class="tut">${tl0(x.tl)}</span></div>`).join("")}</div>
  </section>`;
}
function bekleyenCiz(kalemler,ornek){
  if(ornek)return "";
  const bek=kalemler.filter(bekliyorMu);
  const veriVar=new Set(kalemler.filter(k=>k.ham).map(k=>k.kanal));
  if(HB.bagli)veriVar.add("Hepsiburada");
  const sec=G.bekKanal&&veriVar.has(G.bekKanal)?G.bekKanal:"";
  const liste=bek.filter(k=>!sec||k.kanal===sec).sort((a,b)=>a.tarih-b.tarih);
  const paketSay=l=>new Set(l.map(k=>k.kanal+"|"+k.paket)).size;
  const kutular=BEK_KANAL.map(([k,ad])=>{
    const l=bek.filter(x=>x.kanal===k);const var_=veriVar.has(k);
    return `<button class="bkutu${sec===k?" secili":""}" ${var_?`data-bek="${k}" aria-pressed="${sec===k}"`:"disabled"}><span class="ad">${ad}</span><b>${var_?paketSay(l):"–"}</b><small>${var_?(l.length?"bekliyor":"hepsi kargoda"):"bağlanmadı"}</small></button>`;
  }).join("");
  const gun=t=>{const g=Math.floor((Date.now()-t)/864e5);return g<1?"bugün":g+" gün önce"};
  return `<section class="kart bekleyen"><div class="satirbas"><h2>Bekleyen siparişler</h2>${sec?`<button class="btn kucuk ikinci" data-bek="">Tümü</button>`:""}</div>
    <div class="btoplam"><b>${paketSay(bek)}</b><span>kargoya verilmeyi bekleyen sipariş</span></div>
    <div class="bkutular">${kutular}</div>
    ${liste.length?`<div class="liste">${liste.slice(0,40).map(k=>`<div class="oge"><span><span class="ad">${esc(temizAd(k.ad)||k.sku||"Ürün")}</span><br><span class="kod">${esc(k.kanal==="N11"?"n11":k.kanal)} · ${esc(k.siparisNo||k.paket)}${k.adet>1?" · "+k.adet+" adet":""}</span></span><span class="sag">${gun(k.tarih)}<small>${tarihYaz(k.tarih)}</small></span></div>`).join("")}</div>${liste.length>40?'<p class="not">İlk 40 satır gösteriliyor.</p>':""}`:`<p class="not">${sec?"Bu mağazada":"Şu an"} bekleyen sipariş yok.</p>`}
  </section>`;
}

}
/* ---------- Kontrol: Trendyol'un kestiği ile olması gereken ---------- */
function kontrolBul(sat){
  const c=[];
  sat.forEach(r=>{
    if(r.iade||!r.komGercek||r.k.komisyonOran==null)return;
    const bek=r.brut*r.k.komisyonOran/100;
    if(Math.abs(bek-r.komisyon)>1)c.push({r,tur:"Komisyon",bek,ger:r.komisyon,not:`Oran ${yuzde(r.k.komisyonOran)}`});
  });
  const pk=new Set();
  sat.forEach(r=>{
    const f=D.kargolar[r.k.siparisNo];if(!f||pk.has(r.k.siparisNo))return;pk.add(r.k.siparisNo);
    const ud=r.u&&+r.u.desi;
    if(ud&&f.desi&&f.desi>ud*r.adet)c.push({r,tur:"Desi",bek:ud*r.adet,ger:f.desi,not:"Faturadaki desi ürün desisinden büyük",adet:true});
    const tarif=kargoTarife(r.brut,D.ayar);
    if(D.ayar.onay.kargo&&f.gidis>tarif*1.2)c.push({r,tur:"Kargo",bek:tarif,ger:f.gidis,not:"Tarifenin %20'sinden fazla"});
  });
  return c;
}
function yaklasanOdeme(){
  const su=Date.now();
  return Object.entries(D.odemeler).map(([t,tutar])=>({t:+t,tutar})).filter(y=>y.t>=su-864e5).sort((a,b)=>a.t-b.t).slice(0,6);
}

/* ---------- Trendyol köprüsü ---------- */
const DURUM_TY={Delivered:"teslim",Cancelled:"iptal",UnSupplied:"iptal",Returned:"iade",UnDelivered:"iade"};
async function kopru(yol,par){
  const K=Depo.kopruAl();
  const u=new URL(K.adres.replace(/\/+$/,"")+yol);
  Object.entries(par||{}).forEach(([a,v])=>u.searchParams.set(a,v));
  const c=await fetch(u.toString(),{headers:{"X-Erisim-Kodu":K.kod}});
  if(c.status===401||c.status===403){const h=new Error(c.status===401?"Erişim kodu ya da Trendyol anahtarı yanlış.":"Trendyol isteği reddetti (403). Anahtarların yetkisini kontrol et.");h.yetki=true;throw h}
  if(c.status===429)throw new Error("Trendyol kısa süreli sınır koydu. Bir dakika sonra tekrar dene.");
  if(!c.ok){let m="";try{m=(await c.json()).hata||""}catch(e){}throw new Error(m||("Trendyol hata verdi: "+c.status))}
  return c.json();
}
async function sayfaliCek(yol,par,boyut,dur){
  const sonuc=[];let sayfa=0,top=1;
  while(sayfa<top&&sayfa<50){
    const c=await kopru(yol,{...par,page:sayfa,size:boyut});
    (c.content||[]).forEach(x=>sonuc.push(x));
    top=c.totalPages||1;sayfa++;if(dur)dur(sonuc.length);
  }
  return sonuc;
}
function tyKalem(p,l,i){
  let brut=0;

/* ---------- Otomatik yenileme: yalnız uygulama açık ve görünürken, köprü kuruluysa çalışır.
   Son 3 günün siparişleri 5 dakikada bir, komisyon ve kargo faturası günde bir kez alınır.

function excelOku(dosya,cb){
  const r=new FileReader();
  r.onload=()=>{try{
    const wb=XLSX.read(new Uint8Array(r.result),{type:"array",cellDates:false});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const sat=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
    let bas=sat.findIndex(x=>x.filter(c=>c!=="").length>=3);if(bas<0)bas=0;
    const bas2=sat.slice(bas,bas+6).findIndex(x=>x.some(c=>/sipariş|siparis|barkod|paket/i.test(String(c))));
    if(bas2>0)bas+=bas2;
    const baslik=sat[bas].map(String);
    const eslesme={};
    EX_ALAN.forEach(([a,,tak])=>{for(const t of tak){const i=baslik.findIndex(b=>norm(b)===t);if(i>=0){eslesme[a]=i;break}}});
    cb({baslik,satirlar:sat.slice(bas+1).filter(x=>x.some(c=>c!=="")),eslesme});
  }catch(e){uyar("Dosya okunamadı. .xlsx ya da .csv seç.")}};
  r.readAsArrayBuffer(dosya);
}
function sayiOku(v){
  if(typeof v==="number")return v;const s=String(v==null?"":v).replace(/[^\d,.\-]/g,"");if(!s)return null;
  const t=s.lastIndexOf(","),n=s.lastIndexOf(".");
  return parseFloat(t>n?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,""));
}
function tarihOku(v){
  if(typeof v==="number"&&v>20000&&v<80000)return Math.round((v-25569)*864e5+new Date().getTimezoneOffset()*6e4);
  if(typeof v==="number")return v>1e11?v:NaN;
  const s=String(v||"").trim();const m=s.match(/(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})(?:[ T](\d{1,2}):(\d{2}))?/);
  if(m){const y=+m[3]<100?2000+ +m[3]:+m[3];return new Date(y,+m[2]-1,+m[1],+m[4]||0,+m[5]||0).getTime()}
  const d=Date.parse(s);return isNaN(d)?NaN:d;
}
function durumOku(v){
  const s=norm(v);
  if(/iptal|cancel|tedarik edile/.test(s))return "iptal";
  if(/iade|return|teslim edilemedi|undeliver/.test(s))return "iade";
  if(/teslim|deliver|tamamlan/.test(s))return "teslim";
  return "yolda";
}
function excelCevir(ex,kanal){
  const al=(s,a)=>ex.eslesme[a]!=null?s[ex.eslesme[a]]:"";
  const c=[];let atla=0;
  ex.satirlar.forEach((s,i)=>{
    const tarih=tarihOku(al(s,"tarih"));const brut=sayiOku(al(s,"brut"));
    if(isNaN(tarih)||brut==null||isNaN(brut)){atla++;return}
    const pk=String(al(s,"paket")||al(s,"siparisNo")||("x"+i));const sku=String(al(s,"sku")||al(s,"barkod")||"").trim();
    const kor=sayiOku(al(s,"komisyonOran"));const ktl=sayiOku(al(s,"komisyonTL"));const kgo=sayiOku(al(s,"kargoTL"));
    c.push({id:kanal.slice(0,2).toUpperCase()+"-"+pk+"-"+(sku||i),kanal,paket:pk,siparisNo:String(al(s,"siparisNo")||pk),tarih,durum:durumOku(al(s,"durum")),ham:String(al(s,"durum")||""),sku,barkod:String(al(s,"barkod")||""),ad:String(al(s,"ad")||""),adet:sayiOku(al(s,"adet"))||1,brut,komisyonOran:kor!=null&&!isNaN(kor)?kor:null,komisyonTL:ktl!=null&&!isNaN(ktl)?Math.abs(ktl):null,kargoTL:kgo!=null&&!isNaN(kgo)?Math.abs(kgo):null,desi:sayiOku(al(s,"desi")),kaynak:"excel"});
  });
  return {c,atla};
}

    c.forEach(k=>{D.kalemler[k.id]=k;const an=k.kanal==="Trendyol"&&k.barkod?k.barkod:k.sku;if(an){const o=D.urunler[an]||{sku:an,stok:k.sku,ad:k.ad,barkod:k.barkod};if(k.komisyonOran!=null&&k.kanal==="Trendyol")o.komisyon=k.komisyonOran;if(!o.fiyat&&k.adet)o.fiyat=Math.round(k.brut/k.adet*100)/100;D.urunler[an]=o}});
    await Depo.yaz("urunler",{u:D.urunler});await kalemleriKaydet();exDurum=null;uyar(c.length+" satır eklendi.");G.sekme="ozet";ciz();
  };
}
async function yedekAl(){
  const veri=JSON.stringify({uyg:"arayx-kar-paneli",tarih:Date.now(),ayar:D.ayar,urunler:D.urunler,kalemler:Object.values(D.kalemler),kargolar:D.kargolar,odemeler:D.odemeler,hizmetFatura:D.hizmetFatura,sonCekim:D.sonCekim});

  if(artifactte){
    let dl=null;try{dl=await window.claude.use("downloads")}catch(e){}

    uyar("Bu görünümde dosya indirilemiyor.");return;

  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([veri],{type:"application/json"}));a.download=ad;document.body.appendChild(a);a.click();a.remove();

function yedekYukle(ev){
  const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{
    const v=JSON.parse(r.result);if(v.uyg!=="arayx-kar-paneli")throw 0;
    D.ayar=birlestirAyar(v.ayar||{});D.urunler=v.urunler||{};D.kalemler={};(v.kalemler||[]).forEach(k=>{D.kalemler[k.id]=k});D.kargolar=v.kargolar||{};D.odemeler=v.odemeler||{};D.hizmetFatura=v.hizmetFatura||{};D.sonCekim=v.sonCekim||null;
    await Depo.yaz("ayarlar",D.ayar);await Depo.yaz("urunler",{u:D.urunler});await kalemleriKaydet();uyar("Yedek yüklendi.");ciz();
  }catch(e){uyar("Bu dosya Kâr Paneli yedeği değil.")}};
  r.readAsText(f);
}
