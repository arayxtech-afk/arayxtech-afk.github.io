function urunTablo(l){
  if(!l.length)return '<p class="not">Bu dönemde satış yok.</p>';
  return `<div class="tablo-kap"><table><thead><tr><th>Ürün</th><th class="r">Adet</th><th class="r">Net kâr</th></tr></thead><tbody>${l.map(u=>`<tr><td>${esc(u.ad)}${u.eksik?' <span class="rozet warn">maliyet yok</span>':""}</td><td class="r">${u.adet}</td><td class="r ${u.net<0?"eksi":""}">${tl0(u.net)}</td></tr>`).join("")}</tbody></table></div>`;
}
function gunlukGrafik(s,ar){
  if(!s.length)return '<p class="not">Bu dönemde sipariş yok.</p>';
  const gunler=[];for(let g=new Date(ar.s);g.getTime()<ar.e;g.setDate(g.getDate()+1))gunler.push({t:g.getTime(),net:0,n:0});
  const bul=ms=>{const d=new Date(ms);d.setHours(0,0,0,0);return gunler.find(g=>{const x=new Date(g.t);x.setHours(0,0,0,0);return x.getTime()===d.getTime()})};
  s.forEach(r=>{const g=bul(r.k.tarih);if(g){g.net+=r.net;g.n++}});
  const W=Math.max(300,Math.min(1000,($("#ekran").clientWidth||360)-30)),H=210,sol=46,sag=6,ust=10,alt=24;
  const mx=Math.max(...gunler.map(g=>g.net),0),mn=Math.min(...gunler.map(g=>g.net),0);
  const adim=temizAdim((mx-mn)||1);const ustD=Math.ceil(mx/adim)*adim;const altD=Math.floor(mn/adim)*adim;
  const y=v=>ust+(ustD-v)/((ustD-altD)||1)*(H-ust-alt);
  const bw=(W-sol-sag)/gunler.length;const kal=Math.min(24,Math.max(3,bw-2));
  let tik="";for(let v=altD;v<=ustD+1e-6;v+=adim){tik+=`<line x1="${sol}" x2="${W-sag}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${sol-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${kisa(v)}</text>`}
  const bas=gunler.map((g,i)=>{
    const x=sol+i*bw+(bw-kal)/2;const y0=y(0),y1=y(g.net);const h=Math.abs(y1-y0);
    if(!g.n||h<.5)return "";
    const r=Math.min(4,h,kal/2);
    const d=g.net>=0?`M${x},${y0}V${y1+r}Q${x},${y1} ${x+r},${y1}H${x+kal-r}Q${x+kal},${y1} ${x+kal},${y1+r}V${y0}Z`:`M${x},${y0}V${y1-r}Q${x},${y1} ${x+r},${y1}H${x+kal-r}Q${x+kal},${y1} ${x+kal},${y1-r}V${y0}Z`;
    return `<path d="${d}" fill="${g.net>=0?"var(--bar)":"var(--bad)"}"/>`;
  }).join("");
  const hit=gunler.map((g,i)=>`<rect class="vur" x="${sol+i*bw}" y="${ust}" width="${bw}" height="${H-ust-alt}" fill="transparent" data-i="${i}" data-g="${esc(gunYaz(g.t))}" data-n="${esc(tl(g.net))}" data-s="${g.n}"/>`).join("");
  const eti=[0,Math.floor((gunler.length-1)/2),gunler.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${sol+i*bw+bw/2}" y="${H-7}" text-anchor="${i===0?"start":i===gunler.length-1?"end":"middle"}" font-size="11" fill="var(--muted)">${esc(gunYaz(gunler[i].t))}</text>`).join("");
  return `<div class="grafik"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Günlük net kâr sütun grafiği">${tik}${bas}${eti}${hit}</svg></div>
  <details><summary>Tablo olarak gör</summary><div class="tablo-kap"><table><thead><tr><th>Gün</th><th class="r">Satır</th><th class="r">Net kâr</th></tr></thead><tbody>${gunler.filter(g=>g.n).reverse().map(g=>`<tr><td>${esc(gunYaz(g.t))}</td><td class="r">${g.n}</td><td class="r ${g.net<0?"eksi":""}">${tl(g.net)}</td></tr>`).join("")}</tbody></table></div></details>`;
}
function temizAdim(a){const k=Math.pow(10,Math.floor(Math.log10(a/3)));const o=a/3/k;return (o<=1?1:o<=2?2:o<=5?5:10)*k}
function kisa(v){return Math.abs(v)>=1000?new Intl.NumberFormat("tr-TR",{maximumFractionDigits:1}).format(v/1000)+"B":fmt0.format(v)}
function grafikBagla(k){
  const g=$(".grafik",k);if(!g)return;let ip=null;
  const goster=t=>{if(!t||!t.classList.contains("vur"))return;if(!ip){ip=document.createElement("div");ip.className="ipucu";g.appendChild(ip)}
    ip.textContent=`${t.dataset.g}: ${t.dataset.n}${t.dataset.s==="0"?" (sipariş yok)":""}`;
    const b=t.getBoundingClientRect(),o=g.getBoundingClientRect();
    ip.style.left=Math.max(70,Math.min(o.width-70,b.left-o.left+b.width/2))+"px";ip.style.top="26px"};
  g.addEventListener("pointermove",ev=>goster(document.elementFromPoint(ev.clientX,ev.clientY)));
  g.addEventListener("pointerdown",ev=>goster(ev.target));
  g.addEventListener("pointerleave",()=>{if(ip){ip.remove();ip=null}});
}

function kontrolBul(sat){
  const c=[];
  sat.forEach(r=>{
    if(r.iade||!r.komGercek||r.k.komisyonOran==null)return;
    const bek=r.brut*r.k.komisyonOran/100;
    if(Math.abs(bek-r.komisyon)>1)c.push({r,tur:"Komisyon",bek,ger:r.komisyon,not:`Oran ${yuzde(r.k.komisyonOran)}`});
  });
  const pk=new Set();
  sat.forEach(r=>{
    const f=D.kargolar[r.k.siparisNo];if(!f||pk.has(r.k.siparisNo))return;pk.add(r.k.siparisNo);
    const ud=r.u&&+r.u.desi;
    if(ud&&f.desi&&f.desi>ud*r.adet)c.push({r,tur:"Desi",bek:ud*r.adet,ger:f.desi,not:"Faturadaki desi ürün desisinden büyük",adet:true});
    const tarif=kargoTarife(r.brut,D.ayar);
    if(D.ayar.onay.kargo&&f.gidis>tarif*1.2)c.push({r,tur:"Kargo",bek:tarif,ger:f.gidis,not:"Tarifenin %20'sinden fazla"});
  });
  return c;
}

const DURUM_TY={Delivered:"teslim",Cancelled:"iptal",UnSupplied:"iptal",Returned:"iade",UnDelivered:"iade"};
async function kopru(yol,par){
  const K=Depo.kopruAl();
  const u=new URL(K.adres.replace(/\/+$/,"")+yol);
  Object.entries(par||{}).forEach(([a,v])=>u.searchParams.set(a,v));
  const c=await fetch(u.toString(),{headers:{"X-Erisim-Kodu":K.kod}});
  if(c.status===401||c.status===403){const h=new Error(c.status===401?"Erişim kodu ya da Trendyol anahtarı yanlış.":"Trendyol isteği reddetti (403). Anahtarların yetkisini kontrol et.");h.yetki=true;throw h}
  if(c.status===429)throw new Error("Trendyol kısa süreli sınır koydu. Bir dakika sonra tekrar dene.");
  if(!c.ok){let m="";try{m=(await c.json()).hata||""}catch(e){}throw new Error(m||("Trendyol hata verdi: "+c.status))}
  return c.json();
}
async function sayfaliCek(yol,par,boyut,dur){
  const sonuc=[];let sayfa=0,top=1;
  while(sayfa<top&&sayfa<50){
    const c=await kopru(yol,{...par,page:sayfa,size:boyut});
    (c.content||[]).forEach(x=>sonuc.push(x));
    top=c.totalPages||1;sayfa++;if(dur)dur(sonuc.length);
  }
  return sonuc;
}
function tyKalem(p,l,i){
  let brut=0;
  const adet=+l.quantity||1;
  if(l.discountDetails&&l.discountDetails.length){l.discountDetails.forEach(d=>{brut+=(+d.lineItemPrice||0)+(+d.lineItemTyDiscount||0)})}
  else brut=((+l.lineUnitPrice||0)+(+l.lineTyDiscount||0))*adet;
  return {id:"TY-"+p.shipmentPackageId+"-"+(l.lineId||i),kanal:"Trendyol",paket:String(p.shipmentPackageId),siparisNo:String(p.orderNumber||""),tarih:+p.orderDate,durum:DURUM_TY[p.status]||DURUM_TY[l.orderLineItemStatusName]||"yolda",sku:l.stockCode||l.barcode||"",barkod:l.barcode||"",ad:l.productName||"",adet,brut:Math.round(brut*100)/100,kdvOran:l.vatRate!=null?+l.vatRate:null,komisyonOran:l.commission!=null?+l.commission:null,desi:+p.cargoDeci||null,kaynak:"api"};
}
async function siparisAl(s,e,siparisPaket){
  let n=0;
  const pk=await sayfaliCek("/siparisler",{startDate:s,endDate:e,orderByField:"PackageLastModifiedDate",orderByDirection:"DESC"},200);
  pk.forEach(p=>{
    (siparisPaket[p.orderNumber]=siparisPaket[p.orderNumber]||new Set()).add(p.shipmentPackageId);
    (p.lines||[]).forEach((l,i)=>{
      const k=tyKalem(p,l,i);const es=D.kalemler[k.id];
      D.kalemler[k.id]=es?{...es,...k,komisyonTL:es.komisyonTL}:k;n++;
      const sku=k.sku;if(sku){const o=D.urunler[sku]||{sku,ad:k.ad,barkod:k.barkod};if(k.komisyonOran!=null)o.komisyon=k.komisyonOran;if(k.kdvOran!=null)o.kdv=k.kdvOran;D.urunler[sku]=o}
    });
  });
  return n;
}
async function trendyolCek(gun,dur){
  const su=Date.now();const bas=su-gun*864e5;const dilim=14*864e5;
  const pencere=[];for(let s=bas;s<su;s+=dilim)pencere.push([s,Math.min(s+dilim,su)]);
  dur("Ürünler alınıyor");
  const urunler=await sayfaliCek("/urunler",{},100);
  urunler.forEach(c=>(c.variants||[]).forEach(v=>{
    const sku=v.stockCode||v.barcode;if(!sku)return;
    const o=D.urunler[sku]||{sku};
    o.ad=c.title||o.ad;o.barkod=v.barcode||o.barkod;o.kdv=v.vatRate!=null?+v.vatRate:o.kdv;
    const fy=v.price&&v.price.salePrice;if(fy!=null)o.fiyat=+fy;
    D.urunler[sku]=o;
  }));
  let n=0;
  const siparisPaket={};
  for(const [s,e] of pencere){
    dur("Siparişler alınıyor ("+n+")");
    n+=await siparisAl(s,e,siparisPaket);
  }
  /* Hakediş ya da kargo adımı hata verirse siparişler kaybolmasın */
  await Depo.yaz("urunler",{u:D.urunler});
  await kalemleriKaydet();
  dur("Hakedişler alınıyor");
  const kom=new Map();const odeme={};const gorulen=new Set();
  for(const [s,e] of pencere){
    const son=Math.min(e,s+15*864e5);
    const k=await sayfaliCek("/hakedis",{transactionTypes:"Sale,Return",startDate:s,endDate:son},1000);
    k.forEach(x=>{
      if(x.id!=null){if(gorulen.has(x.id))return;gorulen.add(x.id)}
      if(x.paymentDate&&x.sellerRevenue!=null){const g=new Date(+x.paymentDate);g.setHours(0,0,0,0);const a=g.getTime();odeme[a]=(odeme[a]||0)+(x.transactionType==="Return"?-1:1)*Math.abs(+x.sellerRevenue)}
      if(x.transactionType!=="Sale"||!x.shipmentPackageId)return;
      const a=x.shipmentPackageId+"|"+x.barcode;kom.set(a,(kom.get(a)||0)+Math.abs(+x.commissionAmount||0));
    });
  }
  Object.assign(D.odemeler,odeme);
  Object.values(D.kalemler).forEach(k=>{if(k.kanal==="Trendyol"){const a=k.paket+"|"+k.barkod;if(kom.has(a))k.komisyonTL=Math.round(kom.get(a)*100)/100}});
  dur("Kargo faturaları alınıyor");
  const hizmet={};const fatGorulen=new Set();
  for(const [s,e] of pencere){
    const fat=await sayfaliCek("/diger-finans",{transactionType:"DeductionInvoices",startDate:s,endDate:Math.min(e,s+15*864e5)},1000);
    for(const f of fat){
      if(f.id!=null){if(fatGorulen.has(f.id))continue;fatGorulen.add(f.id)}
      const tur=String(f.transactionType||"");
      if(/kargo\s*fatura/i.test(tur)&&f.id){
        const satir=await sayfaliCek("/kargo-fatura/"+encodeURIComponent(f.id),{},500);
        satir.forEach(c=>{
          const o=D.kargolar[c.orderNumber]=D.kargolar[c.orderNumber]||{gidis:0,iade:0,desi:0,paket:1,fat:{}};
          if(siparisPaket[c.orderNumber])o.paket=siparisPaket[c.orderNumber].size;
          const anah=f.id+"|"+c.parcelUniqueId+"|"+c.shipmentPackageType;if(o.fat[anah])return;o.fat[anah]=1;
          if(/iade/i.test(c.shipmentPackageType||""))o.iade+=+c.amount||0;else{o.gidis+=+c.amount||0;o.desi=Math.max(o.desi,+c.desi||0)}
        });
      }else if(/hizmet|platform/i.test(tur+" "+(f.description||""))){
        const a=ayAnahtar(+f.transactionDate||s);hizmet[a]=(hizmet[a]||0)+Math.abs(+f.debt||+f.credit||0);
      }
    }
  }
  Object.assign(D.hizmetFatura,hizmet);
  D.sonCekim=Date.now();
  dur("Kaydediliyor");
  await Depo.yaz("urunler",{u:D.urunler});
  await kalemleriKaydet();
  return n;
}
/* ---------- Otomatik yenileme: yalnız uygulama açık ve görünürken, köprü kuruluysa çalışır.
   Son 3 günün siparişleri 5 dakikada bir, komisyon ve kargo faturası günde bir kez alınır.
   Sadece ekler ve günceller; hata olursa eldeki veriye dokunmaz. */
const OTO={son:0,calisiyor:null,durdu:false,hata:"",kismi:"",basari:0,tamDeneme:0};
const OTO_ARALIK=5*6e4,OTO_DONUS=2*6e4,OTO_TAM=24*36e5,OTO_TAM_TEKRAR=36e5;
function otoHazir(){const K=Depo.kopruAl();return !artifactte&&!!K.adres&&!!K.kod&&!OTO.durdu&&document.visibilityState==="visible"&&D.yuklendi}
function imza(){return Object.values(D.kalemler).map(k=>k.id+"|"+k.durum+"|"+k.komisyonTL).sort().join(";")}
function otoYenile(esik){
  if(!otoHazir()||OTO.calisiyor||Date.now()-OTO.son<esik)return Promise.resolve(false);
  OTO.son=Date.now();
  const soz=(async()=>{
    const once=imza();const eskiSayi=Object.keys(D.kalemler).length;
    let tamOldu=false;
    try{
      const su=Date.now();
      if(su-(D.sonCekim||0)>=OTO_TAM&&su-OTO.tamDeneme>=OTO_TAM_TEKRAR){
        OTO.tamDeneme=su;
        try{await trendyolCek(30,()=>{});tamOldu=true;OTO.kismi=""}
        catch(x){if(x.yetki)throw x;OTO.kismi="Komisyon ve kargo faturası alınamadı: "+x.message}
      }
      if(!tamOldu){
        await siparisAl(su-3*864e5,su,{});
        if(imza()!==once){await Depo.yaz("urunler",{u:D.urunler});await kalemleriKaydet()}
      }
      OTO.hata="";OTO.basari=Date.now();
    }catch(x){
      OTO.hata=x.message||"Güncellenemedi";
      if(x.yetki)OTO.durdu=true;
    }
    const yeni=Object.keys(D.kalemler).length-eskiSayi;
    if(yeni>0)uyar(yeni+" yeni sipariş satırı geldi.");
    if((tamOldu||imza()!==once)&&!$("#perde")&&(G.sekme==="ozet"||G.sekme==="siparis"))ciz();else etiketYaz();
    return true;
  })().finally(()=>{if(OTO.calisiyor===soz)OTO.calisiyor=null});
  OTO.calisiyor=soz;
  return soz;
}

let exDurum=null;
function norm(s){return String(s==null?"":s).toLocaleLowerCase("tr-TR").replace(/\s+/g," ").trim()}
function excelOku(dosya,cb){
  const r=new FileReader();
  r.onload=()=>{try{
    const wb=XLSX.read(new Uint8Array(r.result),{type:"array",cellDates:false});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const sat=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
    let bas=sat.findIndex(x=>x.filter(c=>c!=="").length>=3);if(bas<0)bas=0;
    const bas2=sat.slice(bas,bas+6).findIndex(x=>x.some(c=>/sipariş|siparis|barkod|paket/i.test(String(c))));
    if(bas2>0)bas+=bas2;
    const baslik=sat[bas].map(String);

function sayiOku(v){
  if(typeof v==="number")return v;const s=String(v==null?"":v).replace(/[^\d,.\-]/g,"");if(!s)return null;
  const t=s.lastIndexOf(","),n=s.lastIndexOf(".");
  return parseFloat(t>n?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,""));

function tarihOku(v){
  if(typeof v==="number"&&v>20000&&v<80000)return Math.round((v-25569)*864e5+new Date().getTimezoneOffset()*6e4);
  if(typeof v==="number")return v>1e11?v:NaN;
  const s=String(v||"").trim();const m=s.match(/(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})(?:[ T](\d{1,2}):(\d{2}))?/);
  if(m){const y=+m[3]<100?2000+ +m[3]:+m[3];return new Date(y,+m[2]-1,+m[1],+m[4]||0,+m[5]||0).getTime()}
  const d=Date.parse(s);return isNaN(d)?NaN:d;

function durumOku(v){

        <li><span>Cloudflare'da <b>Workers &amp; Pages → Create → Start with Hello World</b>. Adını <span class="mono">arayx-kar</span> koy, Deploy et.</span></li>
        <li><span><b>Edit code</b>'a gir, içindekini sil, köprü kodunu yapıştır, Deploy et.${window.KOPRU_KODU?`<br><button class="btn kucuk ikinci" id="kopruKopya" style="margin-top:6px">Köprü kodunu kopyala</button><textarea id="kopruMetin" aria-label="Köprü kodu" rows="4" readonly hidden style="width:100%;margin-top:6px;font-size:16px"></textarea>`:""}</span></li>
        <li><span>Trendyol satıcı panelinde <b>Hesap Bilgilerim → Entegrasyon Bilgileri</b>'nden API Key ve Secret'ı al.</span></li>
        <li><span>Worker'ın <b>Settings → Variables and Secrets</b> bölümüne Secret olarak ekle: <span class="mono">TRENDYOL_SATICI_ID</span>, <span class="mono">TRENDYOL_API_KEY</span>, <span class="mono">TRENDYOL_API_SECRET</span>, <span class="mono">ERISIM_KODU</span>.</span></li>
        <li><span>Erişim kodunu buradan üret, kopyala, Cloudflare'a da aynısını yapıştır:</span></li>
      </ol>
      <div class="sira" style="margin-top:8px"><button class="btn kucuk ikinci" id="kodUret">Kod üret</button><span class="kopya" id="kodGoster" hidden></span></div>
    </details>
    <div class="alanlar">
      <div class="alan"><label for="kAdres">Worker adresi</label><input id="kAdres" type="url" placeholder="https://arayx-kar.….workers.dev" value="${esc(K.adres||"")}"></div>
      <div class="alan"><label for="kKod">Erişim kodu</label><input id="kKod" type="password" autocomplete="off" value="${esc(K.kod||"")}"></div>
    </div>
    <div class="sira"><button class="btn" id="kCek" ${K.adres&&K.kod?"":"disabled"}>Son 30 günü çek</button><button class="btn ikinci" id="kTest" ${K.adres&&K.kod?"":"disabled"}>Bağlantıyı dene</button><span class="not" id="kDurum" role="status">${esc(OTO.hata||OTO.kismi||(D.sonCekim?"Son tam çekim: "+tarihYaz(D.sonCekim):""))}</span></div>
    <p class="not">Uygulama açıkken siparişler 5 dakikada bir kendiliğinden yenilenir, komisyon ve kargo faturası günde bir kez alınır. Uygulama kapalıyken yenilenmez. Trendyol geçmiş siparişleri yaklaşık 1 ay tuttuğu için ayda en az bir kez aç, eski kayıtlar burada kalır.</p>`}
  </section>
  <section class="kart"><h2>Excel'den sipariş yükle</h2><p class="not">Trendyol, Hepsiburada ya da N11 panelinden indirdiğin sipariş dosyası. Alıcı adı ve adres okunmaz, kaydedilmez. Aynı dosyayı iki kez yüklersen çift saymaz.</p>
    <div class="alanlar"><div class="alan"><label for="exKanal">Kanal</label><select id="exKanal">${Object.keys(A.kanallar).map(k=>`<option>${esc(k)}</option>`).join("")}</select></div>
    <div class="alan"><label for="exDosya">Dosya</label><input id="exDosya" type="file" accept=".xlsx,.xls,.csv"></div></div>
    <div id="exEsle"></div>
  </section>
  <section class="kart" id="ayarlar"><h2>Hesap ayarları</h2>
    <h3>Üretim maliyeti</h3>
    <div class="alanlar">${sayi("filamentKg","Filament TL/kg",A.filamentKg)}${sayi("fire","Fire %",A.fire)}${sayi("makineSaat","Makine TL/saat",A.makineSaat)}${sayi("iscilikSaat","İşçilik TL/saat",A.iscilikSaat)}${sayi("ambalaj","Ambalaj TL",A.ambalaj)}</div>
    <label class="onay"><input type="checkbox" data-onay="uretim" ${A.onay.uretim?"checked":""}><span>Bu rakamlar benim gerçek maliyetlerim</span></label>
    <h3>Kargo (KDV dahil, panelindeki tarife)</h3>
    <div class="alanlar">${kargoS}${sayi("iadeKargo","İade kargosu TL",A.iadeKargo)}</div>
    <p class="not">Trendyol bağlıyken gerçek kargo faturası bunların yerine geçer. Başlangıçtaki 80 TL örnektir.</p>
    <label class="onay"><input type="checkbox" data-onay="kargo" ${A.onay.kargo?"checked":""}><span>Tarifemi panelden kontrol ettim</span></label>
    <h3>Kanal kesintileri</h3>
    <div class="tablo-kap"><table><thead><tr><th>Kanal</th><th>Komisyon %</th><th>Sabit TL</th><th>Hizmet TL/paket</th></tr></thead><tbody>${kanal}</tbody></table></div>
    <p class="not">Trendyol'da gerçek komisyon her siparişten okunur. Başlangıç oranları örnektir, hizmet bedeli 0 girilidir.</p>
    <label class="onay"><input type="checkbox" data-onay="komisyon" ${A.onay.komisyon?"checked":""}><span>Komisyon ve hizmet bedelimi panelden kontrol ettim</span></label>
    <h3>Vergi ve hedef</h3>
    <div class="alanlar">${sayi("kdv","Satış KDV %",A.kdv)}${sayi("stopajOran","Stopaj %",A.stopajOran)}${sayi("hedefMarj","Hedef net marj %",A.hedefMarj)}${sayi("kritikMarj","Uyarı marjı %",A.kritikMarj)}</div>
    <label class="onay"><input type="checkbox" data-sec="kdvMahsup" ${A.kdvMahsup?"checked":""}><span>Giderlerin KDV'sini mahsup ediyorum (net KDV). KDV mükellefi değilsen kapat.</span></label>
    <label class="onay"><input type="checkbox" data-sec="stopajGider" ${A.stopajGider?"checked":""}><span>Stopajı gider say. Yıl sonu vergiden düşülebildiği için kapatmak isteyebilirsin; muhasebecine sor.</span></label>
    <label class="onay"><input type="checkbox" data-sec="iadeParcaKayip" ${A.iadeParcaKayip?"checked":""}><span>İade gelen parçayı tekrar satamıyorum (maliyeti zarar yazılır)</span></label>
  </section>
  <section class="kart"><h2>Yedek</h2><p class="not">${n} sipariş satırı, ${Object.keys(D.urunler).length} ürün kayıtlı.</p>
    <div class="sira"><button class="btn ikinci" id="yedekAl">Yedeği indir</button><label class="btn ikinci" for="yedekDosya" style="display:inline-flex;align-items:center">Yedekten yükle</label><input id="yedekDosya" type="file" accept=".json" hidden></div>
    <div class="sira" id="silKutu"><button class="btn tehlike" id="silBas">Siparişleri sil</button></div>
  </section>`;
  veriBagla(e);
}
function veriBagla(e){
  const A=D.ayar;
  e.querySelectorAll("[data-ayar]").forEach(i=>i.addEventListener("input",()=>{A[i.dataset.ayar]=+i.value;ayarKaydet()}));
  e.querySelectorAll("[data-kg]").forEach(i=>i.addEventListener("input",()=>{A.kargo[+i.dataset.kg].tl=+i.value;ayarKaydet()}));
  e.querySelectorAll("[data-kn]").forEach(i=>i.addEventListener("input",()=>{A.kanallar[i.dataset.kn][i.dataset.ka]=+i.value;ayarKaydet()}));
  e.querySelectorAll("[data-onay]").forEach(i=>i.addEventListener("change",()=>{A.onay[i.dataset.onay]=i.checked;ayarKaydet()}));
  e.querySelectorAll("[data-sec]").forEach(i=>i.addEventListener("change",()=>{A[i.dataset.sec]=i.checked;ayarKaydet()}));
  const kU=$("#kodUret");if(kU)kU.onclick=()=>{const b=new Uint8Array(24);crypto.getRandomValues(b);const k=[...b].map(x=>x.toString(16).padStart(2,"0")).join("");const g=$("#kodGoster");g.hidden=false;g.textContent=k;$("#kKod").value=k;Depo.kopruYaz({...Depo.kopruAl(),kod:k});if(navigator.clipboard)navigator.clipboard.writeText(k).then(()=>uyar("Kod kopyalandı. Cloudflare'a yapıştır."),()=>{})};
  const kP=$("#kopruKopya");if(kP)kP.onclick=()=>{const goster=()=>{const t=$("#kopruMetin");t.hidden=false;t.value=window.KOPRU_KODU;t.focus();t.select();uyar("Kopyalanamadı. Kutudaki kodu seçip elle kopyala.")};if(navigator.clipboard)navigator.clipboard.writeText(window.KOPRU_KODU).then(()=>uyar("Köprü kodu kopyalandı. Cloudflare'a yapıştır."),goster);else goster()};
  const kA=$("#kAdres"),kK=$("#kKod");
  const kopruGuncelle=()=>{Depo.kopruYaz({adres:kA.value.trim(),kod:kK.value.trim()});OTO.durdu=false;const h=kA.value.trim()&&kK.value.trim();$("#kCek").disabled=!h;$("#kTest").disabled=!h};
  if(kA){kA.addEventListener("input",kopruGuncelle);kK.addEventListener("input",kopruGuncelle)}
  const kT=$("#kTest");if(kT)kT.onclick=async()=>{const d=$("#kDurum");d.textContent="Deneniyor";try{await kopru("/durum");const c=await kopru("/urunler",{page:0,size:1});OTO.durdu=false;OTO.hata="";d.textContent="Bağlantı çalışıyor. Mağazada "+(c.totalElements??"?")+" ürün görünüyor."}catch(x){d.textContent=x.message==="Failed to fetch"?"Worker'a ulaşılamadı. Adresi kontrol et.":x.message}};
  const kC=$("#kCek");if(kC)kC.onclick=async()=>{
    const d=$("#kDurum");kC.disabled=true;
    const onceki=OTO.calisiyor;
    const soz=(async()=>{if(onceki)await onceki;return trendyolCek(30,m=>{d.textContent=m})})();
    OTO.calisiyor=soz;
    try{const n=await soz;OTO.durdu=false;OTO.hata="";OTO.kismi="";OTO.basari=Date.now();uyar(n+" sipariş satırı alındı.");G.sekme="ozet";ciz()}
    catch(x){d.textContent=x.message==="Failed to fetch"?"Worker'a ulaşılamadı. Adresi kontrol et.":x.message}
    finally{if(OTO.calisiyor===soz)OTO.calisiyor=null;OTO.son=Date.now();const b=$("#kCek");if(b)b.disabled=false}
  };
  $("#exDosya").addEventListener("change",ev=>{const f=ev.target.files[0];if(!f)return;if(typeof XLSX==="undefined"){uyar("Excel okuyucu yüklenemedi. İnternetini kontrol edip sayfayı yenile.");return}excelOku(f,ex=>{exDurum=ex;excelEsleCiz()})});
  $("#yedekAl").onclick=yedekAl;
  $("#yedekDosya").addEventListener("change",yedekYukle);
  $("#silBas").onclick=()=>{$("#silKutu").innerHTML=`<span class="not">${Object.keys(D.kalemler).length} sipariş satırı silinecek. Ürünler ve maliyetler kalır.</span><button class="btn tehlike" id="silEvet">Evet, sil</button><button class="btn ikinci" id="silVaz">Vazgeç</button>`;
    $("#silVaz").onclick=()=>ciz();
    $("#silEvet").onclick=async()=>{const h=await Depo.hepsi();for(const a of Object.keys(h))if(a.startsWith("kalem_"))await Depo.sil(a);await Depo.sil("finans");D.kalemler={};D.kargolar={};D.odemeler={};D.hizmetFatura={};D.sonCekim=null;uyar("Siparişler silindi.");ciz()}};
}
function excelEsleCiz(){
  const ex=exDurum;const k=$("#exEsle");
  const zor=["tarih","brut"];const secim=EX_ALAN.map(([a,et])=>`<div class="alan"><label for="eş${a}">${et}${zor.includes(a)?" *":""}</label><select id="eş${a}" data-es="${a}"><option value="">Yok</option>${ex.baslik.map((b,i)=>`<option value="${i}" ${ex.eslesme[a]===i?"selected":""}>${esc(b)}</option>`).join("")}</select></div>`).join("");
  k.innerHTML=`<p class="not" style="margin-block:8px"><b>${ex.satirlar.length} satır</b> bulundu. Sütunlar doğru eşleşmiş mi kontrol et.</p><div class="alanlar">${secim}</div><div class="sira" style="margin-top:10px"><button class="btn" id="exAl">Siparişleri ekle</button><span class="not" id="exOn"></span></div>`;
  k.querySelectorAll("[data-es]").forEach(s=>s.onchange=()=>{const v=s.value;if(v==="")delete ex.eslesme[s.dataset.es];else ex.eslesme[s.dataset.es]=+v;onizle()});
  const onizle=()=>{const {c,atla}=excelCevir(ex,$("#exKanal").value);const t=c.reduce((a,b)=>a+(b.durum==="iptal"?0:b.brut),0);$("#exOn").textContent=`${c.length} satır okunacak, toplam ${tl(t)}${atla?`, ${atla} satır atlanacak (tarih ya da tutar okunamadı)`:""}.`};
  onizle();
  $("#exAl").onclick=async()=>{
    const {c}=excelCevir(ex,$("#exKanal").value);
    if(!c.length){uyar("Okunacak satır yok. Tarih ve tutar sütununu seç.");return}
    c.forEach(k=>{D.kalemler[k.id]=k;if(k.sku){const o=D.urunler[k.sku]||{sku:k.sku,ad:k.ad,barkod:k.barkod};if(k.komisyonOran!=null&&k.kanal==="Trendyol")o.komisyon=k.komisyonOran;if(!o.fiyat&&k.adet)o.fiyat=Math.round(k.brut/k.adet*100)/100;D.urunler[k.sku]=o}});
    await Depo.yaz("urunler",{u:D.urunler});await kalemleriKaydet();exDurum=null;uyar(c.length+" satır eklendi.");G.sekme="ozet";ciz();
  };
}
async function yedekAl(){
  const veri=JSON.stringify({uyg:"arayx-kar-paneli",tarih:Date.now(),ayar:D.ayar,urunler:D.urunler,kalemler:Object.values(D.kalemler),kargolar:D.kargolar,odemeler:D.odemeler,hizmetFatura:D.hizmetFatura,sonCekim:D.sonCekim});
  const ad="arayx-kar-yedek-"+new Date().toISOString().slice(0,10)+".json";
  if(artifactte){
    let dl=null;try{dl=await window.claude.use("downloads")}catch(e){}
    if(dl){try{await dl.save({filename:ad,data:veri});return}catch(e){return}}
    uyar("Bu görünümde dosya indirilemiyor.");return;
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([veri],{type:"application/json"}));a.download=ad;document.body.appendChild(a);a.click();a.remove();
}
function yedekYukle(ev){
  const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{
    const v=JSON.parse(r.result);if(v.uyg!=="arayx-kar-paneli")throw 0;
    D.ayar=birlestirAyar(v.ayar||{});D.urunler=v.urunler||{};D.kalemler={};(v.kalemler||[]).forEach(k=>{D.kalemler[k.id]=k});D.kargolar=v.kargolar||{};D.odemeler=v.odemeler||{};D.hizmetFatura=v.hizmetFatura||{};D.sonCekim=v.sonCekim||null;
    await Depo.yaz("ayarlar",D.ayar);await Depo.yaz("urunler",{u:D.urunler});await kalemleriKaydet();uyar("Yedek yüklendi.");ciz();
  }catch(e){uyar("Bu dosya Kâr Paneli yedeği değil.")}};
  r.readAsText(f);
}
/* ---------- Olay yönlendirme ---------- */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-sekme],[data-git],[data-donem],[data-kanal],[data-urun],[data-sipf]");if(!t)return;
  if(t.dataset.sekme){G.sekme=t.dataset.sekme;ciz();scrollTo(0,0)}
  else if(t.dataset.git){G.sekme=t.dataset.git;ciz();const h=t.dataset.odak&&document.getElementById(t.dataset.odak);if(h)h.scrollIntoView();else scrollTo(0,0)}
  else if(t.dataset.donem){G.donem=t.dataset.donem;ciz()}
  else if(t.dataset.kanal){G.kanal=t.dataset.kanal;ciz()}
  else if(t.dataset.urun){if(D.urunler[t.dataset.urun])urunLevha(t.dataset.urun);else uyar("Örnek ürün değiştirilemez. Önce ürünlerini yükle.")}
  else if(t.dataset.sipf){G.sipFiltre=t.dataset.sipf;G.sekme="siparis";ciz()}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&$("#perde")){$("#katman").innerHTML="";ciz()}});
ciz();
yukle().then(()=>otoYenile(0));
setInterval(()=>otoYenile(OTO_ARALIK),6e4);
document.addEventListener("visibilitychange",()=>otoYenile(OTO_DONUS));
</script>

</body></html>
